# Dynamo + SGLang aggregated server (backend-agnostic).
#
# Provides only the GPU `server` task; NATS/etcd/frontend come from
# dynamo_common.yaml. Like the other Dynamo workloads, the server declares
# `required_by: [benchmark]` to wire itself to the benchmark hub.
#
# SGLang aggregation here is single-worker (intra-node tensor parallelism), so run
# it on backends/k8s.yaml or backends/slurm.yaml with SERVER_GPUS <= GPUS_PER_NODE.
# (Cross-node SGLang needs its multi-node --dist-init-addr/--nnodes/--node-rank
# wiring, which is out of scope for this minimal sample.)

version: "0.1"

variables:
  SGLANG_WATCHDOG_TIMEOUT:
    description: "Seconds the SGLang scheduler may go without progressing a batch
      before it SIGQUITs itself. The default (300) is shorter than this model's
      one-time DeepGEMM JIT pre-compile, so a request that arrives during warmup
      sat unserviced and killed a healthy worker with exit 137."
    type: integer
    value: 1800
  SERVER_IMAGE:
    description: "Dynamo SGLang runtime image"
    value: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.0
  SERVER_GPUS:
    description: "GPUs per server (tensor-parallel size)"
    type: integer
    value: 4

workflow:
  name: modular_inference
  tasks:
    - name: server
      operator: server
      script:
        - set -x
        - >
          python3 -m dynamo.sglang
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.SERVER_GPUS }}
          --host 0.0.0.0
          --watchdog-timeout ${{ variables.SGLANG_WATCHDOG_TIMEOUT }}
          --skip-tokenizer-init
          --trust-remote-code
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          interval: 20
