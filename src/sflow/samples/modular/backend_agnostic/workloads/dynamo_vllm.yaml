# Dynamo + vLLM aggregated server (backend-agnostic).
#
# Provides only the GPU `server` task; NATS/etcd/frontend come from
# dynamo_common.yaml. Like the trtllm workload, the server declares
# `required_by: [benchmark]` to wire itself to the benchmark hub.
#
# vLLM aggregation is single-worker (intra-node tensor parallelism), so run it on
# backends/k8s.yaml or backends/slurm.yaml with SERVER_GPUS <= GPUS_PER_NODE.

version: "0.1"

variables:
  SERVER_IMAGE:
    description: "Dynamo vLLM runtime image"
    value: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.0
  SERVER_GPUS:
    description: "GPUs per server (tensor-parallel size)"
    type: integer
    value: 4

workflow:
  name: modular_inference
  tasks:
    - name: server
      operator: server
      script:
        - set -x
        - >
          python3 -m dynamo.vllm
          --model ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.SERVER_GPUS }}
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30
