version: "0.1"

# Qwen3-8B (dense, FP8) — Dynamo + TensorRT-LLM AGGREGATED on a GB-style NVL72 rack
# (4 GPUs/node, e.g. GB200/GB300 NVL72). The SAME TP=8 world as the DGX variant now
# spans TWO 4-GPU nodes, so the tensor-parallel collectives ride cross-node NVLink
# (MNNVL) via an IMEX ComputeDomain channel instead of intra-node NVSwitch.
#
# What differs from the DGX variant — see qwen3_8b/README.md:
#   * backend: GPUS_PER_NODE=4, `compute_domain.channel` set (MNNVL),
#     `rdma: auto` (cross-node TP rides the MNNVL NVLink fabric; IB, if present, is unused).
#   * TP=8 spans 2 nodes -> ONE cross-node MPI world; every GPU pod claims the IMEX channel.
#
# Qwen3-8B is a DENSE model, so there is no expert parallelism / MoE config here.

variables:
  # --- Kubernetes backend ---
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods (must hold the model PVC/hostPath)"
    value: your-namespace
  GPUS_PER_NODE:
    description: "GPUs per node. GB200/GB300 NVL72 = 4, so TP=8 spans 2 nodes."
    type: integer
    value: 4
  COMPUTE_DOMAIN_CHANNEL:
    description: "IMEX ComputeDomain channel for cross-node MNNVL: a channel TEMPLATE name, 'auto' (claim the sole existing domain), or 'disable'/empty for none. Override per cluster: -s COMPUTE_DOMAIN_CHANNEL=<name>. A NAMED channel on a cluster with no ComputeDomain fails preflight."
    value: auto

  # --- Model (dense Qwen3-8B) ---
  SERVED_MODEL_NAME:
    description: "Served model name (advertised by the frontend / OpenAI API)"
    value: Qwen3-8B-FP8
  TP_SIZE:
    description: "Tensor parallel size. Default 8 => spans 2 nodes at GPUS_PER_NODE=4."
    type: integer
    value: 8
  PP_SIZE:
    description: "Pipeline parallel size"
    type: integer
    value: 1
  GPUS_PER_WORKER:
    description: "GPUs per worker == the MPI world size (TP*PP)."
    type: integer
    value: ${{ variables.TP_SIZE * variables.PP_SIZE }}
  NUM_NODES:
    description: "Nodes to reserve == ceil(GPUS_PER_WORKER / GPUS_PER_NODE). GB: 8/4 = 2."
    type: integer
    value: ${{ ((variables.GPUS_PER_WORKER / variables.GPUS_PER_NODE) | round(0, "ceil")) | int }}
  MAX_BATCH_SIZE:
    description: "Max batch size"
    type: integer
    value: 512
  MAX_NUM_TOKENS:
    description: "Max number of tokens"
    type: integer
    value: 8192
  MAX_SEQ_LEN:
    description: "Max sequence length"
    type: integer
    value: 8192
  FREE_GPU_MEMORY_FRACTION:
    description: "KV-cache free GPU memory fraction"
    value: 0.9
  KV_CACHE_DTYPE:
    description: "KV cache dtype"
    value: fp8
  EXTRA_FRONTEND_ARGS:
    description: "Extra dynamo.frontend arguments"
    value: ""
  EXTRA_SERVER_ARGS:
    description: "Extra dynamo.trtllm arguments"
    value: ""

  # --- Benchmark ---
  ISL:
    description: "Input sequence length"
    value: 4096
  OSL:
    description: "Output sequence length"
    value: 512
  MULTI_ROUND:
    description: "Number of benchmark rounds"
    value: 1
  CONCURRENCY:
    description: "Concurrency"
    value: 2
    domain: [2]

  # --- Container images ---
  AIPERF_IMAGE:
    description: "AIPerf benchmark client image"
    value: python:3.12-slim
  DYNAMO_IMAGE:
    description: "Dynamo TRT-LLM runtime image"
    value: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0

artifacts:
  - name: LOCAL_MODEL_PATH
    uri: fs:///mnt/model-cache/Qwen3-8B-FP8
  - name: SERVER_CONFIG
    uri: file://agg_config.yaml
    content: |
      backend: pytorch
      tensor_parallel_size: ${{ variables.TP_SIZE }}
      pipeline_parallel_size: ${{ variables.PP_SIZE }}
      max_batch_size: ${{ variables.MAX_BATCH_SIZE }}
      max_num_tokens: ${{ variables.MAX_NUM_TOKENS }}
      max_seq_len: ${{ variables.MAX_SEQ_LEN }}
      print_iter_log: true
      enable_chunked_prefill: true
      stream_interval: 20
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      kv_cache_config:
        dtype: ${{ variables.KV_CACHE_DTYPE }}
        free_gpu_memory_fraction: ${{ variables.FREE_GPU_MEMORY_FRACTION }}
        enable_block_reuse: false
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]

backends:
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP, so the cross-node MPI hostfile (from the assigned node IPs) works.
    host_network: true
    host_ipc: true
    scheduling: device_plugin
    # GB NVL72 = rack-scope NVLink: TP=8 spans nodes over the MNNVL fabric, so join an
    # IMEX ComputeDomain channel (every GPU pod claims it); cross-node TP rides that NVLink
    # fabric, not IB. sflow auto-detects IB if present; force RDMA off per run with
    # `--kube-rdma disable` on a cluster whose IB is down/absent (don't hard-code it here).
    rdma: auto
    compute_domain:
      channel: ${{ variables.COMPUTE_DOMAIN_CHANNEL }}
    reservation:
      timeout: 1200

operators:
  # Cross-node MPI worker (TP=8 across 2 nodes). k8s_mpi injects the hostfile/SSH glue;
  # the task keeps a plain `mpirun ... trtllm-llmapi-launch python3 -m dynamo.trtllm`.
  - name: dynamo
    type: k8s_mpi
    image: ${{ variables.DYNAMO_IMAGE }}
    shm_size: 64Gi
    run_as_root: true
    mpi:
      route: auto
      slots_per_worker: ${{ variables.GPUS_PER_NODE }}
      run_launcher_as_worker: true
      launcher_creation_policy: WaitForWorkersReady
      ssh_port: 2222
      ensure_sshd: true
  - name: k8s
    type: k8s
    image: ${{ variables.DYNAMO_IMAGE }}
  - name: aiperf
    type: k8s
    image: ${{ variables.AIPERF_IMAGE }}

workflow:
  name: gb_dynamo_trtllm_agg
  timeout: 115m

  variables:
    HEAD_NODE_IP:
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}"

  tasks:
    - name: nats_server
      operator: k8s
      script:
        - nats-server -js
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port: { port: 4222 }
          interval: 2

    - name: etcd_server
      operator: k8s
      script:
        - >
          etcd --listen-client-urls "http://0.0.0.0:2379"
          --advertise-client-urls "http://0.0.0.0:2379"
          --listen-peer-urls "http://0.0.0.0:2380"
          --initial-advertise-peer-urls "http://${HEAD_NODE_IP}:2380"
          --initial-cluster "default=http://${HEAD_NODE_IP}:2380"
          --data-dir /tmp/etcd
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port: { port: 2379 }
          interval: 2

    - name: frontend_server
      operator: k8s
      script:
        - python3 -m dynamo.frontend --http-port 8000 ${{ variables.EXTRA_FRONTEND_ARGS }}
      resources:
        nodes:
          indices: [0]
      depends_on:
        - nats_server
        - etcd_server
      probes:
        readiness:
          tcp_port: { port: 8000 }
          timeout: 300
          interval: 5

    - name: agg_server
      operator: dynamo
      resources:
        # GPUS_PER_WORKER GPUs -> spans NUM_NODES nodes as ONE MPI world over MNNVL.
        gpus:
          count: ${{ variables.GPUS_PER_WORKER }}
      script:
        - set -x
        - export TLLM_LOG_LEVEL=INFO
        - export TRTLLM_SERVER_DISABLE_GC=1
        - export TRTLLM_WORKER_DISABLE_GC=1
        - export OMPI_MCA_coll_ucc_enable=0
        - export TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}
        - unset UCX_TLS
        # Allow UCX cross-node NVLink (MNNVL) for GPU<->GPU transfer over the IMEX fabric.
        - export UCX_CUDA_IPC_ENABLE_MNNVL=y
        # ONE cross-node MPI world (TP=8) across NUM_NODES NVL72 nodes over MNNVL;
        # trtllm-llmapi-launch bootstraps the session and runs dynamo.trtllm on rank 0.
        - >
          mpirun -np ${{ variables.GPUS_PER_WORKER }} --allow-run-as-root
          trtllm-llmapi-launch
          python3 -m dynamo.trtllm
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${SERVED_MODEL_NAME}
          --extra-engine-args ${{ artifacts.SERVER_CONFIG.path }} ${EXTRA_SERVER_ARGS}
      depends_on:
        - frontend_server
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: benchmark
      operator: aiperf
      resources:
        nodes:
          indices: [0]
      script:
        - pip install aiperf==0.3.0
        - set -x
        - export COLUMNS=200
        - >
          aiperf profile --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY}
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ variables.HEAD_NODE_IP }}:8000
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "max_tokens:${{ variables.OSL }}"
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --concurrency ${CONCURRENCY}
          --request-count $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --warmup-request-count ${CONCURRENCY}
          --num-dataset-entries $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --random-seed 100
          --ui simple
        - echo "Benchmarking finished"
      replicas:
        variables:
          - CONCURRENCY
        policy: sequential
      monitor:
        resources:
          used_by_tasks:
            - agg_server
        report:
          enabled: true
      depends_on:
        - agg_server
        - frontend_server
