version: "0.1"

# GLM-5.3-Flash disaggregated prefill/decode on a Docker host pool.
#
# Converted from examples/mlperf/dynamo_sglang_disagg_glm53_v7.yaml, which runs
# the same benchmark on EOS H100 via Slurm/srun/enroot. The workload is
# unchanged -- pure sglang (no dynamo, no NATS/etcd), sglang's built-in
# disagg_router, prefill on one machine and decode on another so the KV handoff
# is a real network hop. Only the DELIVERY changed; the conversion notes below
# say how.
#
# Prerequisites:
#   - ssh from this driver to each `address` already works (sflow pre-flights it)
#   - NVIDIA Container Toolkit on both hosts
#   - the model directory exists on BOTH hosts at the same path (it is the mount
#     source; sflow bind-mounts it same-path-in-same-path-out):
#         ssh <host> ls ${MODEL_PATH}
#     or point it somewhere you already have:
#         sflow run -f ... -a LOCAL_MODEL_PATH=fs:///data/models/GLM-5.3-Flash
#   - the two hosts reach each other on PREFILL_PORT / DECODE_PORT / 8998
#   - RDMA: mooncake moves the KV cache over IB, so both hosts need working
#     /dev/infiniband and the IB_DEVICES list below must match their NICs.
#     Without IB, see "NO INFINIBAND" at the bottom of this header.
#
# ── What changed from the Slurm recipe ───────────────────────────────────────
#
#   Slurm                                  Docker pool
#   ─────────────────────────────────────  ──────────────────────────────────
#   backend type: slurm, nodes: 2          type: docker with a 2-host `hosts:`
#   account/partition/time/job_name        (dropped -- nothing schedules here)
#   extra_args: --constraint=h100          (dropped -- you name the machines)
#   operator type: srun                    type: docker_run
#   container_image: <lustre>.sqsh         image: a REGISTRY ref (see below)
#   container_mounts: <model>:<model>      (dropped -- the artifact auto-mounts)
#   container_writable: true               (dropped -- containers are writable)
#   mpi: pmix                              (dropped -- each server is one node)
#   ntasks / ntasks_per_node               resources.nodes.count / .indices
#   backends.slurm_cluster.nodes[N]        backends.docker_cluster.nodes[N]
#
# THE IMAGE is the one thing that cannot be carried over. The Slurm recipe used
# an enroot .sqsh on lustre; Docker cannot read that format. Use a registry tag
# of the same sglang nightly (it must contain glm5_next), or `docker load` it on
# both hosts once and name the resulting local tag here.
#
# ON WHICH NIC: sflow uses a host's `address` for BOTH the ssh docker endpoint
# and the address peers dial. On most machines that is the 1GbE management NIC
# -- fine for ssh, useless for KV. Give the fast fabric its own address:
#
#     hosts:
#       - name: node-0
#         address: 10.0.0.11                # ssh / docker control plane
#         rendezvous_address: 192.168.1.11  # what the peer dials for KV
#
# NO INFINIBAND: drop --device=/dev/infiniband and --cap-add=IPC_LOCK from the
# operator and set DISAGG_TRANSFER_BACKEND=nixl. Expect the KV hop to dominate:
# the upstream note on this benchmark measured ~4 GB/s aggregate for NIXL/UCX
# without accelerated IB.

variables:
  # ── Host pool ──────────────────────────────────────────────────────────────
  # Replace with your machines. An ssh alias works for the ENDPOINT (~/.ssh/config
  # supplies user, port, key and ProxyJump), but peers cannot resolve an alias --
  # set the host's `rendezvous_address` when the alias is not what they dial.
  HOST_0_ADDRESS:
    description: "Machine running prefill + router + benchmark"
    value: 10.0.0.11
  HOST_1_ADDRESS:
    description: "Machine running decode"
    value: 10.0.0.12
  SSH_USER:
    description: "SSH login for both hosts; leave empty to use your own"
    value: ""

  GPUS_PER_NODE:
    description: "GPUs per host (used by sflow for GPU placement math)"
    type: integer
    value: 8

  # One node per role, 8 GPUs each, TP=8.
  CTX_TP_SIZE:
    description: "Prefill tensor parallel size"
    type: integer
    value: 8
  GEN_TP_SIZE:
    description: "Decode tensor parallel size"
    type: integer
    value: 8

  CTX_MAX_RUNNING_REQUESTS:
    description: "Prefill max running requests"
    type: integer
    value: 128
  GEN_MAX_RUNNING_REQUESTS:
    description: "Decode max running requests; also sizes the decode mamba state pool, which counts requests still receiving KV"
    type: integer
    value: 256

  MEM_FRACTION_STATIC:
    description: "Static GPU memory fraction"
    value: "0.85"

  CHUNKED_PREFILL_SIZE:
    description: "-1 disables chunked prefill: requests split at the 16384 chunk boundary still stall waiting on inflight KV transfers"
    type: integer
    value: -1
  MAX_PREFILL_TOKENS:
    description: "Max tokens per prefill batch"
    type: integer
    value: 32768

  IB_DEVICES:
    description: "GPU-affine IB NICs. This list is the EOS H100 topology (GPU0..7 -> NIC0,3,4,5,6,9,10,11); check yours with `nvidia-smi topo -m`"
    value: "mlx5_0,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_9,mlx5_10,mlx5_11"

  DISAGG_TRANSFER_BACKEND:
    description: "KV transfer backend; mooncake needs working RDMA, nixl does not"
    value: mooncake

  BOOTSTRAP_PORT:
    description: "Prefill/decode disaggregation handshake port; must be open between the hosts"
    type: integer
    value: 8998

  # TRIED AND REJECTED -- kept as a record so nobody spends the afternoon on it
  # again. index_kpool=4 in the checkpoint is what restricts the DSA backend to
  # trtllm/tilelang/fa3, none of which build on sm120, so forcing it to 1 looks
  # like the way out. It is not: the same config sets index_kpool_compress=true,
  # and the model then dies with
  #     set_compress_tail_for_request called when kpool compress is disabled
  # i.e. the checkpoint requires the kpool indexer. Leave this EMPTY.
  #
  # (If you ever do re-enable it, note the quoting: the script runs through
  # `bash -lc`, which strips bare JSON's double quotes, so the value needs
  # single quotes inside it -- "--json-model-override-args '{\"index_kpool\":1}'".)
  KPOOL_OVERRIDE:
    description: "Disabled: index_kpool=1 is not a valid configuration for this checkpoint"
    value: ""

  SM120_WORKAROUNDS:
    description: >
      sm120 (RTX Blackwell) caps opt-in dynamic shared memory at 100KB, where
      Hopper/SM100 allow 227KB. The DSA *decode* MLA kernel asks for 148KB
      (a double-buffered 64x576 bf16 KV tile), so it cannot be built here at
      all -- and TP does not help: at 64 heads / TP4 this model is already at
      the kernel's 16-head floor. A prefill-mode server never decodes in
      steady state, so the fix is to stop anything from INSTANTIATING that
      kernel: autotune is what tripped it, decode graph capture would trip it
      next. Remove these on Hopper/SM100.
    value: "--disable-flashinfer-autotune --disable-decode-cuda-graph"

  KERNEL_ARGS:
    description: >
      DSA kernel selection. On sm120 this is NOT a performance choice, it is the
      only one that builds: `trtllm` has no sm120 kernels, `tilelang` asks for
      148KB of dynamic shared memory against sm120's 100KB cap (block_I=64 x
      num_stages=2, both hardcoded at the call site, so no flag shrinks it), and
      `flashinfer_sparse_mla` allowlists GlmMoeDsaForCausalLM* while this
      checkpoint reports Glm5NextForConditionalGeneration. `flashmla_sparse`
      comes from sgl_kernel (compiled in, unlike the absent flash_mla package)
      and pads 16 heads/rank up to the 128 Blackwell wants. On Hopper/SM100 the
      H100 cookbook set (tilelang + deep_gemm) is the faster choice.
    value: "--moe-runner-backend flashinfer_cutlass --dsa-prefill-backend flashmla_sparse --dsa-decode-backend flashmla_sparse"

  # ── Benchmark ──────────────────────────────────────────────────────────────
  ISL:
    description: "Input sequence length"
    value: 8192
  OSL:
    description: "Output sequence length"
    value: 1024
  MULTI_ROUND:
    description: "Number of benchmark rounds"
    value: 8
  CONCURRENCY:
    description: "Concurrency"
    value: 16
    domain: [16, 32, 64, 128]

  SERVED_MODEL_NAME:
    description: "Served model name"
    value: GLM-5.3-Flash

  # ── Ports ──────────────────────────────────────────────────────────────────
  # Containers run with --network=host, so these are host ports. Prefill and the
  # router share node 0, hence three distinct numbers.
  PREFILL_PORT:
    description: "Prefill server port"
    type: integer
    value: 30000
  DECODE_PORT:
    description: "Decode server port"
    type: integer
    value: 30001
  ROUTER_PORT:
    description: "Disagg router port"
    type: integer
    value: 30080

  SGLANG_IMAGE:
    description: "sglang nightly containing glm5_next. A REGISTRY ref, not the enroot .sqsh the Slurm recipe used -- Docker cannot read that format."
    value: lmsysorg/sglang:latest

artifacts:
  # Bind-mounted into every container at the same path it has on the host, so
  # --model-path means one thing on the driver, on node 0 and on node 1. The
  # directory must already exist on BOTH hosts: sflow does not copy weights, and
  # a missing bind source is created by Docker as an empty directory.
  - name: LOCAL_MODEL_PATH
    description: "GLM-5.3-Flash model weights, present on every host at this path"
    uri: fs:///path/to/GLM-5.3-Flash

backends:
  - name: docker_cluster
    type: docker
    default: true
    image: ${{ variables.SGLANG_IMAGE }}
    hosts:
      # `address` is the machine: sflow derives the ssh:// docker endpoint from
      # it AND hands it to peers as the rendezvous address.
      - name: node-0
        address: ${{ variables.HOST_0_ADDRESS }}
        user: ${{ variables.SSH_USER }}
        gpus_per_node: ${{ variables.GPUS_PER_NODE }}
      - name: node-1
        address: ${{ variables.HOST_1_ADDRESS }}
        user: ${{ variables.SSH_USER }}
        gpus_per_node: ${{ variables.GPUS_PER_NODE }}

operators:
  - name: sglang
    type: docker_run
    image: ${{ variables.SGLANG_IMAGE }}
    extra_args:
      # The image ships an application entrypoint; sflow launches through bash.
      - --entrypoint=
      # Docker builds no cross-host network. Host networking is what makes the
      # prefill/decode/router ports and the 8998 handshake reachable from the
      # other machine at the addresses declared above.
      - --network=host
      - --ipc=host
      - --shm-size=32g
      # RDMA for the mooncake KV transfer. Drop these two (and set
      # DISAGG_TRANSFER_BACKEND=nixl) on a pool without InfiniBand -- a
      # --device that does not exist fails the container at start.
      - --device=/dev/infiniband
      - --cap-add=IPC_LOCK
      # Pinning GPU memory for RDMA needs the lock limit lifted; the default
      # 64KB silently caps what mooncake can register.
      - --ulimit
      - memlock=-1:-1

workflow:
  name: sglang_glm53f_disagg_docker
  # No `timeout:`. The Slurm recipe had one, but sflow does not enforce it and
  # warns as much -- there it was really Slurm's `--time` doing the bounding.
  # A Docker pool has no scheduler, so nothing here is time-limited: the probe
  # timeouts below are what actually stop a wedged server.

  variables:
    PREFILL_NODE_IP:
      description: "Prefill host, as peers and probes dial it (node 0)"
      value: "${{ backends.docker_cluster.nodes[0].ip_address }}"
    DECODE_NODE_IP:
      description: "Decode host, as peers and probes dial it (node 1)"
      value: "${{ backends.docker_cluster.nodes[1].ip_address }}"

  tasks:
    # ── 0. Pull/warm the image on both hosts ──────────────────────────────────
    # The Slurm version warmed the enroot .sqsh with `ntasks: 2`. Here the same
    # `docker run` that prints this line is what pulls the image on each host,
    # so the first real task does not pay a multi-gigabyte pull inside its
    # readiness timeout.
    # - name: load_image
    #   operator: sglang
    #   resources:
    #     nodes:
    #       count: 2
    #   script:
    #     - echo "Image loaded on $(hostname)"
    #   probes:
    #     readiness:
    #       log_watch:
    #         match_pattern: "Image loaded"
    #         match_count: 2
    #       timeout: 1800
    #       interval: 2

    # ── 1. Prefill server (node 0, 8 GPU, TP=8) ───────────────────────────────
    - name: prefill_server
      operator: sglang
      resources:
        gpus:
          count: ${{ variables.CTX_TP_SIZE }}
      script:
        - set -x
        - export SGLANG_DISABLE_WATCHDOG=1
        - >
          python -m sglang.launch_server
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tp ${{ variables.CTX_TP_SIZE }}
          --port ${{ variables.PREFILL_PORT }}
          --host 0.0.0.0
          --trust-remote-code
          --mem-fraction-static ${{ variables.MEM_FRACTION_STATIC }}
          --quantization modelopt_fp4
          --kv-cache-dtype fp8_e4m3
          --reasoning-parser glm45
          --tool-call-parser glm47
          ${{ variables.KERNEL_ARGS }}
          ${{ variables.SM120_WORKAROUNDS }}
          ${{ variables.KPOOL_OVERRIDE }}
          --chunked-prefill-size ${{ variables.CHUNKED_PREFILL_SIZE }}
          --max-prefill-tokens ${{ variables.MAX_PREFILL_TOKENS }}
          --max-running-requests ${{ variables.CTX_MAX_RUNNING_REQUESTS }}
          --disaggregation-mode prefill
          --disaggregation-transfer-backend ${{ variables.DISAGG_TRANSFER_BACKEND }}
          --disaggregation-bootstrap-port ${{ variables.BOOTSTRAP_PORT }}
      probes:
        readiness:
          # /health returns 503 until DeepGEMM JIT warmup finishes (~5 min after
          # "Uvicorn running"); the router only activates a worker once /health
          # is 200. Probed from the driver, so the port must be reachable there.
          http_get:
            url: "http://${{ variables.PREFILL_NODE_IP }}:${{ variables.PREFILL_PORT }}/health"
          timeout: 1500
          interval: 10
        failure:
          log_watch:
            match_pattern: "Scheduler hit an exception"
      # depends_on:
      #   - load_image

    # ── 2. Decode server (node 1, 8 GPU, TP=8) ────────────────────────────────
    - name: decode_server
      operator: sglang
      resources:
        gpus:
          count: ${{ variables.GEN_TP_SIZE }}
      script:
        - set -x
        - export SGLANG_DISABLE_WATCHDOG=1
        - sleep 3600
        - >
          python -m sglang.launch_server
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tp ${{ variables.GEN_TP_SIZE }}
          --port ${{ variables.DECODE_PORT }}
          --host 0.0.0.0
          --trust-remote-code
          --mem-fraction-static ${{ variables.MEM_FRACTION_STATIC }}
          --max-running-requests ${{ variables.GEN_MAX_RUNNING_REQUESTS }}
          --disaggregation-mode decode
          --disaggregation-transfer-backend ${{ variables.DISAGG_TRANSFER_BACKEND }}
          --disaggregation-bootstrap-port ${{ variables.BOOTSTRAP_PORT }}
      probes:
        readiness:
          http_get:
            url: "http://${{ variables.DECODE_NODE_IP }}:${{ variables.DECODE_PORT }}/health"
          timeout: 1500
          interval: 10
        failure:
          log_watch:
            match_pattern: "Scheduler hit an exception"
      # depends_on:
      #   - load_image

    # ── 3. Disagg router (node 0, CPU only) ───────────────────────────────────
    - name: router
      operator: sglang
      resources:
        nodes:
          indices: [0]
      script:
        - set -x
        - >
          python -m sglang_router.launch_router
          --pd-disaggregation
          --prefill http://${{ variables.PREFILL_NODE_IP }}:${{ variables.PREFILL_PORT }}
          --decode http://${{ variables.DECODE_NODE_IP }}:${{ variables.DECODE_PORT }}
          --host 0.0.0.0
          --port ${{ variables.ROUTER_PORT }}
      probes:
        readiness:
          tcp_port:
            port: ${{ variables.ROUTER_PORT }}
          timeout: 300
          interval: 5
      depends_on:
        - prefill_server
        - decode_server

    # ── 4. aiperf load generation (node 0, CPU only) ──────────────────────────
    # Runs in the sglang image rather than a small aiperf one: --tokenizer needs
    # the model directory, which is already mounted here.
    - name: benchmark
      operator: sglang
      resources:
        nodes:
          indices: [0]
      script:
        - set -x
        - pip install --quiet aiperf==0.3.0
        - export COLUMNS=200
        - >
          aiperf profile
          --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY}
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ variables.PREFILL_NODE_IP }}:${{ variables.ROUTER_PORT }}
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "max_tokens:${{ variables.OSL }}"
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --extra-inputs "repetition_penalty:1.0"
          --extra-inputs "temperature:0.0"
          --concurrency ${CONCURRENCY}
          --request-count $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --warmup-request-count ${CONCURRENCY}
          --num-dataset-entries $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --random-seed 100
          -H 'Authorization: Bearer NOT_USED'
          -H 'Accept: text/event-stream'
          --record-processors 8
          --ui simple
        - echo "Benchmarking finished"
      monitor:
        # Both servers sit on declared hosts, so each is sampled by a collector
        # container on its OWN daemon -- the driver's hardware is not what this
        # benchmark is about.
        resources:
          used_by_tasks:
            - prefill_server
            - decode_server
        report:
          enabled: true
      replicas:
        variables:
          - CONCURRENCY
        policy: sequential
      depends_on:
        - router
