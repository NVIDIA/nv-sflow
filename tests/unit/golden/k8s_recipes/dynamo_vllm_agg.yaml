# task: nats_server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: '# sflow: fail-fast

      set -e

      nats-server -js'
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-cfg
    namespace: mlperf-sflow
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes
    namespace: mlperf-sflow
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: nats-server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.0
      name: nats-server-kubernetes
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /models
        name: model-store
        readOnly: true
      - mountPath: /cache
        name: kernel-cache
        readOnly: false
        subPath: sflow-kernel-cache
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: k8s_cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: nats-server-kubernetes-cfg
      name: sflow-scripts
    - emptyDir:
        medium: Memory
      name: dshm
    - name: model-store
      persistentVolumeClaim:
        claimName: your-model-pvc
        readOnly: true
    - name: kernel-cache
      persistentVolumeClaim:
        claimName: your-model-pvc
        readOnly: false
kind: List
