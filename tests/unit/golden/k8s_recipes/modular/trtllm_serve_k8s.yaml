# sflow K8s recipe golden manifests -- DO NOT EDIT BY HAND.
# composed: examples/modular/backend_agnostic/backends/k8s.yaml + examples/modular/backend_agnostic/workloads/trtllm_serve.yaml + examples/modular/backend_agnostic/benchmark.yaml
# Rendered offline with a deterministic placeholder allocation (no cluster).
# Merge followers are omitted; their containers run in the leader's merged pod.
# Regenerate: SFLOW_UPDATE_GOLDEN=1 pytest tests/unit/test_k8s_recipe_golden_manifests.py
---
# task: server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "if [ -d /usr/local/nvidia/lib64 ]; then\n  export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}\n\
      fi\nif [ -d /usr/local/nvidia/bin ]; then\n  export PATH=/usr/local/nvidia/bin:${PATH:-}\nfi\n#\
      \ sflow: fail-fast\nset -e\nset -x\nexport TLLM_LOG_LEVEL=INFO\nexport TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}\n\
      unset UCX_TLS\nmpirun -np 4 --allow-run-as-root trtllm-llmapi-launch trtllm-serve /models/Qwen3-0.6B\
      \ --host 0.0.0.0 --port 8000 --tp_size 4"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
      name: server-kubernetes
      resources:
        limits:
          nvidia.com/gpu: '4'
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /models/Qwen3-0.6B
        name: sflow-fs-0
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
    - hostPath:
        path: /models/Qwen3-0.6B
      name: sflow-fs-0
kind: List
---
# task: benchmark (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "# sflow: fail-fast\nset -e\npip install aiperf==0.3.0\nset -x\nexport COLUMNS=200\n\
      export AIPERF_DIR=\"${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_64\"\naiperf profile --artifact-dir\
      \ \"${AIPERF_DIR}\" --model Qwen3-0.6B --tokenizer /models/Qwen3-0.6B --endpoint-type chat --endpoint\
      \ /v1/chat/completions --streaming --url http://0.0.0.1:8000 --synthetic-input-tokens-mean 1024\
      \ --synthetic-input-tokens-stddev 0 --output-tokens-mean 1024 --output-tokens-stddev 0 --extra-inputs\
      \ \"min_tokens:1024\" --extra-inputs \"ignore_eos:true\" --extra-inputs \"repetition_penalty:1.0\"\
      \ --extra-inputs \"temperature: 0.0\" --concurrency 64 --request-count 512 --warmup-request-count\
      \ 64 --num-dataset-entries 512 --random-seed 100 -H 'Authorization: Bearer NOT USED' -H 'Accept:\
      \ text/event-stream' -H 'Connection: close' --record-processors 8 --ui simple\ncsv=\"${AIPERF_DIR}/profile_export_aiperf.csv\"\
      \nif [ ! -s \"$csv\" ]; then\n  echo \"aiperf produced no results: $csv is missing or empty.\" >&2\n\
      \  echo \"Read the AIPerf errors above -- aiperf exits 0 even when it measures nothing.\" >&2\n\
      \  exit 1\nfi\nif ! grep -q \"Time to First Token\" \"$csv\"; then\n  echo \"aiperf measured no\
      \ generation: $csv has no per-request latency\" >&2\n  echo \"metrics, so the server accepted the\
      \ requests but returned no tokens.\" >&2\n  echo \"Check the server logs for KV-transfer / handshake\
      \ errors.\" >&2\n  exit 1\nfi\necho \"aiperf wrote $(($(wc -l < \"$csv\") - 1)) metric rows to $csv\"\
      \n\necho \"Benchmarking finished\""
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: benchmark-kubernetes
    name: benchmark-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: benchmark-kubernetes
    name: benchmark-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: benchmark-kubernetes-env
      image: python:3.12-slim
      name: benchmark-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /models/Qwen3-0.6B
        name: sflow-fs-0
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: benchmark-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
    - hostPath:
        path: /models/Qwen3-0.6B
      name: sflow-fs-0
kind: List
