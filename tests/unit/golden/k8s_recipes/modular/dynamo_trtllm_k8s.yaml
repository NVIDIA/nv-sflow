# task: server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "if [ -d /usr/local/nvidia/lib64 ]; then\n  export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}\n\
      fi\nif [ -d /usr/local/nvidia/bin ]; then\n  export PATH=/usr/local/nvidia/bin:${PATH:-}\nfi\n#\
      \ sflow: fail-fast\nset -e\nset -x\nexport TLLM_LOG_LEVEL=INFO\nexport TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}\n\
      unset UCX_TLS\nmpirun -np 4 --allow-run-as-root trtllm-llmapi-launch python3 -m dynamo.trtllm --model-path\
      \ /models/Qwen3-0.6B --served-model-name Qwen3-0.6B --extra-engine-args /sflow-golden/sflow_output/trtllm_engine.yaml"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  data:
    SERVER_CONFIG: "tensor_parallel_size: 4\nmoe_expert_parallel_size: 4\npipeline_parallel_size: 1\n\
      max_batch_size: 128\nmax_num_tokens: 6144\nmax_seq_len: 24576\nprint_iter_log: true\nkv_cache_config:\n\
      \  enable_block_reuse: false\n  free_gpu_memory_fraction: 0.9\n  dtype: fp8"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes-artifacts
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
      name: server-kubernetes
      resources:
        limits:
          nvidia.com/gpu: '4'
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /sflow-golden/sflow_output/trtllm_engine.yaml
        name: sflow-artifacts
        readOnly: true
        subPath: SERVER_CONFIG
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
