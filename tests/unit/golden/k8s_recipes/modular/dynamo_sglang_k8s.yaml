# sflow K8s recipe golden manifests -- DO NOT EDIT BY HAND.
# composed: examples/modular/backend_agnostic/backends/k8s.yaml + examples/modular/backend_agnostic/workloads/dynamo_common.yaml + examples/modular/backend_agnostic/workloads/dynamo_sglang.yaml + examples/modular/backend_agnostic/benchmark.yaml
# Rendered offline with a deterministic placeholder allocation (no cluster).
# Merge followers are omitted; their containers run in the leader's merged pod.
# Regenerate: SFLOW_UPDATE_GOLDEN=1 pytest tests/unit/test_k8s_recipe_golden_manifests.py
---
# task: nats_server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: nats-server -js
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: nats-server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.0
      name: nats-server-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: nats-server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
kind: List
---
# task: etcd_server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: 'etcd --listen-client-urls "http://0.0.0.0:2379" --advertise-client-urls "http://0.0.0.0:2379"
      --listen-peer-urls "http://0.0.0.0:2380" --initial-advertise-peer-urls "http://${HEAD_NODE_IP}:2380"
      --initial-cluster "default=http://${HEAD_NODE_IP}:2380" --data-dir /tmp/etcd

      '
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: etcd-server-kubernetes
    name: etcd-server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: etcd-server-kubernetes
    name: etcd-server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: etcd-server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.0
      name: etcd-server-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: etcd-server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
kind: List
---
