# sflow K8s recipe golden manifests -- DO NOT EDIT BY HAND.
# composed: examples/modular/backend_agnostic/backends/k8s.yaml + examples/modular/backend_agnostic/workloads/sglang_serve.yaml + examples/modular/backend_agnostic/benchmark.yaml
# Rendered offline with a deterministic placeholder allocation (no cluster).
# Merge followers are omitted; their containers run in the leader's merged pod.
# Regenerate: SFLOW_UPDATE_GOLDEN=1 pytest tests/unit/test_k8s_recipe_golden_manifests.py
---
# task: server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "if [ -d /usr/local/nvidia/lib64 ]; then\n  export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}\n\
      fi\nif [ -d /usr/local/nvidia/bin ]; then\n  export PATH=/usr/local/nvidia/bin:${PATH:-}\nfi\nset\
      \ -x\npython3 -m sglang.launch_server --model-path /models/Qwen3-0.6B --served-model-name Qwen3-0.6B\
      \ --host 0.0.0.0 --port 8000 --tp-size 4 --trust-remote-code"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: server-kubernetes-env
      image: lmsysorg/sglang:latest
      name: server-kubernetes
      resources:
        limits:
          nvidia.com/gpu: '4'
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
kind: List
---
# task: benchmark (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: 'pip install aiperf==0.3.0

      set -x

      export COLUMNS=200

      aiperf profile --model Qwen3-0.6B --tokenizer Qwen3-0.6B --endpoint-type chat --endpoint /v1/chat/completions
      --streaming --url http://0.0.0.1:8000 --synthetic-input-tokens-mean 1024 --output-tokens-mean 1024
      --concurrency 64 --request-count 512 --warmup-request-count 64

      echo "Benchmarking finished"'
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: benchmark-kubernetes
    name: benchmark-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: benchmark-kubernetes
    name: benchmark-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: benchmark-kubernetes-env
      image: python:3.12-slim
      name: benchmark-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: benchmark-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
kind: List
