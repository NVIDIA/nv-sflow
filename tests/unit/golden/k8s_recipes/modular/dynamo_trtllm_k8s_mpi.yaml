# sflow K8s recipe golden manifests -- DO NOT EDIT BY HAND.
# composed: examples/modular/backend_agnostic/backends/k8s_mpi.yaml + examples/modular/backend_agnostic/workloads/dynamo_common.yaml + examples/modular/backend_agnostic/workloads/dynamo_trtllm.yaml + examples/modular/backend_agnostic/benchmark.yaml  (-s NUM_NODES=2 -s SERVER_GPUS=16)
# Rendered offline with a deterministic placeholder allocation (no cluster).
# Merge followers are omitted; their containers run in the leader's merged pod.
# Regenerate: SFLOW_UPDATE_GOLDEN=1 pytest tests/unit/test_k8s_recipe_golden_manifests.py
---
# task: nats_server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: '# sflow: fail-fast

      set -e

      nats-server -js'
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-cfg
    namespace: your-namespace
- apiVersion: v1
  data:
    SERVER_CONFIG: "tensor_parallel_size: 16\nmoe_expert_parallel_size: 16\npipeline_parallel_size: 1\n\
      max_batch_size: 128\nmax_num_tokens: 6144\nmax_seq_len: 24576\nprint_iter_log: true\nkv_cache_config:\n\
      \  enable_block_reuse: false\n  free_gpu_memory_fraction: 0.9\n  dtype: fp8"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-artifacts
    namespace: your-namespace
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: nats-server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
      name: nats-server-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /sflow-golden/sflow_output/trtllm_engine.yaml
        name: sflow-artifacts
        readOnly: true
        subPath: SERVER_CONFIG
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: nats-server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
    - configMap:
        name: nats-server-kubernetes-artifacts
      name: sflow-artifacts
kind: List
---
