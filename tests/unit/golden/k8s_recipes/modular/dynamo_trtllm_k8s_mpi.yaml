      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /sflow-golden/sflow_output/trtllm_engine.yaml
        name: sflow-artifacts
        readOnly: true
        subPath: SERVER_CONFIG
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
    - configMap:
        name: server-kubernetes-artifacts
      name: sflow-artifacts
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: server-kubernetes
    name: server-kubernetes-1
    namespace: your-namespace
  spec:
    containers:
    - command:
      - bash
      - -l
