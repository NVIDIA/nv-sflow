# task: nats_server (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: '# sflow: fail-fast

      set -e

      nats-server -js'
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-cfg
    namespace: mlperf-sflow
- apiVersion: v1
  data:
    DECODE_CONFIG: "tensor_parallel_size: 4\nmoe_expert_parallel_size: 4\nenable_attention_dp: False\n\
      pipeline_parallel_size: 1\n# WIP - Plain NCCL all-reduce so cross-node TP works (AUTO/NVLS needs\
      \ NVLink P2P).\n# allreduce_strategy: NCCL\nmax_batch_size: 128\nmax_num_tokens: 8448\nmax_seq_len:\
      \ 10240\ncuda_graph_config:\n  enable_padding: true\n  max_batch_size: 128\nprint_iter_log: true\n\
      enable_chunked_prefill: false\nkv_cache_config:\n  enable_block_reuse: false\n  free_gpu_memory_fraction:\
      \ 0.9\n  dtype: fp8\ncache_transceiver_config:\n  max_tokens_in_buffer: 8448\n  backend: UCX\nstream_interval:\
      \ 20"
    PREFILL_CONFIG: "max_batch_size: 128\nmax_num_tokens: 8448\nmax_seq_len: 10240\ntensor_parallel_size:\
      \ 2\nmoe_expert_parallel_size: 2\nenable_attention_dp: False\npipeline_parallel_size: 1\n# WIP -\
      \ Plain NCCL all-reduce so cross-node TP works (AUTO/NVLS needs NVLink P2P).\n# allreduce_strategy:\
      \ NCCL\ncuda_graph_config: null\nprint_iter_log: true\ndisable_overlap_scheduler: true\nenable_chunked_prefill:\
      \ false\nkv_cache_config:\n  enable_block_reuse: false\n  free_gpu_memory_fraction: 0.9\n  dtype:\
      \ fp8\ncache_transceiver_config:\n  max_tokens_in_buffer: 8448\n  backend: UCX"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes-artifacts
    namespace: mlperf-sflow
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: nats-server-kubernetes
    name: nats-server-kubernetes
    namespace: mlperf-sflow
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: nats-server-kubernetes-env
      image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
      name: nats-server-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /sflow-golden/sflow_output/prefill_config.yaml
        name: sflow-artifacts
        readOnly: true
        subPath: PREFILL_CONFIG
      - mountPath: /sflow-golden/sflow_output/decode_config.yaml
        name: sflow-artifacts
        readOnly: true
        subPath: DECODE_CONFIG
      - mountPath: /models
        name: model-store
        readOnly: true
    hostIPC: true
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: k8s_cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: nats-server-kubernetes-cfg
      name: sflow-scripts
    - hostPath:
        path: /dev/shm
        type: Directory
      name: dshm
    - configMap:
        name: nats-server-kubernetes-artifacts
      name: sflow-artifacts
    - name: model-store
      persistentVolumeClaim:
        claimName: your-model-pvc
        readOnly: true
kind: List
