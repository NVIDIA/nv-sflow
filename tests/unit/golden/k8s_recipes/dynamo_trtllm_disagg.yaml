# task: prefill_server_0 (operator: K8sMpiOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "set -uo pipefail\nif [ -d /usr/local/nvidia/lib64 ]; then\n  export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}\n\
      fi\nif [ -d /usr/local/nvidia/bin ]; then\n  export PATH=/usr/local/nvidia/bin:${PATH:-}\nfi\n_SFLOW_GATE_DIR=/tmp/sflow-merge-gate\n\
      mkdir -p \"$_SFLOW_GATE_DIR\"\n_sflow_rc_dir=\"$(mktemp -d)\"\n_sflow_gate() {\n  for _dep in \"\
      $@\"; do\n    if [ ! -f \"$_SFLOW_GATE_DIR/$_dep.open\" ] && [ ! -f \"$_sflow_rc_dir/$_dep\" ];\
      \ then\n      echo \"sflow: $_name waiting for merged dependency $_dep...\"\n    fi\n    while :;\
      \ do\n      [ -f \"$_SFLOW_GATE_DIR/$_dep.open\" ] && break\n      if [ -f \"$_sflow_rc_dir/$_dep\"\
      \ ]; then\n        _drc=\"$(cat \"$_sflow_rc_dir/$_dep\" 2>/dev/null || echo 1)\"\n        [ -z\
      \ \"$_drc\" ] && { sleep 2; continue; }\n        [ \"$_drc\" = 0 ] && break\n        echo \"sflow:\
      \ merged dependency $_dep failed (rc=$_drc); $_name will not start\" >&2\n        return \"$_drc\"\
      \n      fi\n      sleep 2\n    done\n  done\n  return 0\n}\n_sflow_run() {\n  _name=\"$1\"; _cvd=\"\
      $2\"; _script=\"$3\"; _envf=\"$4\"; _gate=\"$5\"\n  (\n    export CUDA_VISIBLE_DEVICES=\"$_cvd\"\
      \n    export NVIDIA_VISIBLE_DEVICES=\"$_cvd\"\n    if [ -f \"$_envf\" ]; then . \"$_envf\"; fi\n\
      \    if _sflow_gate $_gate; then\n      bash -l \"$_script\"\n      _sflow_mrc=$?\n    else\n  \
      \    _sflow_mrc=$?\n    fi\n    echo \"$_sflow_mrc\" > \"$_sflow_rc_dir/$_name\"\n    echo \"[[sflow-member-done:${_sflow_mrc}]]\"\
      \n  ) 2>&1 | while IFS= read -r _sflow_line || [ -n \"$_sflow_line\" ]; do\n      printf '[[sflow-mux:%s]]\
      \ %s\\n' \"$_name\" \"$_sflow_line\"\n    done &\n}\n_sflow_run prefill_server_0 0,1,2,3,4,5,6,7\
      \ /sflow/merge_prefill_server_0.sh /sflow/menv/prefill-server-0/envsh ''\n_sflow_run prefill_server_1\
      \ 2,3,0,1,4,5,6,7 /sflow/merge_prefill_server_1.sh /sflow/menv/prefill-server-1/envsh ''\n_sflow_run\
      \ prefill_server_2 4,5,0,1,2,3,6,7 /sflow/merge_prefill_server_2.sh /sflow/menv/prefill-server-2/envsh\
      \ ''\n_sflow_run prefill_server_3 6,7,0,1,2,3,4,5 /sflow/merge_prefill_server_3.sh /sflow/menv/prefill-server-3/envsh\
      \ ''\nwait\n_sflow_rc=0\nfor _f in \"$_sflow_rc_dir\"/*; do\n  _c=\"$(cat \"$_f\" 2>/dev/null ||\
      \ echo 1)\"\n  [ \"$_c\" = \"0\" ] || _sflow_rc=\"$_c\"\ndone\nexit \"$_sflow_rc\""
    merge_prefill_server_0.sh: "# sflow: fail-fast\nset -e\nset -x\necho ${CUDA_VISIBLE_DEVICES}\nexport\
      \ TLLM_LOG_LEVEL=INFO\nexport TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER=1\nexport TRTLLM_MOE_USE_LOW_PRECISION_COMBINE=1\n\
      export TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}\nenv | grep TLLM\nenv | grep UCX\nunset\
      \ UCX_TLS\nif [ \"${NET_DEBUG}\" == \"1\" ]; then\n  export NCCL_DEBUG=INFO\n  export NCCL_DEBUG_SUBSYS=GRAPH,NET\n\
      \  export UCX_LOG_LEVEL=info\nfi\n\nmpirun -np 2 --allow-run-as-root trtllm-llmapi-launch python3\
      \ -m dynamo.trtllm --model-path /models/Qwen3-8B-FP8 --served-model-name ${SERVED_MODEL_NAME} --disaggregation-mode\
      \ prefill --extra-engine-args /sflow-golden/sflow_output/prefill_config.yaml ${EXTRA_PREFILL_ARGS}"
    merge_prefill_server_1.sh: "# sflow: fail-fast\nset -e\nset -x\necho ${CUDA_VISIBLE_DEVICES}\nexport\
      \ TLLM_LOG_LEVEL=INFO\nexport TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER=1\nexport TRTLLM_MOE_USE_LOW_PRECISION_COMBINE=1\n\
      export TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}\nenv | grep TLLM\nenv | grep UCX\nunset\
      \ UCX_TLS\nif [ \"${NET_DEBUG}\" == \"1\" ]; then\n  export NCCL_DEBUG=INFO\n  export NCCL_DEBUG_SUBSYS=GRAPH,NET\n\
      \  export UCX_LOG_LEVEL=info\nfi\n\nmpirun -np 2 --allow-run-as-root trtllm-llmapi-launch python3\
      \ -m dynamo.trtllm --model-path /models/Qwen3-8B-FP8 --served-model-name ${SERVED_MODEL_NAME} --disaggregation-mode\
      \ prefill --extra-engine-args /sflow-golden/sflow_output/prefill_config.yaml ${EXTRA_PREFILL_ARGS}"
    merge_prefill_server_2.sh: "# sflow: fail-fast\nset -e\nset -x\necho ${CUDA_VISIBLE_DEVICES}\nexport\
