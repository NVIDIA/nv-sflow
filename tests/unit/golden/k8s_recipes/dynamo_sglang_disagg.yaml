# task: benchmark_512 (operator: K8sOperator)
apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: 'pip install aiperf==0.3.0

      set -x

      export COLUMNS=200

      aiperf profile --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY} --model
      Qwen3-8B-FP8 --tokenizer /models/Qwen3-8B-FP8 --endpoint-type chat --endpoint /v1/chat/completions
      --streaming --url http://0.0.0.1:8000 --synthetic-input-tokens-mean 1024 --synthetic-input-tokens-stddev
      0 --output-tokens-mean 1024 --output-tokens-stddev 0 --extra-inputs "max_tokens:1024" --extra-inputs
      "min_tokens:1024" --extra-inputs "ignore_eos:true" --extra-inputs "{\"nvext\":{\"ignore_eos\":true}}"
      --extra-inputs "repetition_penalty:1.0" --extra-inputs "temperature: 0.0" --concurrency ${CONCURRENCY}
      --request-count $((8*${CONCURRENCY})) --warmup-request-count ${CONCURRENCY} --num-dataset-entries
      $((8*${CONCURRENCY})) --random-seed 100 -H ''Authorization: Bearer NOT USED'' -H ''Accept: text/event-stream''
      --record-processors 8 --ui simple

      echo "Benchmarking finished"'
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: kubernetes
      sflow.ai/task: benchmark-512-kubernetes
    name: benchmark-512-kubernetes-cfg
    namespace: mlperf-sflow
- apiVersion: v1
