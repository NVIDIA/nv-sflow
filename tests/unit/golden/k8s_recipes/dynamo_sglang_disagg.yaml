      $(mktemp -d)\"\n_sflow_run() {\n  _name=\"$1\"; _cvd=\"$2\"; _script=\"$3\"; _envf=\"$4\"\n  (\n\
      \    export CUDA_VISIBLE_DEVICES=\"$_cvd\"\n    export NVIDIA_VISIBLE_DEVICES=\"$_cvd\"\n    if\
      \ [ -f \"$_envf\" ]; then . \"$_envf\"; fi\n    bash -l \"$_script\"\n    echo \"$?\" > \"$_sflow_rc_dir/$_name\"\
      \n  ) 2>&1 | while IFS= read -r _sflow_line || [ -n \"$_sflow_line\" ]; do\n      printf '[[sflow-mux:%s]]\
      \ %s\\n' \"$_name\" \"$_sflow_line\"\n    done &\n}\n_sflow_run prefill_server_0 0,1,2,3,4,5,6,7\
      \ /sflow/merge_prefill_server_0.sh /sflow/menv/prefill-server-0/envsh\n_sflow_run prefill_server_1\
      \ 1,0,2,3,4,5,6,7 /sflow/merge_prefill_server_1.sh /sflow/menv/prefill-server-1/envsh\n_sflow_run\
      \ prefill_server_2 2,0,1,3,4,5,6,7 /sflow/merge_prefill_server_2.sh /sflow/menv/prefill-server-2/envsh\n\
      _sflow_run prefill_server_3 3,0,1,2,4,5,6,7 /sflow/merge_prefill_server_3.sh /sflow/menv/prefill-server-3/envsh\n\
      _sflow_run prefill_server_4 4,0,1,2,3,5,6,7 /sflow/merge_prefill_server_4.sh /sflow/menv/prefill-server-4/envsh\n\
      _sflow_run prefill_server_5 5,0,1,2,3,4,6,7 /sflow/merge_prefill_server_5.sh /sflow/menv/prefill-server-5/envsh\n\
      _sflow_run prefill_server_6 6,0,1,2,3,4,5,7 /sflow/merge_prefill_server_6.sh /sflow/menv/prefill-server-6/envsh\n\
      _sflow_run prefill_server_7 7,0,1,2,3,4,5,6 /sflow/merge_prefill_server_7.sh /sflow/menv/prefill-server-7/envsh\n\
