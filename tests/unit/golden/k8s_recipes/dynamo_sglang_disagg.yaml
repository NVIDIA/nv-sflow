    namespace: mlperf-sflow
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      envFrom:
      - secretRef:
          name: benchmark-512-kubernetes-env
      image: python:3.12-slim
      name: benchmark-512-kubernetes
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /models
        name: model-store
        readOnly: true
      - mountPath: /cache
        name: kernel-cache
        readOnly: false
        subPath: sflow-kernel-cache
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: k8s_cluster-node0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: benchmark-512-kubernetes-cfg
      name: sflow-scripts
    - emptyDir:
        medium: Memory
