apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: "if [ -d /usr/local/nvidia/lib64 ]; then\n  export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:${LD_LIBRARY_PATH:-}\n\
      fi\nif [ -d /usr/local/nvidia/bin ]; then\n  export PATH=/usr/local/nvidia/bin:${PATH:-}\nfi\n#\
      \ ===== sflow k8s_mpi bootstrap (pods route) =====\n# --- sflow: transparent mpirun wrapper ---\n\
      mkdir -p /tmp/sflow-mpi/bin\ncat > /tmp/sflow-mpi/bin/mpirun <<'SFLOW_MPIRUN_WRAPPER_EOF'\n#!/usr/bin/env\
      \ bash\n# sflow transparent mpirun wrapper (k8s_mpi). Injects hostfile/SSH transport and\n# -x env\
      \ forwarding so the recipe keeps a plain `mpirun -np N ... <workload>`.\nset -u\n# Resolve the REAL\
      \ mpirun. The preamble captured it in SFLOW_REAL_MPIRUN before\n# prepending this shim's dir to\
      \ PATH; fall back to scanning PATH for a non-self.\n_sflow_real=\"${SFLOW_REAL_MPIRUN:-}\"\nif [\
      \ -z \"${_sflow_real}\" ]; then\n  for _c in $(type -ap mpirun 2>/dev/null); do\n    if [ \"${_c}\"\
      \ != \"/tmp/sflow-mpi/bin/mpirun\" ]; then _sflow_real=\"${_c}\"; break; fi\n  done\nfi\n[ -n \"\
      ${_sflow_real}\" ] || _sflow_real=\"mpirun\"\n\n_sflow_opts=()\n# OpenMPI transport (pods route\
      \ only): a bare `mpirun` finds neither the hostfile\n# nor the alt SSH port, so inject both -- as\
      \ ONE plm_rsh_args argument.\nif [ \"1\" = \"1\" ] && [ -f \"/tmp/sflow-mpi/hostfile\" ]; then\n\
      \  _sflow_opts+=(--hostfile \"/tmp/sflow-mpi/hostfile\" \\\n    --mca plm_rsh_agent ssh \\\n   \
      \ --mca plm_rsh_args \"-p 2222 -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\
      \ -o ConnectTimeout=10\")\nfi\n# Forward env to remote ranks (sshd gives them a bare env), deduped,\
      \ from three\n# sources: the always-on whole-name vars, the merged prefix set (scanned NOW so late\n\
      # `export`s are captured), and every var the recipe itself exported -- the diff of\n# the current\
      \ exports against the pre-recipe snapshot -- so a plain `export FOO=bar`\n# reaches workers without\
      \ listing it in forward_env_prefixes.\n_sflow_snap=\"${SFLOW_MPI_ENV_SNAPSHOT:-/tmp/sflow-mpi/env.snapshot}\"\
      \n_sflow_names=\"$(\n  for _v in PATH LD_LIBRARY_PATH OMP_NUM_THREADS; do\n    eval \"[ -n \\\"\\\
      ${${_v}+x}\\\" ]\" && printf '%s\\n' \"${_v}\"\n  done\n  env | grep -oE '^(NCCL_|UCX_|GLOO_|NVSHMEM_|OMPI_MCA_|SFLOW_)[A-Za-z0-9_]*'\n\
      \  [ -f \"${_sflow_snap}\" ] && comm -13 \"${_sflow_snap}\" <(compgen -e | sort -u)\n)\"\nfor _v\
      \ in $(printf '%s\\n' \"${_sflow_names}\" | sort -u | sed '/^$/d'); do\n  _sflow_opts+=(-x \"${_v}\"\
      )\ndone\nexec \"${_sflow_real}\" \"${_sflow_opts[@]}\" \"$@\"\n\nSFLOW_MPIRUN_WRAPPER_EOF\nchmod\
      \ +x /tmp/sflow-mpi/bin/mpirun\nexport SFLOW_REAL_MPIRUN=\"${SFLOW_REAL_MPIRUN:-$(command -v mpirun\
      \ 2>/dev/null || true)}\"\nexport PATH=/tmp/sflow-mpi/bin:${PATH}\nSFLOW_MPI_NODE_INDEX=\"${SFLOW_TASK_NODE_INDEX:-0}\"\
      \nSFLOW_MPI_NODE_IPS=\"${SFLOW_TASK_ASSIGNED_NODE_IPS:-}\"\nSFLOW_MPI_N_NODES=$(printf '%s' \"${SFLOW_MPI_NODE_IPS}\"\
      \ | tr ',' '\\n' | grep -c '[^[:space:]]' || true)\nif [ \"${SFLOW_MPI_N_NODES:-0}\" -gt 1 ]; then\n\
      \  echo \"[sflow-mpi] node ${SFLOW_MPI_NODE_INDEX}/${SFLOW_MPI_N_NODES}: preparing SSH/MPI\"\n \
      \ if [ ! -x /usr/sbin/sshd ] && ! command -v sshd >/dev/null 2>&1; then\n    echo \"[sflow-mpi]\
      \ installing openssh-server\"\n    export DEBIAN_FRONTEND=noninteractive\n    (apt-get update -qq\
      \ && apt-get install -y -qq --no-install-recommends openssh-server) || echo \"[sflow-mpi] WARNING:\
      \ could not install openssh-server\"\n  fi\n  mkdir -p /run/sshd /root/.ssh && chmod 755 /run/sshd\
      \ && chmod 700 /root/.ssh\n  ssh-keygen -A >/dev/null 2>&1 || true\n  if [ -n \"${SFLOW_MPI_SSH_PRIVATE_KEY_B64:-}\"\
      \ ]; then\n    printf %s \"${SFLOW_MPI_SSH_PRIVATE_KEY_B64}\" | base64 -d > /root/.ssh/id_rsa\n\
      \    printf %s \"${SFLOW_MPI_SSH_PUBLIC_KEY_B64:-}\" | base64 -d > /root/.ssh/id_rsa.pub\n    cp\
      \ /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys\n    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys\
      \ /root/.ssh/id_rsa.pub\n    printf 'Host *\\n  StrictHostKeyChecking no\\n  UserKnownHostsFile\
      \ /dev/null\\n' > /root/.ssh/config\n    chmod 600 /root/.ssh/config\n  else\n    echo \"[sflow-mpi]\
      \ FATAL: no injected SSH keypair; cannot bootstrap MPI over SSH\"\n    exit 1\n  fi\n  if [ \"${SFLOW_MPI_NODE_INDEX:-0}\"\
      \ = \"0\" ]; then\n    mkdir -p /tmp/sflow-mpi\n    printf '%s' \"${SFLOW_MPI_NODE_IPS}\" | tr ','\
      \ '\\n' | sed '/^[[:space:]]*$/d' | awk '{print $1\" slots=8\"}' > /tmp/sflow-mpi/hostfile\n   \
      \ echo \"[sflow-mpi] hostfile:\"; cat /tmp/sflow-mpi/hostfile\n  fi\nfi\n# ===== end sflow k8s_mpi\
      \ bootstrap =====\n# --- sflow: snapshot exported env (pre-recipe) for mpirun -x auto-forward ---\n\
      mkdir -p /tmp/sflow-mpi 2>/dev/null || true\ncompgen -e 2>/dev/null | sort -u > \"${SFLOW_MPI_ENV_SNAPSHOT:-/tmp/sflow-mpi/env.snapshot}\"\
      \ 2>/dev/null || true\n# ===== sflow k8s_mpi launch gate (pods route) =====\nif [ \"${SFLOW_MPI_N_NODES:-1}\"\
      \ -gt 1 ]; then\n  if [ ! -x /usr/sbin/sshd ] && ! command -v sshd >/dev/null 2>&1; then\n    echo\
      \ \"[sflow-mpi] installing openssh-server\"\n    export DEBIAN_FRONTEND=noninteractive\n    (apt-get\
      \ update -qq && apt-get install -y -qq --no-install-recommends openssh-server) || echo \"[sflow-mpi]\
      \ WARNING: could not install openssh-server\"\n  fi\n  mkdir -p /run/sshd && chmod 755 /run/sshd\n\
      \  ssh-keygen -A >/dev/null 2>&1 || true\n  SFLOW_SSHD_BIN=\"$( [ -x /usr/sbin/sshd ] && echo /usr/sbin/sshd\
      \ || command -v sshd || true )\"\n  if [ -z \"${SFLOW_SSHD_BIN}\" ]; then echo \"[sflow-mpi] FATAL:\
      \ sshd unavailable\"; exit 1; fi\n  \"${SFLOW_SSHD_BIN}\" -p 2222 && echo \"[sflow-mpi] sshd up\
      \ on :2222\"\n  if [ \"${SFLOW_MPI_NODE_INDEX:-0}\" != \"0\" ]; then\n    echo \"[sflow-mpi] worker\
      \ ${SFLOW_MPI_NODE_INDEX}: setup done; idle (leader drives mpirun)\"\n    sleep infinity\n  fi\n\
      \  SFLOW_SSH_OPTS=\"-p 2222 -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\
      \ -o ConnectTimeout=5 -o BatchMode=yes\"\n  for ip in $(printf '%s' \"${SFLOW_MPI_NODE_IPS}\" |\
      \ tr ',' ' '); do\n    echo \"[sflow-mpi] waiting for sshd on ${ip}:2222\"\n    for _ in $(seq 1\
      \ 240); do\n      if ssh ${SFLOW_SSH_OPTS} \"${ip}\" true 2>/dev/null; then echo \"[sflow-mpi] ${ip}\
      \ ssh ok\"; break; fi\n      sleep 2\n    done\n  done\nfi\n# ===== end sflow k8s_mpi launch gate\
      \ =====\nexec mpirun -np 16 trtllm-serve /models/m"
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: abc
      sflow.ai/task: server-abc
    name: server-abc-cfg
    namespace: golden-ns
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: abc
      sflow.ai/task: server-abc
    name: server-abc-0
    namespace: golden-ns
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      env:
      - name: OMP_NUM_THREADS
        value: '8'
      - name: SFLOW_TASK_NODE_INDEX
        value: '0'
      - name: SFLOW_LEADER_ADDRESS
        value: 10.0.0.1
      envFrom:
      - secretRef:
          name: server-abc-env
      image: trtllm:latest
      name: server-abc-0
      resources:
        limits:
          nvidia.com/gpu: '8'
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: node-0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: server-abc-cfg
      name: sflow-scripts
    - emptyDir:
        medium: Memory
      name: dshm
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: abc
      sflow.ai/task: server-abc
    name: server-abc-1
    namespace: golden-ns
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      env:
      - name: OMP_NUM_THREADS
        value: '8'
      - name: SFLOW_TASK_NODE_INDEX
        value: '1'
      - name: SFLOW_LEADER_ADDRESS
        value: 10.0.0.1
      envFrom:
      - secretRef:
          name: server-abc-env
      image: trtllm:latest
      name: server-abc-1
      resources:
        limits:
          nvidia.com/gpu: '8'
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: node-1
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: server-abc-cfg
      name: sflow-scripts
    - emptyDir:
        medium: Memory
      name: dshm
kind: List
