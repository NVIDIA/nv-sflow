apiVersion: v1
items:
- apiVersion: v1
  data:
    entrypoint.sh: python3 -m dynamo.frontend --http-port 8000
  kind: ConfigMap
  metadata:
    labels:
      sflow.ai/allocation: abc
      sflow.ai/task: frontend-server-abc
    name: frontend-server-abc-cfg
    namespace: golden-ns
- apiVersion: v1
  kind: Pod
  metadata:
    labels:
      sflow.ai/allocation: abc
      sflow.ai/task: frontend-server-abc
    name: frontend-server-abc
    namespace: golden-ns
  spec:
    containers:
    - command:
      - bash
      - -l
      - /sflow/entrypoint.sh
      image: dynamo:trtllm
      name: frontend-server-abc
      volumeMounts:
      - mountPath: /sflow
        name: sflow-scripts
      - mountPath: /dev/shm
        name: dshm
    hostNetwork: true
    nodeSelector:
      kubernetes.io/hostname: node-0
    restartPolicy: Never
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Exists
    volumes:
    - configMap:
        name: frontend-server-abc-cfg
      name: sflow-scripts
    - emptyDir:
        medium: Memory
      name: dshm
kind: List
