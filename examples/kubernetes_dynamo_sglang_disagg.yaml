version: "0.1"

# Kubernetes port of examples/slurm_dynamo_sglang_disagg.yaml.
#
# Disaggregated SGLang recipe: prefill (context) and decode (generation) run as
# separate workers, with the KV cache transferred from prefill to decode over
# NIXL. The frontend routes; etcd/NATS coordinate discovery.
#
# Native Kubernetes recipe: a `kubernetes` backend (scheduling: device_plugin)
# reserves and discovers nodes, then each task runs as its own scheduler-placed
# pod whose GPUs come from the legacy nvidia.com/gpu device plugin. The operators
# are `type: k8s` and carry the workload images (DYNAMO_IMAGE / AIPERF_IMAGE).
#
# Cluster assumptions: NVIDIA gpu-operator (nvidia.com/gpu device plugin). The
# backend reserves real nodes with placeholder pods that hold the node GPUs,
# discovers their node names + InternalIPs, pins each task pod via nodeSelector,
# and hands the GPUs to the GPU tasks via the create-before-destroy handoff.
# CPU-only infra (etcd/nats/frontend) overlaps on node 0 without consuming GPUs.
# Set `scheduling: dra` to use DRA (nvidia-dra-driver-gpu, Kubernetes 1.34+,
# resource.k8s.io/v1, DeviceClass gpu.nvidia.com) instead of the device plugin.
#
# SGLang disaggregation notes (what differs from the vllm/trtllm ports):
#   * KV cache moves over NIXL (--disaggregation-transfer-backend nixl). With
#     host_network, pods co-located on a node share the host's ports, so each
#     worker derives unique VLLM_NIXL_SIDE_CHANNEL_PORT / DYN_SYSTEM_PORT /
#     disaggregation-bootstrap-port from SFLOW_REPLICA_INDEX, and prefill/decode
#     use different bases so a prefill and a decode replica packed onto the same
#     node never collide. The Slurm trick of offsetting by the first
#     CUDA_VISIBLE_DEVICES index does NOT work here: the device plugin gives each
#     pod its own GPUs seen as 0,1,..., so that index is always 0.
#   * Multi-node workers (GPUS_PER_WORKER > GPUS_PER_NODE) use SGLang's own
#     multi-node launch (NOT Ray): resources.gpus.count auto-expands the task to
#     one pod per node and EVERY pod runs `python3 -m dynamo.sglang` with a shared
#     `--dist-init-addr <rank0-ip>:<port> --nnodes N --node-rank
#     ${SFLOW_TASK_NODE_INDEX}`.

variables:
  # --- Kubernetes backend configuration ---
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods"
    # Runs in mlperf-sflow so pods can mount the deepseek-r1-model-lustre PVC
    # (PVCs are namespace-scoped; the model lives on that Lustre volume).
    value: mlperf-sflow
  GPUS_PER_NODE:
    description: "GPUs per node"
    type: integer
    value: 8
  NUM_NODES:
    description: "Number of nodes"
    value: 2

  # --- Persistent kernel/JIT cache (reused across runs) ---
  # DeepGEMM / DeepEP / Triton / torch.compile JIT-compile kernels on first use,
  # which is slow at every startup. Persisting them on a PVC lets later runs reuse
  # the compiled kernels instead of recompiling. The GPU worker scripts point the
  # cache env vars (SGLANG_DG_CACHE_DIR / EP_JIT_CACHE_DIR / TRITON_CACHE_DIR / ...)
  # at KERNEL_CACHE_DIR, backed by the `kernel-cache` PVC volume (see backend below).
  KERNEL_CACHE_DIR:
    description: "In-pod mount path for the persistent kernel/JIT cache"
    value: /cache
  CACHE_PVC_CLAIM:
    description: "Existing RWX PVC that stores the kernel cache (defaults to the model PVC; set a dedicated RWX cache PVC if you have one)"
    value: deepseek-r1-model-lustre

  # Model Configuration
  SERVED_MODEL_NAME:
    description: "Served model name"
    value: Qwen3-8B-FP8
  MODEL_NAME:
    description: "Model path"
    value: Qwen/Qwen3-8B-FP8

  # Prefill Server Configuration
  NUM_CTX_SERVERS:
    description: "Number of context/prefill servers"
    type: integer
    value: 8
  CTX_TP_SIZE:
    description: "Context tensor parallel size"
    type: integer
    value: 1
  CTX_DP_SIZE:
    description: "Context data parallel size"
    type: integer
    value: 1
  CTX_EP_SIZE:
    description: "Context expert parallel size"
    type: integer
    value: 1
  CTX_MOE_TP_SIZE:
    description: "Context MOE tensor parallel size"
    type: integer
    value: 1
  CTX_PP_SIZE:
    description: "Context pipeline parallel size"
    type: integer
    value: 1
  CTX_GPUS_PER_WORKER:
    description: "GPUs per prefill worker"
    type: integer
    value: ${{ (variables.CTX_TP_SIZE * variables.CTX_DP_SIZE * variables.CTX_PP_SIZE) if variables.CTX_ENABLE_ATTENTION_DP == '' else (variables.CTX_TP_SIZE * variables.CTX_PP_SIZE) }}
  CTX_NODES_PER_WORKER:
    description: "Nodes per prefill worker"
    type: integer
    value: ${{ [variables.CTX_GPUS_PER_WORKER // variables.GPUS_PER_NODE, 1] | max }}
  CTX_BATCH_SIZE:
    description: "Context batch size"
    type: integer
    value: ${{ variables.CONCURRENCY.domain | max // variables.NUM_CTX_SERVERS }}
  CTX_MAX_NUM_TOKENS:
    description: "Context max number of tokens"
    type: integer
    value: 4096
  CTX_MAX_SEQ_LEN:
    description: "Context max sequence length"
    type: integer
    value: 1280
  CTX_FREE_GPU_MEMORY_FRACTION:
    description: "Context free GPU memory fraction"
    value: 0.9
  CTX_ENABLE_ATTENTION_DP:
    description: "Context enable attention DP (empty, or --enable-dp-attention)"
    value: ""
  KV_CACHE_DTYPE:
    description: "KV cache dtype"
    value: fp8

  # Decode Server Configuration
  NUM_GEN_SERVERS:
    description: "Number of generation/decode servers"
    type: integer
    value: 2
  GEN_TP_SIZE:
    description: "Generation tensor parallel size"
    type: integer
    value: 4
  GEN_DP_SIZE:
    description: "Generation data parallel size"
    type: integer
    value: 1
  GEN_EP_SIZE:
    description: "Generation expert parallel size"
    type: integer
    value: 1
  GEN_MOE_TP_SIZE:
    description: "Generation MOE tensor parallel size"
    type: integer
    value: 1
  GEN_PP_SIZE:
    description: "Generation pipeline parallel size"
    type: integer
    value: 1
  GEN_GPUS_PER_WORKER:
    description: "GPUs per decode worker"
    type: integer
    value: ${{ (variables.GEN_TP_SIZE * variables.GEN_DP_SIZE * variables.GEN_PP_SIZE) if variables.GEN_ENABLE_ATTENTION_DP == '' else (variables.GEN_TP_SIZE * variables.GEN_PP_SIZE) }}
  GEN_NODES_PER_WORKER:
    description: "Nodes per decode worker"
    type: integer
    value: ${{ [variables.GEN_GPUS_PER_WORKER // variables.GPUS_PER_NODE, 1] | max }}
  GEN_BATCH_SIZE:
    description: "Generation batch size"
    type: integer
    value: ${{ (variables.CONCURRENCY.domain | max) // variables.NUM_GEN_SERVERS }}
  GEN_MAX_NUM_TOKENS:
    description: "Generation max number of tokens"
    type: integer
    value: 4096
  GEN_MAX_SEQ_LEN:
    description: "Generation max sequence length"
    type: integer
    value: 2304
  GEN_FREE_GPU_MEMORY_FRACTION:
    description: "Generation free GPU memory fraction"
    value: 0.9
  GEN_ENABLE_ATTENTION_DP:
    description: "Generation enable attention DP (empty, or --enable-dp-attention)"
    value: ""

  # Extra Arguments - You can append any optional arguments to the dynamo.sglang command
  EXTRA_FRONTEND_ARGS:
    description: "Extra frontend arguments"
    value: ""
  EXTRA_PREFILL_ARGS:
    description: "Extra prefill arguments"
    value: ""
  EXTRA_DECODE_ARGS:
    description: "Extra decode arguments"
    value: ""

  # Network transport debugging. NET_DEBUG=1 makes each GPU worker log the
  # transport NCCL and UCX/NIXL actually pick, so you can confirm the
  # tensor-parallel (NCCL) and KV-transfer (NIXL/UCX) traffic uses RDMA and not a
  # TCP/Ethernet fallback. Grep the prefill/decode logs for:
  #   * NCCL: "NET/IB" (RDMA/RoCE) vs "NET/Socket" (TCP)
  #   * UCX/NIXL: "rc_mlx5"/"rc_verbs" (RDMA) vs "tcp"
  # Set NET_DEBUG=0 to silence the extra logging.
  NET_DEBUG:
    description: "Log NCCL/UCX transport selection (1=on, 0=off) to verify RDMA vs TCP"
    value: "1"

  # Benchmark Configuration
  ISL:
    description: "Input sequence length"
    value: 1024
  OSL:
    description: "Output sequence length"
    value: 1024
  MULTI_ROUND:
    description: "Number of benchmark rounds"
    value: 8
  CONCURRENCY:
    description: "Concurrency"
    value: 512
    domain: [512]

  # Container Images
  AIPERF_IMAGE:
    description: "AIPerf container image"
    value: python:3.12-slim
  DYNAMO_IMAGE:
    description: "Dynamo SGLang container image"
    value: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.0

artifacts:
  # On Kubernetes, artifacts are injected into the task pods the native way (not via
  # the controller's filesystem), accessible as `${{ artifacts.NAME.path }}`:
  #   * file:// + inline `content` -> mounted into the pod from a ConfigMap.
  #   * fs:// -> made visible inside the pod, two ways:
  #       1. PVC-backed (recommended for models/large data): declare a PVC under the
  #          backend's `volumes:` and point the fs:// path at a location under its
  #          `mount_path` (see the `volumes:` on the k8s_cluster backend).
  #       2. hostPath: if no PVC covers the path, fs:// is hostPath-mounted at the
  #          same path, so it must be NODE-accessible (e.g. an NFS/shared filesystem
  #          mounted on every node). A missing node path fails the pod loudly.
  #
  # SGLang passes everything on the command line, so there are no engine-config
  # artifacts -- only the model.
  - name: LOCAL_MODEL_PATH
    # Lives inside the `model-store` PVC (mounted at /models); see backend volumes.
    uri: fs:///models/Qwen3-8B-FP8

backends:
  # A kubernetes backend with device-plugin scheduling. No `image` field --
  # workload images come from the operators (DYNAMO_IMAGE / AIPERF_IMAGE) below.
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP, so peers can be addressed by the node InternalIPs that
    # reservation returns (etcd/NATS registration mirrors the Slurm path). It also
    # lets SGLang advertise a reachable NIXL/bootstrap host for KV transfer.
    host_network: true
    # Request GPUs via the legacy nvidia.com/gpu device plugin; use 'dra' for
    # DRA (nvidia-dra-driver-gpu, DeviceClass gpu.nvidia.com).
    scheduling: device_plugin
    # RDMA fast path (default 'auto'): on GKE multi-NIC RDMA nodes, task GPU pods
    # get scoped RDMA device access -- a per-pod slice of the node's
    # networking.gke.io.networks/rdma-N NICs (sized to the pod's GPU count) plus
    # CAP_IPC_LOCK -- and a matching UCX_NET_DEVICES/NCCL_IB_HCA, so the
    # disaggregated KV transfer (NIXL/UCX) and NCCL run over RoCE instead of TCP.
    # Use 'off' to disable, or a list (e.g. [mlx5_0:1, mlx5_1:1]) to force devices.
    rdma: auto
    # Pre-existing PersistentVolumeClaims to mount into task pods. Use this to make
    # cluster-resident data (e.g. a model staged on shared storage) available to
    # pods without a node-local hostPath. The PVC + its data must already exist in
    # the namespace; sflow only references it. A PVC is mounted into a task's pod(s)
    # only when the task references a path under its mount_path (so e.g. the model
    # is not mounted into the etcd/nats pods). Use read_only + an ROX/RWX PVC to
    # share one model across prefill/decode pods on multiple nodes.
    #
    # `deepseek-r1-model-lustre` is a dedicated RWX Lustre PVC (in the mlperf-sflow
    # namespace); the Qwen model is staged at its root, so LOCAL_MODEL_PATH points
    # at /models/Qwen3-8B-FP8.
    volumes:
      - name: model-store
        claim: deepseek-r1-model-lustre
        mount_path: /models
        read_only: true
      # Writable cache PVC: persists the JIT/kernel cache (DeepGEMM/DeepEP/Triton/
      # torch.compile) across runs so kernels are compiled once and then reused.
      # Defaults to the model PVC under a `sflow-kernel-cache` sub_path; must be RWX
      # so all worker pods (incl. multi-node) can share it. Mounted read-write.
      - name: kernel-cache
        claim: ${{ variables.CACHE_PVC_CLAIM }}
        mount_path: ${{ variables.KERNEL_CACHE_DIR }}
        sub_path: sflow-kernel-cache
        read_only: false
    reservation:
      timeout: 1200

operators:
  # Native kubernetes operators carry the workload image. A single-node task
  # becomes one pod; a multi-node task becomes one pod per node.
  - name: dynamo_sglang
    type: k8s
    image: ${{ variables.DYNAMO_IMAGE }}
  - name: aiperf
    type: k8s
    image: ${{ variables.AIPERF_IMAGE }}

workflow:
  name: dynamo_sglang_disagg
  timeout: 115m

  variables:
    # Workflow level variables will overwrite the variables defined in global variables section if using same name
    HEAD_NODE_IP:
      description: "Head node IP (resolved after allocation)"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}"
    ETCD_ENDPOINTS:
      description: "ETCD endpoints"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}:2379"
    NATS_SERVER:
      description: "NATS server URL"
      value: "nats://${{ backends.k8s_cluster.nodes[0].ip_address }}:4222"

  tasks:
    - name: nats_server
      operator: dynamo_sglang
      script:
        - nats-server -js
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 4222
          interval: 2

    - name: etcd_server
      operator: dynamo_sglang
      script:
        - >
          etcd --listen-client-urls "http://0.0.0.0:2379"
          --advertise-client-urls "http://0.0.0.0:2379"
          --listen-peer-urls "http://0.0.0.0:2380"
          --initial-advertise-peer-urls "http://${HEAD_NODE_IP}:2380"
          --initial-cluster "default=http://${HEAD_NODE_IP}:2380"
          --data-dir /tmp/etcd
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 2379
          interval: 2

    - name: frontend_server
      operator: dynamo_sglang
      script:
        - python3 -m dynamo.frontend --http-port 8000 ${{ variables.EXTRA_FRONTEND_ARGS }}
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 8000
          timeout: 300
          interval: 5
      depends_on:
        - nats_server
        - etcd_server

    - name: prefill_server
      operator: dynamo_sglang
      replicas:
        count: ${{ variables.NUM_CTX_SERVERS }}
        policy: "parallel"
      script:
        - set -x
        - echo ${CUDA_VISIBLE_DEVICES}
        - >
          if [ "${NET_DEBUG}" == "1" ]; then
            export NCCL_DEBUG=INFO
            export NCCL_DEBUG_SUBSYS=NET
            export UCX_LOG_LEVEL=info
          fi
        # SFLOW_TASK_NODE_INDEX is the portable SLURM_NODEID; unset -> default 0.
        - export NODE_RANK=${SFLOW_TASK_NODE_INDEX:-0}
        - export FIRST_NODE_IP=$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1)
        # Per-replica ports (host_network shares node ports). On k8s each pod sees
        # its GPUs as 0,1,..., so offset by SFLOW_REPLICA_INDEX, not the first CUDA
        # index. Prefill uses NIXL base 5557 / system base 8082 / bootstrap base
        # 8998; decode uses different bases (6557 / 8182 / 9098) so a co-located
        # prefill and decode replica never collide.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=$((5557 + ${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_NODE }}))
        - export DYN_SYSTEM_PORT=$((8082 + ${SFLOW_REPLICA_INDEX:-0}))
        - export BOOTSTRAP_PORT=$((8998 + ${SFLOW_REPLICA_INDEX:-0}))
        # --- Persistent JIT/kernel cache on the mounted kernel-cache PVC ---
        # Point SGLang/DeepGEMM/DeepEP/Triton/torch.compile (+ flashinfer via XDG)
        # caches at the PVC so kernels compile ONCE and future runs reuse them.
        - export SFLOW_KERNEL_CACHE=${{ variables.KERNEL_CACHE_DIR }}
        - export XDG_CACHE_HOME=${SFLOW_KERNEL_CACHE}/xdg
        - export SGLANG_CACHE_DIR=${SFLOW_KERNEL_CACHE}/sglang
        - export SGLANG_DG_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_gemm
        - export DG_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_gemm
        - export EP_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_ep
        - export TRITON_CACHE_DIR=${SFLOW_KERNEL_CACHE}/triton
        - export TORCHINDUCTOR_CACHE_DIR=${SFLOW_KERNEL_CACHE}/inductor
        - mkdir -p "$XDG_CACHE_HOME" "$SGLANG_CACHE_DIR" "$DG_JIT_CACHE_DIR" "$EP_JIT_CACHE_DIR" "$TRITON_CACHE_DIR" "$TORCHINDUCTOR_CACHE_DIR"
        - >
          if [ "${CTX_NODES_PER_WORKER}" -gt 1 ]; then
            export MULTI_NODE_EXTRA_ARGS="--dist-init-addr ${FIRST_NODE_IP}:$((29500 + ${SFLOW_REPLICA_INDEX:-0})) --nnodes ${CTX_NODES_PER_WORKER} --node-rank ${NODE_RANK}"
          else
            export MULTI_NODE_EXTRA_ARGS=""
          fi
        - >
          python3 -m dynamo.sglang
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.CTX_TP_SIZE }}
          --pipeline-parallel-size ${{ variables.CTX_PP_SIZE }}
          --data-parallel-size ${{ variables.CTX_DP_SIZE }}
          --expert-parallel-size ${{ variables.CTX_EP_SIZE }}
          --moe-dense-tp-size ${{ variables.CTX_MOE_TP_SIZE }}
          --max-running-requests ${{ variables.CTX_BATCH_SIZE }}
          --max-prefill-tokens ${{ variables.CTX_MAX_NUM_TOKENS }}
          ${{ variables.CTX_ENABLE_ATTENTION_DP }}
          --disaggregation-mode prefill
          --disaggregation-bootstrap-port ${BOOTSTRAP_PORT}
          --disaggregation-transfer-backend nixl
          --load-balance-method round_robin
          --trust-remote-code
          --skip-tokenizer-init
          --cuda-graph-max-bs ${{ variables.CTX_BATCH_SIZE }}
          ${MULTI_NODE_EXTRA_ARGS}
          --host 0.0.0.0
          ${EXTRA_PREFILL_ARGS}
      resources:
        gpus:
          count: ${{ variables.CTX_GPUS_PER_WORKER }}
      depends_on:
        - frontend_server
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: decode_server
      operator: dynamo_sglang
      replicas:
        count: ${{ variables.NUM_GEN_SERVERS }}
        policy: "parallel"
      script:
        - set -x
        - echo ${CUDA_VISIBLE_DEVICES}
        - >
          if [ "${NET_DEBUG}" == "1" ]; then
            export NCCL_DEBUG=INFO
            export NCCL_DEBUG_SUBSYS=NET
            export UCX_LOG_LEVEL=info
          fi
        - export NODE_RANK=${SFLOW_TASK_NODE_INDEX:-0}
        - export FIRST_NODE_IP=$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1)
        # Decode bases (6557 / 8182 / 9098) differ from prefill's so a co-located
        # prefill and decode replica under host_network never share a port.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=$((6557 + ${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_NODE }}))
        - export DYN_SYSTEM_PORT=$((8182 + ${SFLOW_REPLICA_INDEX:-0}))
        - export BOOTSTRAP_PORT=$((9098 + ${SFLOW_REPLICA_INDEX:-0}))
        # --- Persistent JIT/kernel cache on the mounted kernel-cache PVC ---
        # Point SGLang/DeepGEMM/DeepEP/Triton/torch.compile (+ flashinfer via XDG)
        # caches at the PVC so kernels compile ONCE and future runs reuse them.
        - export SFLOW_KERNEL_CACHE=${{ variables.KERNEL_CACHE_DIR }}
        - export XDG_CACHE_HOME=${SFLOW_KERNEL_CACHE}/xdg
        - export SGLANG_CACHE_DIR=${SFLOW_KERNEL_CACHE}/sglang
        - export SGLANG_DG_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_gemm
        - export DG_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_gemm
        - export EP_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_ep
        - export TRITON_CACHE_DIR=${SFLOW_KERNEL_CACHE}/triton
        - export TORCHINDUCTOR_CACHE_DIR=${SFLOW_KERNEL_CACHE}/inductor
        - mkdir -p "$XDG_CACHE_HOME" "$SGLANG_CACHE_DIR" "$DG_JIT_CACHE_DIR" "$EP_JIT_CACHE_DIR" "$TRITON_CACHE_DIR" "$TORCHINDUCTOR_CACHE_DIR"
        - >
          if [ "${GEN_NODES_PER_WORKER}" -gt 1 ]; then
            export MULTI_NODE_EXTRA_ARGS="--dist-init-addr ${FIRST_NODE_IP}:$((29600 + ${SFLOW_REPLICA_INDEX:-0})) --nnodes ${GEN_NODES_PER_WORKER} --node-rank ${NODE_RANK}"
          else
            export MULTI_NODE_EXTRA_ARGS=""
          fi
        - >
          python3 -m dynamo.sglang
          --model-path ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.GEN_TP_SIZE }}
          --pipeline-parallel-size ${{ variables.GEN_PP_SIZE }}
          --data-parallel-size ${{ variables.GEN_DP_SIZE }}
          --expert-parallel-size ${{ variables.GEN_EP_SIZE }}
          --moe-dense-tp-size ${{ variables.GEN_MOE_TP_SIZE }}
          --max-running-requests ${{ variables.GEN_BATCH_SIZE }}
          --max-prefill-tokens ${{ variables.GEN_MAX_NUM_TOKENS }}
          ${{ variables.GEN_ENABLE_ATTENTION_DP }}
          --disaggregation-mode decode
          --disaggregation-bootstrap-port ${BOOTSTRAP_PORT}
          --disaggregation-transfer-backend nixl
          --prefill-round-robin-balance
          --trust-remote-code
          --skip-tokenizer-init
          --cuda-graph-max-bs ${{ variables.GEN_BATCH_SIZE }}
          ${MULTI_NODE_EXTRA_ARGS}
          --host 0.0.0.0
          ${EXTRA_DECODE_ARGS}
      resources:
        gpus:
          count: ${{ variables.GEN_GPUS_PER_WORKER }}
      depends_on:
        - frontend_server
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: benchmark
      operator: aiperf
      script:
        - pip install aiperf==0.3.0
        - set -x
        - export COLUMNS=200
        - >
          aiperf profile --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY}
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ variables.HEAD_NODE_IP }}:8000
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "max_tokens:${{ variables.OSL }}"
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --extra-inputs "{\"nvext\":{\"ignore_eos\":true}}"
          --extra-inputs "repetition_penalty:1.0"
          --extra-inputs "temperature: 0.0"
          --concurrency ${CONCURRENCY}
          --request-count $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --warmup-request-count ${CONCURRENCY}
          --num-dataset-entries $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --random-seed 100
          -H 'Authorization: Bearer NOT USED'
          -H 'Accept: text/event-stream'
          --record-processors 8
          --ui simple
        - echo "Benchmarking finished"
      resources:
        nodes:
          indices: [0]
      replicas:
        variables:
          - CONCURRENCY
        policy: sequential
      # Trigger a hardware monitor from this benchmark task but sample the
      # prefill/decode SERVERS' resources (used_by_tasks), not the benchmark
      # client's own node. NOTE: node-level hardware monitoring is not implemented
      # on the kubernetes backend yet, so sflow skips it (with a log hint) -- this
      # block stays for parity with the Slurm recipe and takes effect on backends
      # that support host monitoring.
      monitor:
        resources:
          used_by_tasks:
            - prefill_server
            - decode_server
        report:
          enabled: true
      depends_on:
        - prefill_server
        - decode_server
        - frontend_server
