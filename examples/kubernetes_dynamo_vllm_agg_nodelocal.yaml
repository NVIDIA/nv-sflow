version: "0.1"

# Aggregated (non-disaggregated) companion to
# examples/kubernetes_dynamo_vllm_disagg_nodelocal.yaml. Instead of splitting
# prefill and decode into separate workers with a NIXL KV-cache transfer between
# them, a single aggregated worker serves both phases. Sized to run one aggregated
# worker per GPU (NUM_AGG_SERVERS=4, AGG_TP_SIZE=1) on a single 4-GPU node.
#
# NODE-LOCAL variant: no PVC volumes. The model is pulled from HuggingFace and the
# JIT/kernel cache is written to the node-local PERSISTENT disk (`/var/tmp`,
# ~1.7Ti/node) via the NODE_CACHE_ROOT hostPath artifact -- so both are reused
# across runs that land on the same node. Nothing here mounts shared/cluster
# storage (the CephFS PVC cannot be mounted on the GB300 arm64 GPU nodes).
#
# Native Kubernetes recipe: a `kubernetes` backend (scheduling: device_plugin)
# reserves and discovers nodes, then each task runs as its own scheduler-placed
# pod whose GPUs come from the legacy nvidia.com/gpu device plugin. The operators
# are `type: k8s` and carry the workload images (DYNAMO_IMAGE / AIPERF_IMAGE).
#
# Cluster assumptions: NVIDIA gpu-operator (nvidia.com/gpu device plugin). The
# backend reserves real nodes with placeholder pods that hold the node GPUs,
# discovers their node names + InternalIPs, pins each task pod via nodeSelector,
# and hands the GPUs to the GPU tasks via the create-before-destroy handoff.
# CPU-only infra (etcd/nats/frontend) overlaps on node 0 without consuming GPUs.
# Set `scheduling: dra` to use DRA (nvidia-dra-driver-gpu, Kubernetes 1.34+,
# resource.k8s.io/v1, DeviceClass gpu.nvidia.com) instead of the device plugin.
#
# vLLM aggregated notes (what differs from the disagg port):
#   * No disaggregation: one worker runs prefill+decode, so there is no NIXL
#     KV-cache transfer and no --kv-transfer-config / --disaggregation-mode.
#     VLLM_NIXL_SIDE_CHANNEL_PORT is not used by an aggregated worker; it is
#     still exported (unique per replica) purely for parity with the disagg
#     recipe and to stay collision-free under host_network if multiple agg
#     replicas land on one node.
#   * Multi-node worker (AGG_GPUS_PER_WORKER > GPUS_PER_NODE) uses a Ray cluster.
#     resources.gpus.count auto-expands the task to one pod per node; the leader
#     pod (SFLOW_TASK_NODE_INDEX == 0) runs `ray start --head` and launches vLLM,
#     the other pods join Ray at SFLOW_TASK_ASSIGNED_NODE_IPS[0] and idle.
#     SFLOW_TASK_NODE_INDEX is the portable replacement for SLURM_NODEID.

variables:
  # --- Kubernetes backend configuration ---
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods"
    # PVCs are namespace-scoped, so this must be the namespace that holds
    # MODEL_PVC_CLAIM. Override both together per cluster, e.g.:
    #   -s K8S_NAMESPACE=perflab-hpcdl -s MODEL_PVC_CLAIM=shared-storage
    value: mlperf-sflow
  MODEL_PVC_CLAIM:
    description: "Existing PVC that holds the model weights (mounted read-only at /models); override per cluster"
    value: deepseek-r1-model-lustre
  GPUS_PER_NODE:
    description: "GPUs per node"
    type: integer
    value: 4
  NUM_NODES:
    description: "Number of nodes"
    value: 1
  COMPUTE_DOMAIN_CHANNEL:
    # CROSS-NODE NVLink (MNNVL/IMEX) only. Empty by default: this recipe runs
    # single-node (NUM_NODES=1), so an aggregated worker's tensor-parallel NCCL
    # traffic stays on INTRA-node NVLink -- no ComputeDomain needed.
    #
    # Set this ONLY for a MULTI-node, ONE-GPU-POD-PER-NODE topology (the driver allows
    # just one channel-claiming pod per node): name an EXISTING ComputeDomain's
    # spec.channel.resourceClaimTemplate.name so GPU pods get an IMEX channel for
    # cross-node NVLink. Find one with:
    # `kubectl -n <ns> get computedomains -o custom-columns=\
    #   NAME:.metadata.name,CHANNEL:.spec.channel.resourceClaimTemplate.name,STATUS:.status.status`
    # (on this cluster the K8s-tenant domain channel is `cd-k8s-perflab-hpcdl`).
    description: "Existing ComputeDomain channel RCT for CROSS-NODE NVLink (empty = single-node/intra-node NVLink)"
    value: ""
  HF_TOKEN:
    description: "HuggingFace token; provide at runtime with -s HF_TOKEN=hf_xxx (never commit a real token)"
    value: ""

  # --- Persistent kernel/JIT + model cache (reused across runs) ---
  # DeepGEMM / DeepEP / Triton / torch.compile JIT-compile kernels on first use, and
  # the model is pulled from HuggingFace -- both slow at every startup. The GPU worker
  # scripts point the cache env vars (HF_HOME / DG_JIT_CACHE_DIR / TRITON_CACHE_DIR /
  # ...) at KERNEL_CACHE_DIR, which lives on the node-local persistent disk (see the
  # NODE_CACHE_ROOT artifact), so runs that land on the same node reuse the compiled
  # kernels + downloaded weights instead of redoing the work every startup.
  KERNEL_CACHE_DIR:
    # Node-local PERSISTENT path (not the container's ephemeral /tmp, which is wiped
    # when the pod is deleted). /var/tmp is a sticky 1777 dir on the node's local root
    # disk, writable by the non-root (uid 1000) container and hostPath-mounted via the
    # NODE_CACHE_ROOT artifact. All pods on a node share it: the `download_model` task
    # pre-fetches the model per node BEFORE the workers start (so the concurrent HF
    # download lock never collides), and the compiled kernels are then reused across
    # runs. Change to any other node-local dir if your nodes have a dedicated scratch
    # mount (e.g. /raid/sflow-cache).
    description: "Node-local persistent path for the shared JIT/kernel + HF model cache"
    value: /var/tmp/sflow-cache
  CACHE_PVC_CLAIM:
    description: "RWX PVC that stores the kernel cache (defaults to the model PVC; set a dedicated RWX cache PVC if you have one)"
    value: ${{ variables.MODEL_PVC_CLAIM }}

  # Model Configuration
  SERVED_MODEL_NAME:
    description: "Served model name"
    value: Qwen3-8B-NVFP4
  MODEL_NAME:
    description: "Model path"
    value: nvidia/Qwen3-8B-NVFP4

  # Aggregated Server Configuration
  NUM_AGG_SERVERS:
    description: "Number of aggregated servers"
    type: integer
    # One agg worker per GPU on a single 4-GPU node (NUM_AGG_SERVERS * AGG_GPUS_PER_WORKER
    # == GPUS_PER_NODE * NUM_NODES). Mirrors the disagg nodelocal recipe's 2 prefill +
    # 2 decode = 4 GPUs, collapsed into 4 aggregated workers.
    value: 4
  AGG_TP_SIZE:
    description: "Aggregated tensor parallel size"
    type: integer
    value: 1
  AGG_DP_SIZE:
    description: "Aggregated data parallel size"
    type: integer
    value: 1
  AGG_EP_SIZE:
    description: "Aggregated expert parallel size"
    type: integer
    value: 1
  AGG_MOE_TP_SIZE:
    description: "Aggregated MOE tensor parallel size"
    type: integer
    value: 1
  AGG_PP_SIZE:
    description: "Aggregated pipeline parallel size"
    type: integer
    value: 1
  AGG_GPUS_PER_WORKER:
    description: "GPUs per aggregated worker"
    type: integer
    value: ${{ variables.AGG_TP_SIZE * variables.AGG_DP_SIZE * variables.AGG_PP_SIZE }}
  AGG_NODES_PER_WORKER:
    description: "Nodes per aggregated worker"
    type: integer
    value: ${{ [variables.AGG_GPUS_PER_WORKER // variables.GPUS_PER_NODE, 1] | max }}
  AGG_BATCH_SIZE:
    description: "Aggregated batch size"
    type: integer
    value: ${{ (variables.CONCURRENCY.domain | max) // variables.NUM_AGG_SERVERS }}
  AGG_MAX_NUM_TOKENS:
    description: "Aggregated max number of tokens"
    type: integer
    value: 4096
  AGG_MAX_SEQ_LEN:
    description: "Aggregated max sequence length"
    type: integer
    value: 2304
  AGG_FREE_GPU_MEMORY_FRACTION:
    description: "Aggregated free GPU memory fraction"
    value: 0.9
  AGG_ENABLE_ATTENTION_DP:
    description: "Aggregated enable attention DP"
    value: ""
  KV_CACHE_DTYPE:
    # Aggregated serving does NOT disaggregate, so the fp8-query kernel
    # restriction that forces the disagg recipe to bf16 does not apply here --
    # `fp8` is safe for an agg worker. `auto` (bf16 KV cache) is the default so
    # the recipe runs out of the box; set KV_CACHE_DTYPE=fp8 for a denser KV cache.
    description: "KV cache dtype"
    value: auto

  # Extra Arguments - You can append any optional arguments to the dynamo.vllm command
  EXTRA_FRONTEND_ARGS:
    description: "Extra frontend arguments"
    value: ""
  EXTRA_AGG_ARGS:
    description: "Extra aggregated server arguments"
    value: ""
  DYN_REQUEST_PLANE:
    description: "Dynamo request plane"
    value: "nats"

  # Network transport debugging. NET_DEBUG=1 makes each GPU worker log the
  # transport NCCL and UCX/NIXL actually pick, so you can confirm the tensor-parallel
  # (NCCL) traffic uses RDMA/NVLink and not a TCP/Ethernet fallback. Grep the
  # agg_server logs for:
  #   * NCCL: "NET/IB" (RDMA/RoCE) vs "NET/Socket" (TCP)
  #   * UCX/NIXL: "rc_mlx5"/"rc_verbs" (RDMA) vs "tcp"
  # Set NET_DEBUG=0 to silence the extra logging.
  NET_DEBUG:
    description: "Log NCCL/UCX transport selection (1=on, 0=off) to verify RDMA vs TCP"
    value: "1"

  # Benchmark Configuration
  ISL:
    description: "Input sequence length"
    value: 1024
  OSL:
    description: "Output sequence length"
    value: 1024
  MULTI_ROUND:
    description: "Number of benchmark rounds"
    value: 8
  CONCURRENCY:
    description: "Concurrency"
    value: 512
    domain: [512]

  # Container Images
  AIPERF_IMAGE:
    description: "AIPerf container image"
    value: python:3.12-slim
  DYNAMO_IMAGE:
    description: "Dynamo vLLM container image"
    value: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1-cuda13

artifacts:
  # On Kubernetes, artifacts are injected into the task pods the native way (not via
  # the controller's filesystem), accessible as `${{ artifacts.NAME.path }}`:
  #   * file:// + inline `content` -> mounted into the pod from a ConfigMap.
  #   * fs:// -> made visible inside the pod, two ways:
  #       1. PVC-backed (recommended for models/large data): declare a PVC under the
  #          backend's `volumes:` and point the fs:// path at a location under its
  #          `mount_path` (see the `volumes:` on the k8s_cluster backend).
  #       2. hostPath: if no PVC covers the path, fs:// is hostPath-mounted at the
  #          same path, so it must be NODE-accessible (e.g. an NFS/shared filesystem
  #          mounted on every node). A missing node path fails the pod loudly.
  #
  # vLLM passes everything on the command line, so there are no engine-config
  # artifacts -- only the model.
  - name: LOCAL_MODEL_PATH
    # Lives inside the `model-store` PVC (mounted at /models); see backend volumes.
    # Point this at wherever the model is staged inside the PVC.
    uri: fs:///models/Qwen3-8B-NVFP4
  - name: NODE_CACHE_ROOT
    # Node-local PERSISTENT scratch for the JIT/kernel + HF model cache. `/var/tmp`
    # is a sticky (1777) directory on each GB300 node's local root disk (~1.7Ti), so
    # it survives pod deletion (unlike the container's ephemeral /tmp) and stays
    # writable by the non-root (uid 1000) container. Any task whose script references
    # a path under it (via KERNEL_CACHE_DIR) gets `/var/tmp` hostPath-mounted, so runs
    # that land on the same node reuse the compiled kernels + downloaded weights.
    # NOTE: this is shared by all pods on a node -- the model is pre-fetched per node
    # by the `download_model` task (so the concurrent HF download lock never
    # collides), and the compiled kernels are reused across runs.
    # `systemd-tmpfiles` prunes /var/tmp entries unused for ~30d.
    uri: fs:///var/tmp
  - name: DOWNLOAD_MODEL_SCRIPT
    # Helper run by the per-node `download_model` task to warm the node-local HF
    # cache before the workers start. huggingface_hub's snapshot_download uses
    # blocking file locks + is idempotent, so re-runs on an already-cached node are
    # a no-op. (file:// helper script -- never inline python via heredoc/`-c`.)
    uri: file://download_model.py
    content: |
      import os
      import sys
      from huggingface_hub import snapshot_download

      repo = sys.argv[1]
      path = snapshot_download(repo_id=repo, cache_dir=os.path.join(os.environ["HF_HOME"], "hub"))
      print(f"[sflow] model {repo!r} cached at {path}", flush=True)

backends:
  # A kubernetes backend with device-plugin scheduling. No `image` field --
  # workload images come from the operators (DYNAMO_IMAGE / AIPERF_IMAGE) below.
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # Restrict scheduling to the K8s tenant's nodes. This cluster is split into a
    # Slurm tenant (compute01-08) and a K8s tenant (compute09-11); the K8s
    # ComputeDomain (COMPUTE_DOMAIN_CHANNEL) only covers the K8s-tenant nodes, and
    # the Slurm nodes already hold their IMEX channels permanently. Without this
    # selector sflow could reserve a Slurm node whose channel is unclaimable.
    # Applied to both the node reservation and every task pod. Change/remove the
    # label per cluster (empty {} = any GPU node).
    node_selector:
      tenant: perflab-hpcdl-k8s
    # pod IP == node IP, so peers can be addressed by the node InternalIPs that
    # reservation returns (etcd/NATS registration mirrors the Slurm path). It also
    # lets the multi-node Ray cluster address its head by a reachable node IP.
    host_network: true
    # Share the node IPC namespace + /dev/shm across pods. An aggregated worker
    # does not do cross-pod KV transfer (no NIXL), so this is not required for the
    # single-node case, but it is harmless and kept for parity with the disagg
    # nodelocal recipe (and needed if you ever co-locate pods that do CUDA IPC).
    host_ipc: true
    # Request GPUs via the legacy nvidia.com/gpu device plugin; use 'dra' for
    # DRA (nvidia-dra-driver-gpu, DeviceClass gpu.nvidia.com).
    scheduling: device_plugin
    # Cross-NODE NVLink (MNNVL / IMEX): join an EXISTING NVIDIA ComputeDomain by
    # claiming its channel ResourceClaimTemplate, so GPU pods get an IMEX channel
    # (/dev/nvidia-caps-imex-channels) for cross-node NVLink. We reuse an
    # admin-provisioned domain rather than create one, so this needs NO
    # `computedomains` RBAC; it works with device_plugin GPUs (the cluster runs the
    # DRA driver in ComputeDomain-only mode). Only GPU pods claim it (infra pods do
    # not). COMPUTE_DOMAIN_CHANNEL is the CR's spec.channel.resourceClaimTemplate.name;
    # override per cluster (`kubectl -n <ns> get computedomains`). Set to "" to skip.
    #
    # HARD LIMIT (NVIDIA DRA driver): ONE IMEX channel per node, single-allocation ->
    # at most ONE channel-claiming GPU pod per node per ComputeDomain. So this only
    # works with a ONE-GPU-POD-PER-NODE topology (spread workers across nodes). For a
    # same-node topology (e.g. NUM_NODES=1 here) leave this "" and rely on intra-node
    # NVLink. Do NOT set the CR's allocationMode to "All" to work around this
    # (NVIDIA/AWS warn it breaks scheduling, driver issue #353).
    dra:
      # Join an EXISTING IMEX ComputeDomain by its channel name (or `auto` for the
      # sole existing one; empty = off) for cross-node NVLink KV. sflow does not
      # create one by default (dra.create_compute_domain: true is the admin op).
      # (Renamed from compute_domain_channel; the old key still works with a warning.)
      use_compute_domain_channel: ${{ variables.COMPUTE_DOMAIN_CHANNEL }}
    # RDMA fast path (default 'auto'): detect the node's RDMA mechanism (GKE
    # multi-NIC, k8s-rdma-shared-dev-plugin, or bare-metal /dev/infiniband), grant
    # task GPU pods verbs access + CAP_IPC_LOCK, then expose all node NICs so
    # NCCL/UCX auto-select each GPU's closest device (verified in-pod, TCP fallback
    # if RDMA is unusable). Use 'off' to disable, or force one provider with
    # 'gke' / 'shared_device_plugin' / 'host_device'.
    rdma: auto
    # NODE-LOCAL variant: no PVC volumes. The CephFS `shared-storage` PVC cannot be
    # mounted on the GB300 (arm64) GPU nodes (the Ceph CSI nodeplugin does not run
    # there), so instead the model is pulled from HuggingFace and the JIT/kernel
    # cache is written to the node-local PERSISTENT disk (`/var/tmp`, ~1.7Ti/node)
    # via the NODE_CACHE_ROOT hostPath artifact -- so both are reused across runs
    # that land on the same node. Nothing here mounts shared/cluster storage.
    reservation:
      timeout: 1200

operators:
  # Native kubernetes operators carry the workload image. A single-node task
  # becomes one pod; a multi-node task becomes one pod per node.
  - name: dynamo_vllm
    type: k8s
    image: ${{ variables.DYNAMO_IMAGE }}
  - name: aiperf
    type: k8s
    image: ${{ variables.AIPERF_IMAGE }}

workflow:
  name: dynamo_vllm_agg
  timeout: 115m

  variables:
    # Workflow level variables will overwrite the variables defined in global variables section if using same name
    HEAD_NODE_IP:
      description: "Head node IP (resolved after allocation)"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}"
    ETCD_ENDPOINTS:
      description: "ETCD endpoints"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}:2379"
    NATS_SERVER:
      description: "NATS server URL"
      value: "nats://${{ backends.k8s_cluster.nodes[0].ip_address }}:4222"

  tasks:
    - name: nats_server
      operator: dynamo_vllm
      script:
        - nats-server -js
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 4222
          interval: 2

    - name: etcd_server
      operator: dynamo_vllm
      script:
        - >
          etcd --listen-client-urls "http://0.0.0.0:2379"
          --advertise-client-urls "http://0.0.0.0:2379"
          --listen-peer-urls "http://0.0.0.0:2380"
          --initial-advertise-peer-urls "http://${HEAD_NODE_IP}:2380"
          --initial-cluster "default=http://${HEAD_NODE_IP}:2380"
          --data-dir /tmp/etcd
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 2379
          interval: 2

    - name: frontend_server
      operator: dynamo_vllm
      script:
        - python3 -m dynamo.frontend --http-port 8000 ${{ variables.EXTRA_FRONTEND_ARGS }}
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 8000
          timeout: 300
          interval: 5
      depends_on:
        - nats_server
        - etcd_server

    - name: download_model
      operator: dynamo_vllm
      # Warm the node-local HF cache on EVERY reserved node BEFORE the GPU workers
      # start: one CPU-only pod per node (nodes.count == backend nodes). The workers
      # depend on this, so by the time they run the model already sits on each node's
      # local disk -- avoiding the concurrent HF-download lock contention that a cold
      # shared cache otherwise hits when co-located pods all download at once.
      resources:
        nodes:
          count: ${{ variables.NUM_NODES }}
      script:
        - set -x
        - export HF_HOME=${{ variables.KERNEL_CACHE_DIR }}/hf
        - mkdir -p "$HF_HOME"
        - python3 ${{ artifacts.DOWNLOAD_MODEL_SCRIPT.path }} "${{ variables.MODEL_NAME }}"
      probes:
        failure:
          log_watch:
            regex_pattern: "Traceback (most recent call last)"
          interval: 10

    - name: agg_server
      operator: dynamo_vllm
      replicas:
        count: ${{ variables.NUM_AGG_SERVERS }}
        policy: "parallel"
      script:
        - set -x
        - echo ${CUDA_VISIBLE_DEVICES}
        # Network transport logging (NET_DEBUG=1): make NCCL and UCX/NIXL print
        # the transport they pick so you can confirm RDMA vs a TCP fallback --
        # NCCL "NET/IB" vs "NET/Socket", UCX "rc_mlx5"/"rc_verbs" vs "tcp".
        - >
          if [ "${NET_DEBUG}" == "1" ]; then
            export NCCL_DEBUG=INFO
            export NCCL_DEBUG_SUBSYS=NET
            export UCX_LOG_LEVEL=info
          fi
        # Unique NIXL side-channel port per replica (host_network shares node
        # ports). An aggregated worker does not use NIXL, but exporting a unique
        # port keeps parity with the disagg recipe and stays collision-free if
        # multiple agg replicas land on the same node. The stride is
        # GPUS_PER_NODE so a worker's per-rank ports stay within its own slot.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=$((5557 + ${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_NODE }}))
        # --- Shared node-local persistent JIT/kernel + model cache ---
        # DeepGEMM/DeepEP/Triton/torch.compile (+ flashinfer via XDG) and the HF model
        # live on the node's local disk so they compile+download ONCE and future runs
        # reuse them. The model is pre-fetched per node by the `download_model` task
        # (a dependency), so workers read a warm cache -- no concurrent HF download
        # lock contention. Exported before `ray start` so ray workers inherit them.
        - export SFLOW_KERNEL_CACHE=${{ variables.KERNEL_CACHE_DIR }}
        - export XDG_CACHE_HOME=${SFLOW_KERNEL_CACHE}/xdg
        - export VLLM_CACHE_ROOT=${SFLOW_KERNEL_CACHE}/vllm
        - export TRITON_CACHE_DIR=${SFLOW_KERNEL_CACHE}/triton
        - export TORCHINDUCTOR_CACHE_DIR=${SFLOW_KERNEL_CACHE}/inductor
        - export DG_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_gemm
        - export EP_JIT_CACHE_DIR=${SFLOW_KERNEL_CACHE}/deep_ep
        # HF model download also goes to the node-local cache (container ~/.cache may
        # not be writable for the non-root image user).
        - export HF_HOME=${SFLOW_KERNEL_CACHE}/hf
        - mkdir -p "$XDG_CACHE_HOME" "$VLLM_CACHE_ROOT" "$TRITON_CACHE_DIR" "$TORCHINDUCTOR_CACHE_DIR" "$DG_JIT_CACHE_DIR" "$EP_JIT_CACHE_DIR" "$HF_HOME"
        # SFLOW_TASK_NODE_INDEX is the portable SLURM_NODEID (0 on the leader pod,
        # 1..N-1 on the worker pods); unset for single-node workers -> default 0.
        - export NODE_RANK=${SFLOW_TASK_NODE_INDEX:-0}
        - export FIRST_NODE_IP=$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1)
        - >
          if [ "${AGG_NODES_PER_WORKER}" -gt 1 ]; then
            if [[ "${NODE_RANK}" == "0" ]]; then
              unset CUDA_VISIBLE_DEVICES
              ray start --head --port=6379
            else
              export RAY_worker_register_timeout_seconds=1200 # This to avoid master node load image slower than worker node
              ray start --address ${FIRST_NODE_IP}:6379
            fi
            # wait until GPU string appears in ray status output
            while true; do
              if ray status | grep "${AGG_GPUS_PER_WORKER}.0 GPU"; then
                break
              else
                echo "Waiting for Ray cluster GPUs to be available in ray status..."
                sleep 5
              fi
            done
            echo "Ray cluster GPUs are now available."
          else
            echo "Do not need to setup ray cluster because worker only needs ${AGG_GPUS_PER_WORKER} GPUs, and GPUS_PER_NODE is ${{ variables.GPUS_PER_NODE }}"
          fi
        - >
          if [[ "${NODE_RANK}" == "0" ]]; then
            EXTRA_RAY_ARGS=""
            if [ "${AGG_NODES_PER_WORKER}" -gt 1 ]; then
              EXTRA_RAY_ARGS="--distributed-executor-backend ray"
            fi
            python3 -m dynamo.vllm --model ${{ variables.MODEL_NAME }} \
            --served-model-name ${{ variables.SERVED_MODEL_NAME }} \
            --tensor-parallel-size ${AGG_TP_SIZE} \
            --pipeline-parallel-size ${AGG_PP_SIZE} \
            --data-parallel-size ${AGG_DP_SIZE} \
            --kv-cache-dtype ${{ variables.KV_CACHE_DTYPE }} \
            --no-enable-prefix-caching \
            --block-size 128 \
            --max-num-seqs ${AGG_BATCH_SIZE} \
            --max-num-batched-tokens ${AGG_MAX_NUM_TOKENS} ${EXTRA_RAY_ARGS} ${EXTRA_AGG_ARGS}
          else
            echo "This is a worker node, do not need to run vllm launch cmd, but remember to setup ray cluster and launch in the master node"
            sleep 3600
          fi
      resources:
        gpus:
          count: ${{ variables.AGG_GPUS_PER_WORKER }}
      depends_on:
        - frontend_server
        - download_model
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: benchmark
      operator: aiperf
      script:
        - pip install aiperf==0.3.0
        - set -x
        - export COLUMNS=200
        # Node-local PERSISTENT HF cache for the tokenizer download (see
        # NODE_CACHE_ROOT); /var/tmp is hostPath-mounted and survives across runs.
        - export HF_HOME=${{ variables.KERNEL_CACHE_DIR }}/hf
        - mkdir -p "$HF_HOME"
        - >
          aiperf profile --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY}
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ variables.MODEL_NAME }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ variables.HEAD_NODE_IP }}:8000
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "max_tokens:${{ variables.OSL }}"
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --extra-inputs "{\"nvext\":{\"ignore_eos\":true}}"
          --extra-inputs "repetition_penalty:1.0"
          --extra-inputs "temperature: 0.0"
          --concurrency ${CONCURRENCY}
          --request-count $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --warmup-request-count ${CONCURRENCY}
          --num-dataset-entries $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --random-seed 100
          -H 'Authorization: Bearer NOT USED'
          -H 'Accept: text/event-stream'
          --record-processors 8
          --ui simple
        - echo "Benchmarking finished"
      resources:
        nodes:
          indices: [0]
      replicas:
        variables:
          - CONCURRENCY
        policy: sequential
      # Trigger a hardware monitor from this benchmark task but sample the
      # aggregated SERVER's resources (used_by_tasks), not the benchmark client's
      # own node -- so the report captures the server's GPU/CPU usage over the
      # benchmark window.
      monitor:
        resources:
          used_by_tasks:
            - agg_server
        report:
          enabled: true
      depends_on:
        - agg_server
        - frontend_server
