version: "0.1"

# SELF-CONTAINED Kubernetes recipe for deepseek-r1 / B200-SXM-180GBx8 / TRTLLM / Offline.
#
# Single-file equivalent of the modular trio
#   deepseek_config_sflow.yaml + k8s_env_sflow.yaml + scaleout/sflow/templates/trtllm_ifb_loadgen_k8s.yaml
# merged into one file, with the per-rank engine config (trtllm-serve-ifb-dep8.yaml) and
# its env vars (trtllm-serve-ifb-dep8-env.yaml) INLINED -- so this recipe carries its own
# engine config and does not read the separate yaml files or run_with_env.py from /work.
#
# Run it:
#   sflow run \
#     -f configs/deepseek_r1/B200-SXM-180GBx8/TRTLLM/Offline/k8s_standalone_sflow.yaml \
#     --set K8S_NAMESPACE=... --set MODEL_PVC_CLAIM=...
#
# Requires ONE pre-existing RWX PVC (MODEL_PVC_CLAIM, e.g. deepseek-r1-model-nfs) that
# holds the model, the nv_mlpinf work bundle, AND the preprocessed dataset. It is mounted
# ONCE, read-write, at PVC_MOUNT (default /home/mlperf_inference_storage); every path
# pointer is just a real subpath inside that single mount:
#   * MODEL_PATH          = <PVC_MOUNT>/<model dir>       (served by trtllm-serve)
#   * WORK_DIR            = <PVC_MOUNT>/<BUNDLE_SUBPATH>  (nv_mlpinf bundle: the harness cd's
#                           here, `pip install -e`s it, and reads configs +
#                           3rdparty/mlc-inference from it)
#   * MLPERF_SCRATCH_PATH = <PVC_MOUNT>                   (holds preprocessed_data/deepseek-r1/)
# One read-write mount (rather than a second, read-only scratch mount of the same export)
# avoids the NFS trap where the shared superblock goes read-only for ALL mounts of it.
#
# Topology: TWO nodes (an 8-GPU server + a 1-GPU harness do not fit on one 8-GPU node).
#   * node 0: ONE server spanning all 8 GPUs (DP_MULTIPLICITY=1, GPUS_PER_DP_RANK=8 ->
#     tensor/expert parallel 8) running plain trtllm-serve.
#   * node 1: the MLPerf loadgen harness with 1 GPU. It targets the SERVER's node IP
#     (reserved node 0) -- NOT its own -- via ${{ backends.k8s_cluster.nodes[0].ip_address }}.
# The server and harness are pinned to distinct reserved node indices (0 and 1) so that
# nodes[0] is deterministically the server's node.
#
# NOTE: the harness is only a NETWORK client of trtllm-serve, but nv_mlpinf pulls in the
# CUDA stack (nvmitten / cupy / cuda-python) at import -- both in the main process and in
# the mp-spawned HTTP request workers -- so the pod needs a real GPU (device plugin
# injects the driver/libcuda). On a GPU-less pod the workers die with "Failed to dlopen
# libcuda.so.1". The GPU-less bypasses in the bundle (system_list detect shim,
# load_tensor non-pinned fallback) stay as harmless no-ops when a GPU is present.

variables:
  # --- IFB topology (from deepseek_config_sflow.yaml), B200x8 scale (1 node x 8 GPUs) ---
  DP_MULTIPLICITY:
    type: integer
    value: 1
  GPUS_PER_DP_RANK:
    type: integer
    value: 8
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.DP_MULTIPLICITY * variables.GPUS_PER_DP_RANK }}
  BASE_PORT:
    description: "Base port; replica i serves on BASE_PORT + i"
    value: 8336
  COLLECT_NSYS:
    description: "Set to 1 to collect one nsys profile on the trtllm-serve pod."
    value: "0"

  # --- Model + benchmark identity (from deepseek_config_sflow.yaml) ---
  MODEL_PATH:
    value: ${{ variables.PVC_MOUNT }}/DeepSeek-R1-NVFP4-v2
    # value: ${{ variables.PVC_MOUNT }}/Qwen3-8B-FP8
  PREPROCESSED_DATA_DIR:
    description: "In-pod dir with MLPerf preprocessed tensors; the harness reads <this>/deepseek-r1/{input_ids_padded,input_lens}.npy. Real subpath of the single PVC mount (PVC_MOUNT/preprocessed_data)."
    value: ${{ variables.PVC_MOUNT }}/preprocessed_data
  HARNESS_BUILD_DIR:
    description: "Pod-local (writable, ephemeral) scratch for the harness: nvmitten ScratchSpace + loadgen configs/logs. Kept off the PVC so transient build scratch is not written to NFS (nv_mlpinf's default BUILD_DIR=/work/build is not on the PVC mount here)."
    value: /tmp/mlperf_build
  PVC_RESULTS_DIR:
    description: "Persistent dir on MODEL_PVC_CLAIM for harness console log + loadgen result files (a per-run subdir is created under it) so they survive the pod. Sibling of the work bundle at the PVC root, untouched by the sync script."
    value: ${{ variables.PVC_MOUNT }}/sflow_harness_results
  TRTLLM_DIR:
    description: "In-container TRT-LLM source tree (the default /work/3rdparty/trtllm submodule is not in the bundle). Used by nv_mlpinf engine-build helpers; only needs to exist for the client."
    value: /app/tensorrt_llm
  BENCHMARK:
    value: deepseek-r1
  SCENARIO:
    value: Offline
  SYSTEM_NAME:
    value: B200-SXM-180GBx8
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
  # --- Smoke test (fast pipeline bring-up; NOT a valid MLPerf result) ---
  # SMOKE=1 makes harness.py shrink the workload (few queries + short outputs) so a run
  # finishes in minutes instead of hours. Enable with --set SMOKE=1.
  SMOKE:
    description: "1 = fast smoke test (few queries, short outputs); 0 = full run."
    value: "0"
  SMOKE_QUERY_COUNT:
    description: "SMOKE=1: total loadgen queries (min == max query count)."
    type: integer
    value: 6000
  SMOKE_MIN_DURATION:
    description: "SMOKE=1: loadgen min_duration in ms."
    type: integer
    value: 120000
  SMOKE_MAX_CONCURRENCY:
    description: "SMOKE=1: max concurrent requests the harness sends to the server."
    type: integer
    value: 5120
  SMOKE_MAX_OUTPUT_LEN:
    description: "SMOKE=1: cap on generated tokens per request (overrides the gen config's max_output_len via llmlib/config.py). Lower = faster smoke run."
    type: integer
    value: 20000

  # --- Container image + Kubernetes backend (from k8s_env_sflow.yaml) ---
  CONTAINER_IMAGE:
    description: "Container image (NGC URL) with TRT-LLM + nv-mlpinf. Override via --set CONTAINER_IMAGE=..."
    value: "nvcr.io/nvidia/mlperf/mlperf-inference:tensorrt_llm_release-feat-1.2-mlpinf-b5ddff4_mlperf-main-f538816_jan28_x86"
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods (must hold the PVC below)"
    value: mlperf-sflow
  # A single pre-existing RWX PVC holds the model, the nv_mlpinf work bundle, and the
  # preprocessed dataset. It is mounted ONCE (read-write) at PVC_MOUNT; every path below
  # is just a real subpath inside it.
  MODEL_PVC_CLAIM:
    description: "PVC holding the model (MODEL_PATH), the nv_mlpinf work bundle (WORK_DIR), and preprocessed_data/"
    value: deepseek-r1-model-nfs
  PVC_MOUNT:
    description: "In-pod path where MODEL_PVC_CLAIM (the whole PVC) is mounted read-write, exactly once."
    value: /home/mlperf_inference_storage
  BUNDLE_SUBPATH:
    description: "Directory name of the nv_mlpinf work bundle within the PVC (relative to PVC_MOUNT)."
    value: nv_mlpinf_work_bundle
  WORK_DIR:
    description: "In-pod path to the nv_mlpinf work bundle (== the old /work). The harness cd's here and pip-installs it."
    value: ${{ variables.PVC_MOUNT }}/${{ variables.BUNDLE_SUBPATH }}
  GPUS_PER_NODE:
    type: integer
    value: 8
  SERVER_NODES:
    description: "Nodes the server spans: ceil(TOTAL_GPUS / GPUS_PER_NODE) -- 1 for this config"
    type: integer
    value: ${{ ((variables.TOTAL_GPUS / variables.GPUS_PER_NODE) | round(0, "ceil")) | int }}
  NUM_NODES:
    description: "SERVER_NODES + 1: the extra node hosts the 1-GPU harness (the server's 8 GPUs fill its own node)."
    type: integer
    value: ${{ variables.SERVER_NODES + 1 }}

artifacts:
  # Per-rank trtllm-serve engine config, inlined verbatim from
  # configs/.../TRTLLM/Offline/trtllm-serve-ifb-dep8.yaml. On k8s a file:// artifact
  # with inline content is injected into the pod from a ConfigMap and referenced via
  # ${{ artifacts.TRTLLM_YAML.path }} -- no /work path needed for the engine config.
  - name: TRTLLM_YAML
    uri: file://trtllm-serve-ifb-dep8.yaml
    content: |
      backend: pytorch
      tensor_parallel_size: ${{ variables.GPUS_PER_DP_RANK }}
      pipeline_parallel_size: 1
      moe_expert_parallel_size: ${{ variables.GPUS_PER_DP_RANK }}
      max_batch_size: 512
      max_num_tokens: 4608
      max_seq_len: 23140
      print_iter_log: true
      enable_iter_perf_stats: true
      return_perf_metrics: true
      enable_layerwise_nvtx_marker: false
      enable_chunked_prefill: false
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      kv_cache_config:
        dtype: fp8
        free_gpu_memory_fraction: 0.9
        enable_block_reuse: false
      enable_attention_dp: true
      moe_config:
        backend: CUTEDSL
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 384, 512]
      cache_transceiver_config:
        backend: DEFAULT
      attention_dp_config:
        enable_balance: true
        batching_wait_iters: 10
        timeout_iters: 500

operators:
  - name: test_container
    type: k8s
    image: ${{ variables.CONTAINER_IMAGE }}
    # 8-way NCCL over intra-node NVLink needs a large /dev/shm (k8s default is 64Mi).
    shm_size: 64Gi

backends:
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP, so the harness reaches the server at its node IP:BASE_PORT.
    host_network: true
    host_ipc: true
    # Request GPUs via the legacy nvidia.com/gpu device plugin; use 'dra' for DRA.
    scheduling: device_plugin
    # TP/EP=8 is intra-node (all 8 GPUs in one pod, NVLink/P2P) -> no cross-node RDMA.
    rdma: "auto"
    # The whole PVC mounted ONCE, read-write, at PVC_MOUNT. Model, work bundle, and
    # preprocessed_data are all real subpaths inside it (MODEL_PATH / WORK_DIR /
    # PREPROCESSED_DATA_DIR). A single read-write mount avoids the NFS "same export mounted
    # read-only twice -> whole superblock read-only" trap. A volume is mounted into a
    # task's pod only when the task references a path under its mount_path, so both the
    # server (MODEL_PATH) and the harness (WORK_DIR + scratch) get it.
    volumes:
      - name: pvc
        claim: ${{ variables.MODEL_PVC_CLAIM }}
        mount_path: ${{ variables.PVC_MOUNT }}
        read_only: false
    reservation:
      timeout: 1200

workflow:
  name: deepseek_r1_offline_ifb
  timeout: 115m
  tasks:
    - name: server
      replicas:
        count: ${{ variables.DP_MULTIPLICITY }}
        policy: parallel
      resources:
        # Pin the (single, DP_MULTIPLICITY=1) 8-GPU server to reserved node 0 so the harness
        # on node 1 can address it deterministically via nodes[0].ip_address.
        gpus:
          count: ${{ variables.GPUS_PER_DP_RANK }}
      operator: test_container
      script:
        - set -x
        # Env vars inlined from trtllm-serve-ifb-dep8-env.yaml (replaces run_with_env.py).
        - export TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER=1
        - export TRTLLM_SERVER_DISABLE_GC=1
        - export OMPI_MCA_coll_ucc_enable=0
        - export TRTLLM_ENABLE_PDL=0
        - export TLLM_PROFILE_START_STOP=12000-12100
        # Per-replica FlashInfer JIT workspace (pod-local /tmp).
        - export FLASHINFER_WORKSPACE_BASE=/tmp/flashinfer_${SFLOW_REPLICA_INDEX:-0}
        - mkdir -p "${FLASHINFER_WORKSPACE_BASE}"
        - export PORT=$(( ${{ variables.BASE_PORT }} + ${SFLOW_REPLICA_INDEX:-0} ))
        # No trtllm-llmapi-launch: the pod owns all 8 GPUs and trtllm-serve spawns its
        # own TP/EP workers across them.
        - >
          NSYS_CMD="";
          if [ "${{ variables.COLLECT_NSYS }}" = "1" ]; then
            NSYS_CMD="/usr/local/bin/nsys profile --force-overwrite=true -t cuda,nvtx,python-gil -c cudaProfilerApi --cuda-graph-trace=node --capture-range-end=stop --gpu-metrics-devices=all --wait=all --output ${SFLOW_TASK_OUTPUT_DIR}/nsys_profile-dp${SFLOW_REPLICA_INDEX:-0}";
          fi;
          ${NSYS_CMD} trtllm-serve ${{ variables.MODEL_PATH }}
          --host 0.0.0.0
          --port ${PORT}
          --extra_llm_api_options ${{ artifacts.TRTLLM_YAML.path }}
      probes:
        readiness:
          log_watch:
            regex_pattern: "Application startup complete"
          timeout: 1800
          interval: 5
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: mlperf_harness
      operator: test_container
      resources:
        # The harness runs on its OWN node (reserved index 1) with ONE GPU: the server fills
        # node 0's 8 GPUs, and nv_mlpinf (+ its mp-spawned HTTP workers) need a real GPU for
        # the CUDA runtime they import (GPU-less pods fail to dlopen libcuda.so.1).
        nodes:
          indices: [-1]
        gpus:
          count: 1
      script:
        - set -x
        - export PYTHONUNBUFFERED=1
        # All nv_mlpinf INPUT paths live under the single PVC mount:
        - export MLPERF_SCRATCH_PATH=${{ variables.PVC_MOUNT }}
        # preprocessed tensors: ${PREPROCESSED_DATA_DIR}/deepseek-r1/{input_ids_padded,input_lens}.npy
        - export PREPROCESSED_DATA_DIR=${{ variables.PREPROCESSED_DATA_DIR }}
        # configs load from PROJECT_BASE_DIR/configs, and the MLCommons submission_checker
        # from MLCOMMONS_INF_REPO -- both are inside the work bundle on the PVC.
        - export PROJECT_BASE_DIR=${{ variables.WORK_DIR }}
        - export MLCOMMONS_INF_REPO=${{ variables.WORK_DIR }}/3rdparty/mlc-inference
        # Silence nv_mlpinf's path validation with real locations: model checkpoints live
        # at the PVC root, the dataset (preprocessed_data/) is under it too, and TRT-LLM
        # ships in the container at /app/tensorrt_llm (default /work/3rdparty/trtllm absent).
        - export MODEL_DIR=${{ variables.PVC_MOUNT }}
        - export DATA_DIR=${{ variables.PVC_MOUNT }}
        - export TRTLLM_DIR=${{ variables.TRTLLM_DIR }}
        # The harness loads its tokenizer from the deepseek-r1 checkpoint (its model_path);
        # point that at the real on-PVC model dir (has tokenizer.json) so it isn't the
        # non-existent MODEL_DIR/deepseek-r1/fp4-quantized-modelopt/... default.
        - export DEEPSEEK_R1_CHECKPOINT_PATH=${{ variables.MODEL_PATH }}
        # Fast smoke test (SMOKE=1): harness.py reads these to shrink the query count +
        # output length so a run finishes in minutes (NOT a valid MLPerf result).
        - export MLPERF_SMOKE=${{ variables.SMOKE }}
        - export SMOKE_QUERY_COUNT=${{ variables.SMOKE_QUERY_COUNT }}
        - export SMOKE_MIN_DURATION=${{ variables.SMOKE_MIN_DURATION }}
        - export SMOKE_MAX_CONCURRENCY=${{ variables.SMOKE_MAX_CONCURRENCY }}
        - export SMOKE_MAX_OUTPUT_LEN=${{ variables.SMOKE_MAX_OUTPUT_LEN }}
        # Transient build scratch (nvmitten ScratchSpace + loadgen configs/logs) -> pod-local.
        - export BUILD_DIR=${{ variables.HARNESS_BUILD_DIR }}
        - cd ${{ variables.WORK_DIR }}
        - pip install -e ".[llm]" -q --no-build-isolation
        # The harness runs on node 1, so its OWN node IP is NOT the server's. Target the
        # server's node (reserved index 0) explicitly (host_network -> pod IP == node IP).
        - export HOST_IP=${{ backends.k8s_cluster.nodes[0].ip_address }}
        - >
          SERVER_URLS=$(for i in $(seq 0 $(( ${{ variables.DP_MULTIPLICITY }} - 1 ))); do
          echo "${HOST_IP}:$(( ${{ variables.BASE_PORT }} + i ))";
          done | paste -sd,)
        - echo "Server URLs ${SERVER_URLS}"
        - |
          set +e
          set -o pipefail
          # Persist the console log + loadgen result files on the PVC so they outlive the
          # pod. Use a per-run subdir named after the sflow run (the parent dir of
          # SFLOW_TASK_OUTPUT_DIR) so runs don't clobber each other; fall back to a UTC
          # timestamp if that env isn't set. LOG_DIR is honored by nv_mlpinf (its `log_dir`
          # field reads the LOG_DIR env), so loadgen writes mlperf_log_*.txt there.
          RUN_TAG="$(basename "$(dirname "${SFLOW_TASK_OUTPUT_DIR}")")"
          case "${RUN_TAG}" in ""|"."|"/") RUN_TAG="run-$(date -u +%Y%m%d-%H%M%S)";; esac
          OUT_DIR=${{ variables.PVC_RESULTS_DIR }}/${RUN_TAG}
          HARNESS_LOG=${OUT_DIR}/${{ variables.TEST_MODE }}.log
          LOG_DIR=${OUT_DIR}/${{ variables.TEST_MODE }}
          mkdir -p "${LOG_DIR}"
          echo "Harness log + loadgen results -> ${OUT_DIR} (on PVC ${{ variables.MODEL_PVC_CLAIM }})"
          LOG_DIR=${LOG_DIR} \
            nv-mlpinf run_harness \
              --benchmarks=${{ variables.BENCHMARK }} \
              --scenarios=${{ variables.SCENARIO }} \
              --system_name=${{ variables.SYSTEM_NAME }} \
              --trtllm_server_urls=${SERVER_URLS} \
              --test_mode=${{ variables.TEST_MODE }} \
              ${{ variables.HARNESS_EXTRA_ARGS }} 2>&1 | tee "${HARNESS_LOG}"
          HARNESS_EXIT=$?
          echo "=== mlperf_harness run_harness exited with ${HARNESS_EXIT}; results on PVC at ${OUT_DIR} ==="
          exit 0
      depends_on:
        - server
