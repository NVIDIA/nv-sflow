version: "0.1"

# SELF-CONTAINED Kubernetes recipe for deepseek-r1 / B200-SXM-180GBx8 / TRTLLM / Offline.
#
# Single-file equivalent of the modular trio
#   deepseek_config_sflow.yaml + k8s_env_sflow.yaml + scaleout/sflow/templates/trtllm_ifb_loadgen_k8s.yaml
# merged into one file, with the per-rank engine config (trtllm-serve-ifb-dep8.yaml) and
# its env vars (trtllm-serve-ifb-dep8-env.yaml) INLINED -- so this recipe carries its own
# engine config and does not read the separate yaml files or run_with_env.py from /work.
#
# Run it:
#   sflow run \
#     -f configs/deepseek_r1/B200-SXM-180GBx8/TRTLLM/Offline/k8s_standalone_sflow.yaml \
#     --set K8S_NAMESPACE=... --set MODEL_PVC_CLAIM=...
#
# Requires ONE pre-existing RWX PVC (MODEL_PVC_CLAIM, e.g. deepseek-r1-model-nfs) that
# holds the model, the nv_mlpinf work bundle, AND the preprocessed dataset. It is mounted
# ONCE, read-write, at PVC_MOUNT (default /home/mlperf_inference_storage); every path
# pointer is just a real subpath inside that single mount:
#   * MODEL_PATH          = <PVC_MOUNT>/<model dir>       (served by trtllm-serve)
#   * WORK_DIR            = <PVC_MOUNT>/<BUNDLE_SUBPATH>  (nv_mlpinf bundle: the harness cd's
#                           here, `pip install -e`s it, and reads configs +
#                           3rdparty/mlc-inference from it)
#   * MLPERF_SCRATCH_PATH = <PVC_MOUNT>                   (holds preprocessed_data/deepseek-r1/)
# One read-write mount (rather than a second, read-only scratch mount of the same export)
# avoids the NFS trap where the shared superblock goes read-only for ALL mounts of it.
#
# Topology: THREE nodes -- a cross-node TP/EP=16 server (2 nodes) + a 1-GPU harness.
#   * nodes 0-1: ONE server instance spanning 16 GPUs (DP_MULTIPLICITY=1,
#     GPUS_PER_DP_RANK=16 -> tensor/expert parallel 16) across two 8-GPU nodes. Because
#     trtllm-serve's LLM API is MPI-based, the two server pods must form ONE cross-node MPI
#     world (8 ranks/pod): the leader pod (task node_index 0, on reserved node 0) drives
#     `mpirun` over SSH into the worker pod and runs `trtllm-llmapi-launch trtllm-serve`;
#     the worker pod just runs sshd and waits for the leader. Cross-node TP/EP NCCL rides
#     RDMA (backend rdma: auto -> GKE gIB). This is the K8s analogue of the working SLURM
#     path `srun --ntasks=16 --ntasks-per-node=8 --mpi=pmix trtllm-llmapi-launch trtllm-serve`.
#   * node 2 (last): the MLPerf loadgen harness with 1 GPU. It targets the SERVER leader's
#     node IP (reserved node 0) -- NOT its own -- via ${{ backends.k8s_cluster.nodes[0].ip_address }}.
# The harness is pinned to the last reserved node (indices: [-1]); the server is left
# unpinned so it takes the first SERVER_NODES nodes (0,1) and its leader (task node_index 0
# == SFLOW_TASK_ASSIGNED_NODE_IPS[0]) lands on reserved node 0 == nodes[0].
#
# NOTE: the harness is only a NETWORK client of trtllm-serve, but nv_mlpinf pulls in the
# CUDA stack (nvmitten / cupy / cuda-python) at import -- both in the main process and in
# the mp-spawned HTTP request workers -- so the pod needs a real GPU (device plugin
# injects the driver/libcuda). On a GPU-less pod the workers die with "Failed to dlopen
# libcuda.so.1". The GPU-less bypasses in the bundle (system_list detect shim,
# load_tensor non-pinned fallback) stay as harmless no-ops when a GPU is present.

variables:
  # --- IFB topology (from deepseek_config_sflow.yaml). TP/EP=16 spans TWO 8-GPU nodes ---
  DP_MULTIPLICITY:
    type: integer
    value: 1
  GPUS_PER_DP_RANK:
    description: "GPUs per DP rank == the server's TP/EP world size. 16 => the instance spans 2 nodes (SERVER_NODES=ceil(16/8)=2) launched as ONE cross-node MPI world; set to 8 for a single-node instance (the server script auto-detects node count)."
    type: integer
    value: 16
  KV_CACHE_FRACTION:
    description: "kv_cache_config.free_gpu_memory_fraction. Cross-node TP16 must leave MUCH more GPU headroom than the single-node NVLink path (0.9): the inter-node MoE/NCCL fallback allocates extra comm workspaces (e.g. the ~2.1GB NVLinkOneSided/AllGather buffers per rank) + CUDA-graph capture + cuBLAS handles that aren't in TRT-LLM's KV pool estimate. Observed on 183GB GPUs: 0.9 OOMs at the KV cudaMalloc, 0.7 gets further but OOMs at cublasCreate, 0.5/0.3 both OOM'd at the NCCL cross-node buffer alloc. The real lever turned out to be the engine's max_num_tokens/max_batch_size (they size the activation + cross-node NCCL comm buffers): with those reduced, 0.5 fits. Tune up if GPU memory is spare (throughput scales with KV cache)."
    value: "0.5"
  NCCL_DEBUG:
    description: "NCCL log verbosity for the multi-node server ranks (propagated to all MPI ranks). WARN by default; set to INFO (--set NCCL_DEBUG=INFO) to debug cross-node NCCL/RDMA collective failures (e.g. 'unhandled cuda error' in the MoE allgather)."
    value: "WARN"
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.DP_MULTIPLICITY * variables.GPUS_PER_DP_RANK }}
  BASE_PORT:
    description: "Base port; replica i serves on BASE_PORT + i"
    value: 8336
  COLLECT_NSYS:
    description: "Set to 1 to collect one nsys profile on the trtllm-serve pod."
    value: "0"

  # --- Model + benchmark identity (from deepseek_config_sflow.yaml) ---
  MODEL_PATH:
    value: ${{ variables.PVC_MOUNT }}/DeepSeek-R1-NVFP4-v2
    # value: ${{ variables.PVC_MOUNT }}/Qwen3-8B-FP8
  PREPROCESSED_DATA_DIR:
    description: "In-pod dir with MLPerf preprocessed tensors; the harness reads <this>/deepseek-r1/{input_ids_padded,input_lens}.npy. Real subpath of the single PVC mount (PVC_MOUNT/preprocessed_data)."
    value: ${{ variables.PVC_MOUNT }}/preprocessed_data
  HARNESS_BUILD_DIR:
    description: "Pod-local (writable, ephemeral) scratch for the harness: nvmitten ScratchSpace + loadgen configs/logs. Kept off the PVC so transient build scratch is not written to NFS (nv_mlpinf's default BUILD_DIR=/work/build is not on the PVC mount here)."
    value: /tmp/mlperf_build
  PVC_RESULTS_DIR:
    description: "Persistent dir on MODEL_PVC_CLAIM for harness console log + loadgen result files (a per-run subdir is created under it) so they survive the pod. Sibling of the work bundle at the PVC root, untouched by the sync script."
    value: ${{ variables.PVC_MOUNT }}/sflow_harness_results
  TRTLLM_DIR:
    description: "In-container TRT-LLM source tree (the default /work/3rdparty/trtllm submodule is not in the bundle). Used by nv_mlpinf engine-build helpers; only needs to exist for the client."
    value: /app/tensorrt_llm
  BENCHMARK:
    value: deepseek-r1
  SCENARIO:
    value: Offline
  SYSTEM_NAME:
    value: B200-SXM-180GBx8
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
  # --- Smoke test (fast pipeline bring-up; NOT a valid MLPerf result) ---
  # SMOKE=1 makes harness.py shrink the workload (few queries + short outputs) so a run
  # finishes in minutes instead of hours. Enable with --set SMOKE=1.
  SMOKE:
    description: "1 = fast smoke test (few queries, short outputs); 0 = full run."
    value: "0"
  SMOKE_QUERY_COUNT:
    description: "SMOKE=1: total loadgen queries (min == max query count)."
    type: integer
    value: 6000
  SMOKE_MIN_DURATION:
    description: "SMOKE=1: loadgen min_duration in ms."
    type: integer
    value: 120000
  SMOKE_MAX_CONCURRENCY:
    description: "SMOKE=1: max concurrent requests the harness sends to the server."
    type: integer
    value: 5120
  SMOKE_MAX_OUTPUT_LEN:
    description: "SMOKE=1: cap on generated tokens per request (overrides the gen config's max_output_len via llmlib/config.py). Lower = faster smoke run."
    type: integer
    value: 20000

  # --- Container image + Kubernetes backend (from k8s_env_sflow.yaml) ---
  CONTAINER_IMAGE:
    description: "Container image (NGC URL) with TRT-LLM + nv-mlpinf. Override via --set CONTAINER_IMAGE=..."
    value: "nvcr.io/nvidia/mlperf/mlperf-inference:tensorrt_llm_release-feat-1.2-mlpinf-b5ddff4_mlperf-main-f538816_jan28_x86"
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods (must hold the PVC below)"
    value: mlperf-sflow
  # A single pre-existing RWX PVC holds the model, the nv_mlpinf work bundle, and the
  # preprocessed dataset. It is mounted ONCE (read-write) at PVC_MOUNT; every path below
  # is just a real subpath inside it.
  MODEL_PVC_CLAIM:
    description: "PVC holding the model (MODEL_PATH), the nv_mlpinf work bundle (WORK_DIR), and preprocessed_data/"
    value: deepseek-r1-model-nfs
  PVC_MOUNT:
    description: "In-pod path where MODEL_PVC_CLAIM (the whole PVC) is mounted read-write, exactly once."
    value: /home/mlperf_inference_storage
  BUNDLE_SUBPATH:
    description: "Directory name of the nv_mlpinf work bundle within the PVC (relative to PVC_MOUNT)."
    value: nv_mlpinf_work_bundle
  WORK_DIR:
    description: "In-pod path to the nv_mlpinf work bundle (== the old /work). The harness cd's here and pip-installs it."
    value: ${{ variables.PVC_MOUNT }}/${{ variables.BUNDLE_SUBPATH }}
  GPUS_PER_NODE:
    type: integer
    value: 8
  SERVER_NODES:
    description: "Nodes the server spans: ceil(TOTAL_GPUS / GPUS_PER_NODE) -- 1 for this config"
    type: integer
    value: ${{ ((variables.TOTAL_GPUS / variables.GPUS_PER_NODE) | round(0, "ceil")) | int }}
  NUM_NODES:
    description: "SERVER_NODES + 1: the extra node hosts the 1-GPU harness (the server's 8 GPUs fill its own node)."
    type: integer
    value: ${{ variables.SERVER_NODES + 1 }}

artifacts:
  # Per-rank trtllm-serve engine config, inlined verbatim from
  # configs/.../TRTLLM/Offline/trtllm-serve-ifb-dep8.yaml. On k8s a file:// artifact
  # with inline content is injected into the pod from a ConfigMap and referenced via
  # ${{ artifacts.TRTLLM_YAML.path }} -- no /work path needed for the engine config.
  - name: TRTLLM_YAML
    uri: file://trtllm-serve-ifb-dep8.yaml
    content: |
      backend: pytorch
      tensor_parallel_size: ${{ variables.GPUS_PER_DP_RANK }}
      pipeline_parallel_size: 1
      moe_expert_parallel_size: ${{ variables.GPUS_PER_DP_RANK }}
      max_batch_size: 256
      max_num_tokens: 2048
      max_seq_len: 23140
      print_iter_log: true
      enable_iter_perf_stats: true
      return_perf_metrics: true
      enable_layerwise_nvtx_marker: false
      # Chunked prefill so a prompt longer than max_num_tokens (2048) is still prefilled in
      # chunks instead of being rejected -- required now that max_num_tokens is reduced to
      # shrink the activation + cross-node NCCL comm buffers.
      enable_chunked_prefill: true
      scheduler_config:
        capacity_scheduler_policy: MAX_UTILIZATION
        context_chunking_policy: FIRST_COME_FIRST_SERVED
      kv_cache_config:
        dtype: fp8
        free_gpu_memory_fraction: ${{ variables.KV_CACHE_FRACTION }}
        enable_block_reuse: false
      enable_attention_dp: true
      moe_config:
        backend: CUTEDSL
      cuda_graph_config:
        enable_padding: true
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
      cache_transceiver_config:
        backend: DEFAULT
      attention_dp_config:
        enable_balance: true
        batching_wait_iters: 10
        timeout_iters: 500

  # Node-local SSD copy of the model (staged on each GPU node under the ephemeral SSD by a
  # model-cache job). As an fs:// artifact NOT covered by a PVC, sflow hostPath-mounts this
  # path into the server pods at the SAME path. The controller can't stat a node-local path,
  # so the hostPath type is left empty (lenient) -- the pod still starts on a node without
  # the copy, and the server script falls back to the PVC model (MODEL_PATH) at runtime.
  # Loading ~340GB of weights from local NVMe is far faster than from the NFS PVC.
  - name: NODE_LOCAL_MODEL
    uri: fs:///mnt/stateful_partition/kube-ephemeral-ssd/model-cache/DeepSeek-R1-NVFP4-v2

operators:
  - name: test_container
    type: k8s
    image: ${{ variables.CONTAINER_IMAGE }}
    # 8-way NCCL over intra-node NVLink needs a large /dev/shm (k8s default is 64Mi).
    shm_size: 64Gi

backends:
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP, so the harness reaches the server at its node IP:BASE_PORT.
    host_network: true
    host_ipc: true
    # Request GPUs via the legacy nvidia.com/gpu device plugin; use 'dra' for DRA.
    scheduling: device_plugin
    # Cross-node TP/EP=16 has NO cross-node NVLink on a4-highgpu-8g, so the server's TP/EP
    # NCCL collectives must ride RDMA (RoCE/IB). auto runs the provider chain (GKE gIB here):
    # it mounts the gIB libs + sources set_nccl_env.sh (NCCL_NET=gIB, NCCL_CONF_FILE) on the
    # GPU pods and grants NIC access; the server script forwards that env to all MPI ranks.
    rdma: "auto"
    # The whole PVC mounted ONCE, read-write, at PVC_MOUNT. Model, work bundle, and
    # preprocessed_data are all real subpaths inside it (MODEL_PATH / WORK_DIR /
    # PREPROCESSED_DATA_DIR). A single read-write mount avoids the NFS "same export mounted
    # read-only twice -> whole superblock read-only" trap. A volume is mounted into a
    # task's pod only when the task references a path under its mount_path, so both the
    # server (MODEL_PATH) and the harness (WORK_DIR + scratch) get it.
    volumes:
      - name: pvc
        claim: ${{ variables.MODEL_PVC_CLAIM }}
        mount_path: ${{ variables.PVC_MOUNT }}
        read_only: false
    reservation:
      timeout: 1200

workflow:
  name: deepseek_r1_offline_ifb
  timeout: 115m
  tasks:
    - name: server
      replicas:
        count: ${{ variables.DP_MULTIPLICITY }}
        policy: parallel
      resources:
        # DP_MULTIPLICITY=1 server spanning GPUS_PER_DP_RANK GPUs (16 => 2 nodes, 8/node).
        # Left unpinned: the harness pins the LAST node (indices: [-1]), so the server takes
        # the first SERVER_NODES nodes (0,1) and its leader (task node_index 0 ==
        # SFLOW_TASK_ASSIGNED_NODE_IPS[0]) lands on reserved node 0 == nodes[0] (what the
        # harness targets). sflow splits the 16-GPU request into one 8-GPU pod per node.
        gpus:
          count: ${{ variables.GPUS_PER_DP_RANK }}
      operator: test_container
      script:
        - set -x
        # Env vars inlined from trtllm-serve-ifb-dep8-env.yaml (replaces run_with_env.py).
        # TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER is set per-branch below (MNNVL-only).
        - export TRTLLM_SERVER_DISABLE_GC=1
        - export OMPI_MCA_coll_ucc_enable=0
        - export TRTLLM_ENABLE_PDL=0
        - export TLLM_PROFILE_START_STOP=12000-12100
        # UCX device selection for TRT-LLM: pin UCX to the routable control iface so cross-node
        # UCX transport doesn't probe the wrong device (propagated to all ranks via -x below).
        - export TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}
        # Per-replica FlashInfer JIT workspace (pod-local /tmp).
        - export FLASHINFER_WORKSPACE_BASE=/tmp/flashinfer_${SFLOW_REPLICA_INDEX:-0}
        - mkdir -p "${FLASHINFER_WORKSPACE_BASE}"
        - export PORT=$(( ${{ variables.BASE_PORT }} + ${SFLOW_REPLICA_INDEX:-0} ))
        # How many nodes does THIS server replica span? node_index 0 == leader ==
        # SFLOW_TASK_ASSIGNED_NODE_IPS[0]. (SFLOW_TASK_NODE_INDEX is only set for multi-node
        # tasks, so default it to 0 for the single-node case.)
        - export SFLOW_TASK_NODE_INDEX=${SFLOW_TASK_NODE_INDEX:-0}
        - export SERVER_NODE_IPS=${SFLOW_TASK_ASSIGNED_NODE_IPS:-127.0.0.1}
        - export N_SRV_NODES=$(echo "${SERVER_NODE_IPS}" | tr ',' '\n' | grep -c '[^[:space:]]')
        - echo "[server] replica=${SFLOW_REPLICA_INDEX:-0} node_index=${SFLOW_TASK_NODE_INDEX} n_nodes=${N_SRV_NODES} ips=${SERVER_NODE_IPS} port=${PORT}"
        - |
          # Prefer the node-local SSD copy of the model over the NFS PVC (fast weight load).
          # Referencing the fs:// NODE_LOCAL_MODEL artifact path makes sflow hostPath-mount the
          # node-local model dir into this pod (lenient empty hostPath type). Fall back to the
          # PVC model (MODEL_PATH) when the node-local copy is not staged on the node. All
          # server pods run this same script text, so every pod gets the mount; the leader's
          # chosen path is passed to trtllm-serve as an argv, so all MPI ranks load the same.
          NODE_LOCAL_MODEL="${{ artifacts.NODE_LOCAL_MODEL.path }}"
          if [ -f "${NODE_LOCAL_MODEL}/config.json" ]; then
            SERVE_MODEL="${NODE_LOCAL_MODEL}"; echo "[server] model source: node-local SSD (${SERVE_MODEL})"
          else
            SERVE_MODEL="${{ variables.MODEL_PATH }}"; echo "[server] model source: PVC (${SERVE_MODEL}); node-local copy absent"
          fi
        - |
          # ===================== SINGLE-NODE (TP/EP within one 8-GPU pod) =============
          # trtllm-serve spawns its own local TP/EP workers across the pod's GPUs (NVLink/
          # P2P). The MoE alltoall-without-allgather kernel is an MNNVL(NVLink)-only path,
          # valid only when the whole TP/EP world is on one NVLink island.
          if [ "${N_SRV_NODES:-1}" -le 1 ]; then
            export TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER=1
            NSYS_CMD=""
            if [ "${{ variables.COLLECT_NSYS }}" = "1" ]; then
              NSYS_CMD="/usr/local/bin/nsys profile --force-overwrite=true -t cuda,nvtx,python-gil -c cudaProfilerApi --cuda-graph-trace=node --capture-range-end=stop --gpu-metrics-devices=all --wait=all --output ${SFLOW_TASK_OUTPUT_DIR}/nsys_profile-dp${SFLOW_REPLICA_INDEX:-0}"
            fi
            exec ${NSYS_CMD} trtllm-serve "${SERVE_MODEL}" --host 0.0.0.0 --port ${PORT} --extra_llm_api_options ${{ artifacts.TRTLLM_YAML.path }}
          fi
        - |
          # ===================== MULTI-NODE (one MPI world across the pods) ===========
          # trtllm-serve's LLM API is MPI-based, so a cross-node instance needs ONE MPI world
          # over every pod (the k8s analogue of SLURM's `srun --mpi=pmix trtllm-llmapi-launch`).
          # The leader (node_index 0) drives `mpirun` over SSH into the workers, which just run
          # sshd and wait; cross-node TP/EP NCCL rides RDMA (backend rdma: auto -> GKE gIB).
          # The MNNVL-only MoE alltoall kernel is invalid across an RDMA hop -> disable it.
          
          export TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER=0
          
          # NCCL log level (propagated to all ranks via -x below); INFO surfaces cross-node
          # RDMA/gIB collective failures (the MoE allgather 'unhandled cuda error').
          
          export NCCL_DEBUG=${{ variables.NCCL_DEBUG }}
          
          # NCCL 2.28's cuMem HOST allocations need NUMA support that containers often disable,
          # and can fail cross-node collectives; force the /dev/shm fallback.
          
          export NCCL_CUMEM_HOST_ENABLE=0
          
          # These a4-highgpu-8g nodes have NO cross-node NVLink domain (sflow detects NVLink
          # scope 'off'), so NVLS (NVLink SHARP multicast) cannot span the 16-GPU world: NCCL
          # tries it and aborts with 'nvls.cc Cuda failure out of memory' -> the MoE allgather's
          # 'unhandled cuda error'. Disable NVLS so NCCL uses ring/tree over intra-node NVLink + IB.
          
          export NCCL_NVLS_ENABLE=0
          
          SSH_PORT=2222
          
          # The image ships ssh/mpirun/orted + gIB but NOT sshd; install it (the apt cache is
          # empty in the image, so refresh it first). Both pods run sshd (mpirun may ssh to the
          # leader's own node IP for its local orted under hostNetwork).
          
          if [ ! -x /usr/sbin/sshd ] && ! command -v sshd >/dev/null 2>&1; then
            echo "[mpi] installing openssh-server"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-server
          fi
          SSHD_BIN="$( [ -x /usr/sbin/sshd ] && echo /usr/sbin/sshd || command -v sshd || true )"
          if [ -z "${SSHD_BIN}" ]; then echo "[mpi] FATAL: sshd unavailable after install"; exit 1; fi
          mkdir -p /run/sshd /root/.ssh && chmod 700 /root/.ssh
          ssh-keygen -A >/dev/null 2>&1 || true
          
          # Per-run RSA keypair shared through the PVC (both pods mount it rw). The leader
          # creates it; every pod installs it (private key to ssh out, pubkey to accept in).
          
          RUN_TAG="$(basename "${SFLOW_WORKFLOW_OUTPUT_DIR:-$(dirname "${SFLOW_TASK_OUTPUT_DIR}")}")"
          KEY_DIR=${{ variables.PVC_MOUNT }}/.mpi_ssh/${RUN_TAG:-default}
          if [ "${SFLOW_TASK_NODE_INDEX}" = "0" ] && [ ! -f "${KEY_DIR}/id_rsa" ]; then
            mkdir -p "${KEY_DIR}"
            ssh-keygen -t rsa -b 2048 -N "" -f /tmp/mpi_id_rsa >/dev/null
            cp /tmp/mpi_id_rsa.pub "${KEY_DIR}/id_rsa.pub"
            cp /tmp/mpi_id_rsa "${KEY_DIR}/.id_rsa.tmp" && mv "${KEY_DIR}/.id_rsa.tmp" "${KEY_DIR}/id_rsa"
          fi
          echo "[mpi] node ${SFLOW_TASK_NODE_INDEX}: waiting for shared keypair at ${KEY_DIR}"
          for _ in $(seq 1 180); do
            if [ -f "${KEY_DIR}/id_rsa" ] && [ -f "${KEY_DIR}/id_rsa.pub" ]; then break; fi
            sleep 1
          done
          if [ ! -f "${KEY_DIR}/id_rsa" ]; then echo "[mpi] FATAL: no keypair at ${KEY_DIR}"; exit 1; fi
          install -m 600 "${KEY_DIR}/id_rsa" /root/.ssh/id_rsa
          install -m 600 "${KEY_DIR}/id_rsa.pub" /root/.ssh/authorized_keys
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' > /root/.ssh/config && chmod 600 /root/.ssh/config
          # sshd on an alt port (hostNetwork shares the node's :22 with the node's own sshd).
          "${SSHD_BIN}" -p ${SSH_PORT} && echo "[mpi] sshd up on :${SSH_PORT}"
          if [ "${SFLOW_TASK_NODE_INDEX}" != "0" ]; then
            echo "[mpi] worker node ${SFLOW_TASK_NODE_INDEX}: idle until the leader's mpirun launches orted here / tears it down"
            sleep infinity
          fi
          # ---- leader: build the hostfile (leader first, per SFLOW_TASK_ASSIGNED_NODE_IPS
          #      order), wait until every peer accepts key-auth SSH, then launch ONE MPI world.
          HOSTFILE=/tmp/mpi_hostfile
          echo "${SERVER_NODE_IPS}" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | awk -v s=${{ variables.GPUS_PER_NODE }} '{print $1" slots="s}' > "${HOSTFILE}"
          echo "[mpi] hostfile:"; cat "${HOSTFILE}"
          SSH_OPTS="-p ${SSH_PORT} -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes"
          for ip in $(echo "${SERVER_NODE_IPS}" | tr ',' ' '); do
            echo "[mpi] waiting for sshd on ${ip}:${SSH_PORT}"
            for _ in $(seq 1 240); do
              if ssh ${SSH_OPTS} "${ip}" true 2>/dev/null; then echo "[mpi] ${ip} ssh ok"; break; fi
              sleep 2
            done
          done
          # Forward the workload + gIB/NCCL/UCX RDMA env to ALL ranks: sshd gives remote ranks
          # a bare env, so the gIB NCCL_NET/NCCL_CONF_FILE etc. (auto-loaded gIB plugins ABORT
          # NCCL init when unset) plus PATH/LD_LIBRARY_PATH must be propagated via mpirun -x.
          XENV="-x PATH -x LD_LIBRARY_PATH"
          for v in $(env | grep -oE '^(NCCL_|UCX_|GLOO_|NVSHMEM_|OMPI_MCA_|TRTLLM_|TLLM_|FLASHINFER_)[A-Za-z0-9_]+' | sort -u); do
            XENV="${XENV} -x ${v}"
          done
          echo "[mpi] launching one ${{ variables.GPUS_PER_DP_RANK }}-rank MPI world (8/pod); forwarding: ${XENV}"
          exec mpirun -np ${{ variables.GPUS_PER_DP_RANK }} \
            --allow-run-as-root --prefix /usr/local/mpi \
            --hostfile "${HOSTFILE}" \
            --mca plm_rsh_agent ssh \
            --mca plm_rsh_args "-p ${SSH_PORT} -i /root/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ${XENV} \
            trtllm-llmapi-launch trtllm-serve "${SERVE_MODEL}" \
            --host 0.0.0.0 --port ${PORT} \
            --extra_llm_api_options ${{ artifacts.TRTLLM_YAML.path }}
      probes:
        readiness:
          log_watch:
            regex_pattern: "Application startup complete"
          timeout: 1800
          interval: 5
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: mlperf_harness
      operator: test_container
      resources:
        # The harness runs on its OWN node (reserved index 1) with ONE GPU: the server fills
        # node 0's 8 GPUs, and nv_mlpinf (+ its mp-spawned HTTP workers) need a real GPU for
        # the CUDA runtime they import (GPU-less pods fail to dlopen libcuda.so.1).
        nodes:
          indices: [-1]
        gpus:
          count: 1
      script:
        - set -x
        - export PYTHONUNBUFFERED=1
        # All nv_mlpinf INPUT paths live under the single PVC mount:
        - export MLPERF_SCRATCH_PATH=${{ variables.PVC_MOUNT }}
        # preprocessed tensors: ${PREPROCESSED_DATA_DIR}/deepseek-r1/{input_ids_padded,input_lens}.npy
        - export PREPROCESSED_DATA_DIR=${{ variables.PREPROCESSED_DATA_DIR }}
        # configs load from PROJECT_BASE_DIR/configs, and the MLCommons submission_checker
        # from MLCOMMONS_INF_REPO -- both are inside the work bundle on the PVC.
        - export PROJECT_BASE_DIR=${{ variables.WORK_DIR }}
        - export MLCOMMONS_INF_REPO=${{ variables.WORK_DIR }}/3rdparty/mlc-inference
        # Silence nv_mlpinf's path validation with real locations: model checkpoints live
        # at the PVC root, the dataset (preprocessed_data/) is under it too, and TRT-LLM
        # ships in the container at /app/tensorrt_llm (default /work/3rdparty/trtllm absent).
        - export MODEL_DIR=${{ variables.PVC_MOUNT }}
        - export DATA_DIR=${{ variables.PVC_MOUNT }}
        - export TRTLLM_DIR=${{ variables.TRTLLM_DIR }}
        # The harness loads its tokenizer from the deepseek-r1 checkpoint (its model_path);
        # point that at the real on-PVC model dir (has tokenizer.json) so it isn't the
        # non-existent MODEL_DIR/deepseek-r1/fp4-quantized-modelopt/... default.
        - export DEEPSEEK_R1_CHECKPOINT_PATH=${{ variables.MODEL_PATH }}
        # Fast smoke test (SMOKE=1): harness.py reads these to shrink the query count +
        # output length so a run finishes in minutes (NOT a valid MLPerf result).
        - export MLPERF_SMOKE=${{ variables.SMOKE }}
        - export SMOKE_QUERY_COUNT=${{ variables.SMOKE_QUERY_COUNT }}
        - export SMOKE_MIN_DURATION=${{ variables.SMOKE_MIN_DURATION }}
        - export SMOKE_MAX_CONCURRENCY=${{ variables.SMOKE_MAX_CONCURRENCY }}
        - export SMOKE_MAX_OUTPUT_LEN=${{ variables.SMOKE_MAX_OUTPUT_LEN }}
        # Transient build scratch (nvmitten ScratchSpace + loadgen configs/logs) -> pod-local.
        - export BUILD_DIR=${{ variables.HARNESS_BUILD_DIR }}
        - cd ${{ variables.WORK_DIR }}
        - pip install -e ".[llm]" -q --no-build-isolation
        # The harness runs on the LAST reserved node; the DP_MULTIPLICITY servers occupy
        # every node before it. With DP_MULTIPLICITY>1 the replicas spread across those
        # nodes (distinct node IPs), so a single HOST_IP + port shift is WRONG -- the IP
        # must shift per replica too. Build the server node IP list from the allocation
        # EXCLUDING the harness node (nodes[:-1]), then map each replica to its node:
        # replica i lives on server node i/REPLICAS_PER_NODE (REPLICAS_PER_NODE =
        # GPUS_PER_NODE/GPUS_PER_DP_RANK) and listens on BASE_PORT+i (host_network ->
        # pod IP == node IP).
        - >
          SERVER_NODE_IPS=(${{ backends.k8s_cluster.nodes[:-1] | map(attribute='ip_address') | join(' ') }});
          REPLICAS_PER_NODE=$(( ${{ variables.GPUS_PER_NODE }} / ${{ variables.GPUS_PER_DP_RANK }} ));
          [ "${REPLICAS_PER_NODE}" -ge 1 ] || REPLICAS_PER_NODE=1;
          SERVER_URLS=$(for i in $(seq 0 $(( ${{ variables.DP_MULTIPLICITY }} - 1 ))); do
          echo "${SERVER_NODE_IPS[$(( i / REPLICAS_PER_NODE ))]}:$(( ${{ variables.BASE_PORT }} + i ))";
          done | paste -sd,)
        - echo "Server URLs ${SERVER_URLS}"
        - |
          set +e
          set -o pipefail
          # Persist the console log + loadgen result files on the PVC so they outlive the
          # pod. Use a per-run subdir named after the sflow run (the parent dir of
          # SFLOW_TASK_OUTPUT_DIR) so runs don't clobber each other; fall back to a UTC
          # timestamp if that env isn't set. LOG_DIR is honored by nv_mlpinf (its `log_dir`
          # field reads the LOG_DIR env), so loadgen writes mlperf_log_*.txt there.
          RUN_TAG="$(basename "$(dirname "${SFLOW_TASK_OUTPUT_DIR}")")"
          case "${RUN_TAG}" in ""|"."|"/") RUN_TAG="run-$(date -u +%Y%m%d-%H%M%S)";; esac
          OUT_DIR=${{ variables.PVC_RESULTS_DIR }}/${RUN_TAG}
          HARNESS_LOG=${OUT_DIR}/${{ variables.TEST_MODE }}.log
          LOG_DIR=${OUT_DIR}/${{ variables.TEST_MODE }}
          mkdir -p "${LOG_DIR}"
          echo "Harness log + loadgen results -> ${OUT_DIR} (on PVC ${{ variables.MODEL_PVC_CLAIM }})"
          LOG_DIR=${LOG_DIR} \
            nv-mlpinf run_harness \
              --benchmarks=${{ variables.BENCHMARK }} \
              --scenarios=${{ variables.SCENARIO }} \
              --system_name=${{ variables.SYSTEM_NAME }} \
              --trtllm_server_urls=${SERVER_URLS} \
              --test_mode=${{ variables.TEST_MODE }} \
              ${{ variables.HARNESS_EXTRA_ARGS }} 2>&1 | tee "${HARNESS_LOG}"
          HARNESS_EXIT=$?
          echo "=== mlperf_harness run_harness exited with ${HARNESS_EXIT}; results on PVC at ${OUT_DIR} ==="
          exit 0
      depends_on:
        - server
