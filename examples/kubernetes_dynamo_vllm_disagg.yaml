version: "0.1"

# Kubernetes port of examples/slurm_dynamo_vllm_disagg.yaml.
#
# Native Kubernetes recipe: a `kubernetes` backend (scheduling: device_plugin)
# reserves and discovers nodes, then each task runs as its own scheduler-placed
# pod whose GPUs come from the legacy nvidia.com/gpu device plugin. The operators
# are `type: k8s` and carry the workload images (DYNAMO_IMAGE / AIPERF_IMAGE).
#
# Cluster assumptions: NVIDIA gpu-operator (nvidia.com/gpu device plugin). The
# backend reserves real nodes with placeholder pods that hold the node GPUs,
# discovers their node names + InternalIPs, pins each task pod via nodeSelector,
# and hands the GPUs to the GPU tasks via the create-before-destroy handoff.
# CPU-only infra (etcd/nats/frontend) overlaps on node 0 without consuming GPUs.
# Set `scheduling: dra` to use DRA (nvidia-dra-driver-gpu, Kubernetes 1.34+,
# resource.k8s.io/v1, DeviceClass gpu.nvidia.com) instead of the device plugin.
#
# vLLM-specific notes (these are what differ from the trtllm port):
#   * Disaggregation moves the KV cache over NIXL. With host_network: true, pods
#     co-located on a node share the host's network namespace, so each worker
#     needs a unique VLLM_NIXL_SIDE_CHANNEL_PORT. The Slurm trick of offsetting
#     the port by the first CUDA_VISIBLE_DEVICES index does NOT work here: every
#     pod gets its own exclusive GPUs (device plugin / DRA) and sees them as
#     0,1,..., so that index is always 0. Instead each worker derives the port
#     from SFLOW_REPLICA_INDEX, and prefill/decode use different bases so a
#     prefill and a decode replica packed onto the same node never collide.
#   * Multi-node workers (GPUS_PER_WORKER > GPUS_PER_NODE) use a Ray cluster.
#     resources.gpus.count auto-expands the task to one pod per node; the leader
#     pod (SFLOW_TASK_NODE_INDEX == 0) runs `ray start --head` and launches vLLM,
#     the other pods join Ray at SFLOW_TASK_ASSIGNED_NODE_IPS[0] and idle.
#     SFLOW_TASK_NODE_INDEX is the portable replacement for SLURM_NODEID.

variables:
  # --- Kubernetes backend configuration ---
  K8S_NAMESPACE:
    description: "Kubernetes namespace for all pods"
    # Runs in mlperf-sflow so pods can mount the deepseek-r1-model-lustre PVC
    # (PVCs are namespace-scoped; the model lives on that Lustre volume).
    value: mlperf-sflow
  GPUS_PER_NODE:
    description: "GPUs per node"
    type: integer
    value: 8
  NUM_NODES:
    description: "Number of nodes"
    value: 3

  # Model Configuration
  SERVED_MODEL_NAME:
    description: "Served model name"
    value: Qwen3-0-6B-FP8
  MODEL_NAME:
    description: "Model path"
    value: Qwen/Qwen3-0.6B-FP8

  # Prefill Server Configuration
  NUM_CTX_SERVERS:
    description: "Number of context/prefill servers"
    type: integer
    value: 4
  CTX_TP_SIZE:
    description: "Context tensor parallel size"
    type: integer
    value: 2
  CTX_DP_SIZE:
    description: "Context data parallel size"
    type: integer
    value: 1
  CTX_EP_SIZE:
    description: "Context expert parallel size"
    type: integer
    value: 1
  CTX_MOE_TP_SIZE:
    description: "Context MOE tensor parallel size"
    type: integer
    value: 1
  CTX_PP_SIZE:
    description: "Context pipeline parallel size"
    type: integer
    value: 1
  CTX_GPUS_PER_WORKER:
    description: "GPUs per prefill worker"
    type: integer
    value: ${{ variables.CTX_TP_SIZE * variables.CTX_DP_SIZE * variables.CTX_PP_SIZE }}
  CTX_NODES_PER_WORKER:
    description: "Nodes per prefill worker"
    type: integer
    value: ${{ [variables.CTX_GPUS_PER_WORKER // variables.GPUS_PER_NODE, 1] | max }}
  CTX_BATCH_SIZE:
    description: "Context batch size"
    type: integer
    value: 128
  CTX_MAX_NUM_TOKENS:
    description: "Context max number of tokens"
    type: integer
    value: 4096
  CTX_MAX_SEQ_LEN:
    description: "Context max sequence length"
    type: integer
    value: 1280
  CTX_FREE_GPU_MEMORY_FRACTION:
    description: "Context free GPU memory fraction"
    value: 0.9
  CTX_ENABLE_ATTENTION_DP:
    description: "Context enable attention DP"
    value: ""
  KV_CACHE_DTYPE:
    description: "KV cache dtype"
    value: fp8

  # Decode Server Configuration
  NUM_GEN_SERVERS:
    description: "Number of generation/decode servers"
    type: integer
    value: 4
  GEN_TP_SIZE:
    description: "Generation tensor parallel size"
    type: integer
    value: 4
  GEN_DP_SIZE:
    description: "Generation data parallel size"
    type: integer
    value: 1
  GEN_EP_SIZE:
    description: "Generation expert parallel size"
    type: integer
    value: 1
  GEN_MOE_TP_SIZE:
    description: "Generation MOE tensor parallel size"
    type: integer
    value: 1
  GEN_PP_SIZE:
    description: "Generation pipeline parallel size"
    type: integer
    value: 1
  GEN_GPUS_PER_WORKER:
    description: "GPUs per decode worker"
    type: integer
    value: ${{ variables.GEN_TP_SIZE * variables.GEN_DP_SIZE * variables.GEN_PP_SIZE }}
  GEN_NODES_PER_WORKER:
    description: "Nodes per decode worker"
    type: integer
    value: ${{ [variables.GEN_GPUS_PER_WORKER // variables.GPUS_PER_NODE, 1] | max }}
  GEN_BATCH_SIZE:
    description: "Generation batch size"
    type: integer
    value: 128
  GEN_MAX_NUM_TOKENS:
    description: "Generation max number of tokens"
    type: integer
    value: 4096
  GEN_MAX_SEQ_LEN:
    description: "Generation max sequence length"
    type: integer
    value: 2304
  GEN_FREE_GPU_MEMORY_FRACTION:
    description: "Generation free GPU memory fraction"
    value: 0.9
  GEN_ENABLE_ATTENTION_DP:
    description: "Generation enable attention DP"
    value: ""

  # Extra Arguments - You can append any optional arguments to the dynamo.vllm command
  EXTRA_FRONTEND_ARGS:
    description: "Extra frontend arguments"
    value: ""
  EXTRA_PREFILL_ARGS:
    description: "Extra prefill arguments"
    value: ""
  EXTRA_DECODE_ARGS:
    description: "Extra decode arguments"
    value: ""
  DYN_REQUEST_PLANE:
    description: "Dynamo request plane"
    value: "nats"

  # Benchmark Configuration
  ISL:
    description: "Input sequence length"
    value: 1024
  OSL:
    description: "Output sequence length"
    value: 1024
  MULTI_ROUND:
    description: "Number of benchmark rounds"
    value: 8
  CONCURRENCY:
    description: "Concurrency"
    value: 512
    domain: [512]

  # Container Images
  AIPERF_IMAGE:
    description: "AIPerf container image"
    value: python:3.12-slim
  DYNAMO_IMAGE:
    description: "Dynamo vLLM container image"
    value: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.0

artifacts:
  # On Kubernetes, artifacts are injected into the task pods the native way (not via
  # the controller's filesystem), accessible as `${{ artifacts.NAME.path }}`:
  #   * file:// + inline `content` -> mounted into the pod from a ConfigMap.
  #   * fs:// -> made visible inside the pod, two ways:
  #       1. PVC-backed (recommended for models/large data): declare a PVC under the
  #          backend's `volumes:` and point the fs:// path at a location under its
  #          `mount_path` (see the `volumes:` on the k8s_cluster backend).
  #       2. hostPath: if no PVC covers the path, fs:// is hostPath-mounted at the
  #          same path, so it must be NODE-accessible (e.g. an NFS/shared filesystem
  #          mounted on every node). A missing node path fails the pod loudly.
  #
  # vLLM passes everything on the command line, so unlike the trtllm port there are
  # no PREFILL_CONFIG / DECODE_CONFIG engine-config artifacts -- only the model.
  - name: LOCAL_MODEL_PATH
    # Lives inside the `model-store` PVC (mounted at /models); see backend volumes.
    # Point this at wherever the model is staged inside the PVC.
    uri: fs:///models/Qwen3-0.6B-FP8

backends:
  # A kubernetes backend with device-plugin scheduling. No `image` field --
  # workload images come from the operators (DYNAMO_IMAGE / AIPERF_IMAGE) below.
  - name: k8s_cluster
    type: kubernetes
    default: true
    namespace: ${{ variables.K8S_NAMESPACE }}
    nodes: ${{ variables.NUM_NODES }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    # pod IP == node IP, so peers can be addressed by the node InternalIPs that
    # reservation returns (etcd/NATS registration mirrors the Slurm path). It also
    # lets vLLM advertise a reachable NIXL side-channel host for KV transfer.
    host_network: true
    # Request GPUs via the legacy nvidia.com/gpu device plugin; use 'dra' for
    # DRA (nvidia-dra-driver-gpu, DeviceClass gpu.nvidia.com).
    scheduling: device_plugin
    # RDMA fast path (default 'auto'): on GKE multi-NIC RDMA nodes, task GPU pods
    # get scoped RDMA device access -- a per-pod slice of the node's
    # networking.gke.io.networks/rdma-N NICs (sized to the pod's GPU count) plus
    # CAP_IPC_LOCK -- and a matching UCX_NET_DEVICES/NCCL_IB_HCA, so the
    # disaggregated KV transfer (NIXL/UCX) and NCCL run over RoCE instead of TCP.
    # Use 'off' to disable, or a list (e.g. [mlx5_0:1, mlx5_1:1]) to force devices.
    rdma: auto
    # Pre-existing PersistentVolumeClaims to mount into task pods. Use this to make
    # cluster-resident data (e.g. a model staged on shared storage) available to
    # pods without a node-local hostPath. The PVC + its data must already exist in
    # the namespace; sflow only references it. A PVC is mounted into a task's pod(s)
    # only when the task references a path under its mount_path (so e.g. the model
    # is not mounted into the etcd/nats pods). Use read_only + an ROX/RWX PVC to
    # share one model across prefill/decode pods on multiple nodes.
    #
    # `deepseek-r1-model-lustre` is a dedicated RWX Lustre PVC (in the mlperf-sflow
    # namespace); stage the Qwen model under it and point LOCAL_MODEL_PATH at it.
    volumes:
      - name: model-store
        claim: deepseek-r1-model-lustre
        mount_path: /models
        read_only: true
    reservation:
      timeout: 1200

operators:
  # Native kubernetes operators carry the workload image. A single-node task
  # becomes one pod; a multi-node task becomes one pod per node.
  - name: dynamo_vllm
    type: k8s
    image: ${{ variables.DYNAMO_IMAGE }}
  - name: aiperf
    type: k8s
    image: ${{ variables.AIPERF_IMAGE }}

workflow:
  name: dynamo_vllm_disagg
  timeout: 115m

  variables:
    # Workflow level variables will overwrite the variables defined in global variables section if using same name
    HEAD_NODE_IP:
      description: "Head node IP (resolved after allocation)"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}"
    ETCD_ENDPOINTS:
      description: "ETCD endpoints"
      value: "${{ backends.k8s_cluster.nodes[0].ip_address }}:2379"
    NATS_SERVER:
      description: "NATS server URL"
      value: "nats://${{ backends.k8s_cluster.nodes[0].ip_address }}:4222"

  tasks:
    - name: nats_server
      operator: dynamo_vllm
      script:
        - nats-server -js
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 4222
          interval: 2

    - name: etcd_server
      operator: dynamo_vllm
      script:
        - >
          etcd --listen-client-urls "http://0.0.0.0:2379"
          --advertise-client-urls "http://0.0.0.0:2379"
          --listen-peer-urls "http://0.0.0.0:2380"
          --initial-advertise-peer-urls "http://${HEAD_NODE_IP}:2380"
          --initial-cluster "default=http://${HEAD_NODE_IP}:2380"
          --data-dir /tmp/etcd
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 2379
          interval: 2

    - name: frontend_server
      operator: dynamo_vllm
      script:
        - python3 -m dynamo.frontend --http-port 8000 ${{ variables.EXTRA_FRONTEND_ARGS }}
      resources:
        nodes:
          indices: [0]
      probes:
        readiness:
          tcp_port:
            port: 8000
          timeout: 300
          interval: 5
      depends_on:
        - nats_server
        - etcd_server

    - name: prefill_server
      operator: dynamo_vllm
      replicas:
        count: ${{ variables.NUM_CTX_SERVERS }}
        policy: "parallel"
      script:
        - set -x
        - echo ${CUDA_VISIBLE_DEVICES}
        # Unique NIXL side-channel port per replica (host_network shares node
        # ports). Prefill uses base 5557; decode uses 6557 so a prefill and a
        # decode replica packed onto the same node never collide. The stride is
        # GPUS_PER_NODE so a worker's per-rank ports stay within its own slot.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=$((5557 + ${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_NODE }}))
        # SFLOW_TASK_NODE_INDEX is the portable SLURM_NODEID (0 on the leader pod,
        # 1..N-1 on the worker pods); unset for single-node workers -> default 0.
        - export NODE_RANK=${SFLOW_TASK_NODE_INDEX:-0}
        - export FIRST_NODE_IP=$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1)
        - >
          if [ "${CTX_NODES_PER_WORKER}" -gt 1 ]; then
            if [[ "${NODE_RANK}" == "0" ]]; then
              unset CUDA_VISIBLE_DEVICES
              ray start --head --port=6379
            else
              export RAY_worker_register_timeout_seconds=1200 # This to avoid master node load image slower than worker node
              ray start --address ${FIRST_NODE_IP}:6379
            fi
            # wait until GPU string appears in ray status output
            while true; do
              if ray status | grep "${CTX_GPUS_PER_WORKER}.0 GPU"; then
                break
              else
                echo "Waiting for Ray cluster GPUs to be available in ray status..."
                sleep 5
              fi
            done
            echo "Ray cluster GPUs are now available."
          else
            echo "Do not need to setup ray cluster because worker only needs ${CTX_GPUS_PER_WORKER} GPUs, and GPUS_PER_NODE is ${{ variables.GPUS_PER_NODE }}"
          fi
        - >
          if [[ "${NODE_RANK}" == "0" ]]; then
            EXTRA_RAY_ARGS=""
            if [ "${CTX_NODES_PER_WORKER}" -gt 1 ]; then
              EXTRA_RAY_ARGS="--distributed-executor-backend ray"
            fi
            python3 -m dynamo.vllm --model ${{ artifacts.LOCAL_MODEL_PATH.path }} \
            --served-model-name ${{ variables.SERVED_MODEL_NAME }} \
            --tensor-parallel-size ${CTX_TP_SIZE} \
            --pipeline-parallel-size ${CTX_PP_SIZE} \
            --data-parallel-size ${CTX_DP_SIZE} \
            --kv-cache-dtype ${{ variables.KV_CACHE_DTYPE }} \
            --is-prefill-worker \
            --no-enable-prefix-caching \
            --block-size 128 \
            --max-num-seqs ${CTX_BATCH_SIZE} \
            --max-num-batched-tokens ${CTX_MAX_NUM_TOKENS} ${EXTRA_RAY_ARGS} ${EXTRA_PREFILL_ARGS}
          else
            echo "This is a worker node, do not need to run vllm launch cmd, but remember to setup ray cluster and launch in the master node"
            sleep 3600
          fi
      resources:
        gpus:
          count: ${{ variables.CTX_GPUS_PER_WORKER }}
      depends_on:
        - frontend_server
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: decode_server
      operator: dynamo_vllm
      replicas:
        count: ${{ variables.NUM_GEN_SERVERS }}
        policy: "parallel"
      script:
        - set -x
        - echo ${CUDA_VISIBLE_DEVICES}
        # Decode uses base 6557 (prefill uses 5557) so co-located prefill/decode
        # replicas under host_network never share a NIXL side-channel port.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=$((6557 + ${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_NODE }}))
        - export NODE_RANK=${SFLOW_TASK_NODE_INDEX:-0}
        - export FIRST_NODE_IP=$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1)
        - >
          if [ "${GEN_NODES_PER_WORKER}" -gt 1 ]; then
            if [[ "${NODE_RANK}" == "0" ]]; then
              unset CUDA_VISIBLE_DEVICES
              ray start --head --port=6379
            else
              export RAY_worker_register_timeout_seconds=1200 # This to avoid master node load image slower than worker node
              ray start --address ${FIRST_NODE_IP}:6379
            fi
            # wait until GPU string appears in ray status output
            while true; do
              if ray status | grep "${GEN_GPUS_PER_WORKER}.0 GPU"; then
                break
              else
                echo "Waiting for Ray cluster GPUs to be available in ray status..."
                sleep 5
              fi
            done
            echo "Ray cluster GPUs are now available."
          else
            echo "Do not need to setup ray cluster because worker only needs ${GEN_GPUS_PER_WORKER} GPUs, and GPUS_PER_NODE is ${{ variables.GPUS_PER_NODE }}"
          fi
        - >
          if [[ "${NODE_RANK}" == "0" ]]; then
            EXTRA_RAY_ARGS=""
            if [ "${GEN_NODES_PER_WORKER}" -gt 1 ]; then
              EXTRA_RAY_ARGS="--distributed-executor-backend ray"
            fi
            python3 -m dynamo.vllm --model ${{ artifacts.LOCAL_MODEL_PATH.path }} \
            --served-model-name ${{ variables.SERVED_MODEL_NAME }} \
            --tensor-parallel-size ${GEN_TP_SIZE} \
            --pipeline-parallel-size ${GEN_PP_SIZE} \
            --data-parallel-size ${GEN_DP_SIZE} \
            --kv-cache-dtype ${{ variables.KV_CACHE_DTYPE }} \
            --no-enable-prefix-caching \
            --block-size 128 \
            --max-num-seqs ${GEN_BATCH_SIZE} \
            --max-num-batched-tokens ${GEN_MAX_NUM_TOKENS} ${EXTRA_RAY_ARGS} ${EXTRA_DECODE_ARGS}
          else
            echo "This is a worker node, do not need to run vllm launch cmd, but remember to setup ray cluster and launch in the master node"
            sleep 3600
          fi
      resources:
        gpus:
          count: ${{ variables.GEN_GPUS_PER_WORKER }}
      depends_on:
        - frontend_server
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.k8s_cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          each_check_timeout: 20
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: benchmark
      operator: aiperf
      script:
        - pip install aiperf==0.3.0
        - set -x
        - export COLUMNS=200
        - >
          aiperf profile --artifact-dir ${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${CONCURRENCY}
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ artifacts.LOCAL_MODEL_PATH.path }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ variables.HEAD_NODE_IP }}:8000
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "max_tokens:${{ variables.OSL }}"
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --extra-inputs "{\"nvext\":{\"ignore_eos\":true}}"
          --extra-inputs "repetition_penalty:1.0"
          --extra-inputs "temperature: 0.0"
          --concurrency ${CONCURRENCY}
          --request-count $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --warmup-request-count ${CONCURRENCY}
          --num-dataset-entries $((${{ variables.MULTI_ROUND }}*${CONCURRENCY}))
          --random-seed 100
          -H 'Authorization: Bearer NOT USED'
          -H 'Accept: text/event-stream'
          --record-processors 8
          --ui simple
        - echo "Benchmarking finished"
      resources:
        nodes:
          indices: [0]
      replicas:
        variables:
          - CONCURRENCY
        policy: sequential
      # Trigger a hardware monitor from this benchmark task but sample the
      # prefill/decode SERVERS' resources (used_by_tasks), not the benchmark
      # client's own node -- so the report captures the servers' GPU/CPU usage
      # over the benchmark window.
      monitor:
        resources:
          used_by_tasks:
            - prefill_server
            - decode_server
        report:
          enabled: true
      depends_on:
        - prefill_server
        - decode_server
        - frontend_server
