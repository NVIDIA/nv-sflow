# Shared benchmark hub for the modular samples.
#
# This task is intentionally dependency-free: each workload's `server` task
# points at it with `required_by: [benchmark]`, which sflow folds into this
# task's `depends_on`. Compose it last. If you compose a workload WITHOUT this
# file, the servers' `required_by: [benchmark]` simply resolves to nothing (no
# --missable-tasks needed).

version: "0.1"

variables:
  CLIENT_IMAGE:
    description: "Benchmark client image (AIPerf runs here)"
    value: python:3.12-slim
  ISL:
    description: "Input sequence length"
    type: integer
    value: 1024
  OSL:
    description: "Output sequence length"
    type: integer
    value: 1024
  CONCURRENCY:
    description: "Concurrent request count"
    type: integer
    value: 64
  MULTI_ROUND:
    description: "Number of benchmark rounds; request count is MULTI_ROUND * CONCURRENCY"
    type: integer
    value: 8
  TOKENIZER:
    description: "Tokenizer for aiperf: a local model dir OR a HuggingFace name. Defaults to the
      mounted weights, which is what works on an offline cluster; set it to a HuggingFace id only
      if the benchmark client can actually reach huggingface.co."
    value: ${{ artifacts.LOCAL_MODEL_PATH.path }}

workflow:
  name: modular_inference
  tasks:
    - name: benchmark
      operator: client
      script:
        - pip install aiperf==0.3.0
        - set -x
        # Render the aiperf results table at a fixed wide width. Without this, aiperf sizes the
        # table to the pod's default ~80 columns and TRUNCATES metric labels (e.g. "Output Token
        # Throughput (tokens/sec)" -> "Output Token"), unpredictably per run, which breaks any
        # log-scraping consumer (the k8s e2e verify perf check). Matches the self-contained recipes.
        - export COLUMNS=200
        - export AIPERF_DIR="${SFLOW_WORKFLOW_OUTPUT_DIR}/aiperf_concurrency_${{ variables.CONCURRENCY }}"
        - >
          aiperf profile
          --artifact-dir "${AIPERF_DIR}"
          --model ${{ variables.SERVED_MODEL_NAME }}
          --tokenizer ${{ variables.TOKENIZER }}
          --endpoint-type chat
          --endpoint /v1/chat/completions
          --streaming
          --url http://${{ backends.cluster.nodes[0].ip_address }}:8000
          --synthetic-input-tokens-mean ${{ variables.ISL }}
          --synthetic-input-tokens-stddev 0
          --output-tokens-mean ${{ variables.OSL }}
          --output-tokens-stddev 0
          --extra-inputs "min_tokens:${{ variables.OSL }}"
          --extra-inputs "ignore_eos:true"
          --extra-inputs "repetition_penalty:1.0"
          --extra-inputs "temperature: 0.0"
          --concurrency ${{ variables.CONCURRENCY }}
          --request-count ${{ variables.MULTI_ROUND * variables.CONCURRENCY }}
          --warmup-request-count ${{ variables.CONCURRENCY }}
          --num-dataset-entries ${{ variables.MULTI_ROUND * variables.CONCURRENCY }}
          --random-seed 100
          -H 'Authorization: Bearer NOT USED'
          -H 'Accept: text/event-stream'
          -H 'Connection: close'
          --record-processors 8
          --ui simple
        # aiperf EXITS 0 EVEN WHEN IT MEASURED NOTHING, so gate on its output.
        # Two distinct ways it "succeeds" with no benchmark:
        #   1. it never starts (bad --tokenizer) and writes no CSV at all;
        #   2. it starts, every request returns 200, but the server streams back
        #      no tokens -- then aiperf still reports "N valid requests and 0
        #      errors" and still writes the AGGREGATE rows (duration, request
        #      count), while the per-request latency section is empty. Counting
        #      rows cannot tell that apart from a real run, so require a metric
        #      that only exists once tokens were actually generated.
        - |
          csv="${AIPERF_DIR}/profile_export_aiperf.csv"
          if [ ! -s "$csv" ]; then
            echo "aiperf produced no results: $csv is missing or empty." >&2
            echo "Read the AIPerf errors above -- aiperf exits 0 even when it measures nothing." >&2
            exit 1
          fi
          if ! grep -q "Time to First Token" "$csv"; then
            echo "aiperf measured no generation: $csv has no per-request latency" >&2
            echo "metrics, so the server accepted the requests but returned no tokens." >&2
            echo "Check the server logs for KV-transfer / handshake errors." >&2
            exit 1
          fi
          echo "aiperf wrote $(($(wc -l < "$csv") - 1)) metric rows to $csv"
        - echo "Benchmarking finished"
      resources:
        nodes:
          indices: [0]
