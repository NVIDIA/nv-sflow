# Dynamo + vLLM DISAGGREGATED servers (backend-agnostic).
#
# Disaggregated variant of dynamo_vllm.yaml: instead of one `server`, it runs a
# `prefill_server` (context) and a `decode_server` (generation) that exchange the
# KV cache over NIXL. NATS/etcd/frontend still come from dynamo_common.yaml, and
# both workers declare `required_by: [benchmark]` so the benchmark waits for both.
#
# Each worker uses SERVER_GPUS (tensor-parallel size); disagg therefore needs
# 2 * SERVER_GPUS GPUs total. With the defaults (SERVER_GPUS=4) that is 8 GPUs, so
# run it on a single 8-GPU node (backends/k8s.yaml or backends/slurm.yaml) — vLLM
# workers here are single-node (intra-node tensor parallelism).
#
# Compose: a backend + dynamo_common.yaml + this file + benchmark.yaml, e.g.:
#   sflow run -f backends/k8s.yaml \
#             -f workloads/dynamo_common.yaml -f workloads/dynamo_vllm_disagg.yaml \
#             -f benchmark.yaml -s SERVER_GPUS=4 --dry-run

version: "0.1"

variables:
  SERVER_IMAGE:
    description: "Dynamo vLLM runtime image"
    value: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.0
  MODEL_PATH:
    description: "Model weights path visible to the server (PVC/hostPath on k8s, shared FS on slurm)"
    value: /models/Qwen3-0.6B
  SERVER_GPUS:
    description: "GPUs per worker (tensor-parallel size); disagg uses 2 * SERVER_GPUS total"
    type: integer
    value: 4

workflow:
  name: modular_inference
  tasks:
    - name: prefill_server
      operator: server
      script:
        - set -x
        # Distinct NIXL side-channel port from decode so a co-located prefill +
        # decode pair (single node, host_network) never share a host port.
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=5557
        # Keep the KV cache in bf16 (default): NIXL P/D disaggregation disables the
        # only fp8-query kernel, so `--kv-cache-dtype fp8` crashes with a dtype
        # mismatch. Model weights stay fp8; only the KV cache is bf16.
        - >
          python3 -m dynamo.vllm
          --model ${{ variables.MODEL_PATH }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.SERVER_GPUS }}
          --disaggregation-mode prefill
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          --no-enable-prefix-caching
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          # Two probes -- the worker is READY only when BOTH fire. The frontend
          # endpoint answers as soon as ANY worker registers, so on its own it is
          # unreliable for disagg; the per-worker log line is the authoritative
          # "this worker is serving" signal, so the benchmark waits for prefill AND
          # decode to each log it.
          - http_post:
              url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
              headers:
                Content-Type: "application/json"
              body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
            timeout: 1200
            each_check_timeout: 20
            interval: 20
          - log_watch:
              match_pattern: "re:Registering model with endpoint types|Model registration succeeded"
              match_count: 1
            timeout: 1200
            interval: 10
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: decode_server
      operator: server
      script:
        - set -x
        # Decode uses a different NIXL base port than prefill (5557).
        - export VLLM_NIXL_SIDE_CHANNEL_PORT=6557
        - >
          python3 -m dynamo.vllm
          --model ${{ variables.MODEL_PATH }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --tensor-parallel-size ${{ variables.SERVER_GPUS }}
          --disaggregation-mode decode
          --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          --no-enable-prefix-caching
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          - http_post:
              url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
              headers:
                Content-Type: "application/json"
              body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
            timeout: 1200
            each_check_timeout: 20
            interval: 20
          - log_watch:
              match_pattern: "re:Registering model with endpoint types|Model registration succeeded"
              match_count: 1
            timeout: 1200
            interval: 10
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30
