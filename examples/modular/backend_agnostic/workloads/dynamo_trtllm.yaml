# Dynamo + TensorRT-LLM aggregated server (backend-agnostic).
#
# Provides only the GPU `server` task; the NATS/etcd/frontend infra comes from
# dynamo_common.yaml. The server declares `required_by: [benchmark]` so it wires
# itself to the benchmark hub with no cross-file reference -- the benchmark task
# stays dependency-free and absent-when-omitted.
#
# Runs on any backend fragment: single-node on backends/k8s.yaml or
# backends/slurm.yaml (SERVER_GPUS <= GPUS_PER_NODE), cross-node on
# backends/k8s_mpi.yaml (SERVER_GPUS spanning nodes).

version: "0.1"

variables:
  SERVER_IMAGE:
    description: "Dynamo TRT-LLM runtime image"
    value: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
  MODEL_PATH:
    description: "Model weights path visible to the server (PVC/hostPath on k8s, shared FS on slurm)"
    value: /models/Qwen3-0.6B
  SERVER_GPUS:
    description: "GPUs per server (tensor-parallel size)"
    type: integer
    value: 4
  KV_CACHE_DTYPE:
    description: "KV cache dtype"
    value: fp8
  # Context sizing. chunked prefill is off, so max_num_tokens must exceed the input length (ISL)
  # and max_seq_len must exceed ISL+OSL, else trtllm 400s every request ("maximum context
  # length"). Defaults are generous (fit the standard probe up to ISL~6k) and match the
  # self-contained dynamo_trtllm_agg.yaml; override for larger inputs.
  MAX_NUM_TOKENS:
    description: "Engine max_num_tokens (must exceed ISL)"
    type: integer
    value: 6144
  MAX_SEQ_LEN:
    description: "Engine max_seq_len (must exceed ISL+OSL)"
    type: integer
    value: 24576

artifacts:
  # file:// + inline content works on every backend: a ConfigMap mount on k8s,
  # a controller-written file on slurm. Referenced as ${{ artifacts.NAME.path }}.
  - name: SERVER_CONFIG
    uri: file://trtllm_engine.yaml
    content: |
      tensor_parallel_size: ${{ variables.SERVER_GPUS }}
      moe_expert_parallel_size: ${{ variables.SERVER_GPUS }}
      pipeline_parallel_size: 1
      max_batch_size: 128
      max_num_tokens: ${{ variables.MAX_NUM_TOKENS }}
      max_seq_len: ${{ variables.MAX_SEQ_LEN }}
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: ${{ variables.KV_CACHE_DTYPE }}

workflow:
  name: modular_inference
  tasks:
    - name: server
      operator: server
      script:
        - set -x
        - export TLLM_LOG_LEVEL=INFO
        # k8s_mpi cross-node UCX: bind to the primary interface, let UCX auto-pick transports.
        - export TRTLLM_UCX_INTERFACE=${SFLOW_PRIMARY_IFACE:-eth0}
        - unset UCX_TLS
        # ONE MPI world across SERVER_GPUS ranks -- a local mpirun on a single k8s pod, or
        # cross-node over the injected hostfile on k8s_mpi/slurm. The mpirun launch is REQUIRED:
        # sflow's k8s_mpi operator only spans nodes when the final command is `mpirun` (else each
        # pod runs a lone 1-rank MPI world and the engine's tp_size=SERVER_GPUS fails validation).
        - >
          mpirun -np ${{ variables.SERVER_GPUS }} --allow-run-as-root
          trtllm-llmapi-launch python3 -m dynamo.trtllm
          --model-path ${{ variables.MODEL_PATH }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --extra-engine-args ${{ artifacts.SERVER_CONFIG.path }}
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          http_post:
            url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
            headers:
              Content-Type: "application/json"
            body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
          timeout: 1200
          interval: 20
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30
