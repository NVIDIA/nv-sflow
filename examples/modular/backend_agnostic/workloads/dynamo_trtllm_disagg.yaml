# Dynamo + TensorRT-LLM DISAGGREGATED servers (backend-agnostic).
#
# Disaggregated variant of dynamo_trtllm.yaml: a `prefill_server` (context) and a
# `decode_server` (generation) exchange the KV cache over the TRT-LLM cache
# transceiver (UCX). Each reads its own engine config artifact. NATS/etcd/frontend
# come from dynamo_common.yaml, and both workers declare `required_by: [benchmark]`
# so the benchmark waits for both.
#
# Each worker uses SERVER_GPUS (tensor-parallel size); disagg therefore needs
# 2 * SERVER_GPUS GPUs total. With the defaults (SERVER_GPUS=4) that is 8 GPUs.
# Runs on backends/k8s.yaml or backends/slurm.yaml (each worker single-node); a
# worker spans nodes on backends/k8s_mpi.yaml when SERVER_GPUS > GPUS_PER_NODE.
#
# Compose: a backend + dynamo_common.yaml + this file + benchmark.yaml, e.g.:
#   sflow run -f backends/k8s.yaml \
#             -f workloads/dynamo_common.yaml -f workloads/dynamo_trtllm_disagg.yaml \
#             -f benchmark.yaml -s SERVER_GPUS=4 --dry-run

version: "0.1"

variables:
  SERVER_IMAGE:
    description: "Dynamo TRT-LLM runtime image"
    value: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.0.0
  MODEL_PATH:
    description: "Model weights path visible to the server (PVC/hostPath on k8s, shared FS on slurm)"
    value: /models/Qwen3-0.6B
  SERVER_GPUS:
    description: "GPUs per worker (tensor-parallel size); disagg uses 2 * SERVER_GPUS total"
    type: integer
    value: 4
  KV_CACHE_DTYPE:
    description: "KV cache dtype"
    value: fp8

artifacts:
  # Separate prefill/decode engine configs. Both enable the cache transceiver
  # (backend: UCX) so the prefill worker can hand the KV cache to the decode
  # worker. file:// + inline content works on every backend (ConfigMap on k8s,
  # controller-written file on slurm).
  - name: PREFILL_CONFIG
    uri: file://trtllm_prefill.yaml
    content: |
      tensor_parallel_size: ${{ variables.SERVER_GPUS }}
      moe_expert_parallel_size: ${{ variables.SERVER_GPUS }}
      pipeline_parallel_size: 1
      max_batch_size: 128
      max_num_tokens: 4096
      max_seq_len: 2304
      print_iter_log: true
      disable_overlap_scheduler: true
      enable_chunked_prefill: false
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: ${{ variables.KV_CACHE_DTYPE }}
      cache_transceiver_config:
        max_tokens_in_buffer: 4096
        backend: UCX
  - name: DECODE_CONFIG
    uri: file://trtllm_decode.yaml
    content: |
      tensor_parallel_size: ${{ variables.SERVER_GPUS }}
      moe_expert_parallel_size: ${{ variables.SERVER_GPUS }}
      pipeline_parallel_size: 1
      max_batch_size: 128
      max_num_tokens: 4096
      max_seq_len: 2304
      print_iter_log: true
      cuda_graph_config:
        enable_padding: true
        max_batch_size: 128
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: ${{ variables.KV_CACHE_DTYPE }}
      cache_transceiver_config:
        max_tokens_in_buffer: 4096
        backend: UCX

workflow:
  name: modular_inference
  tasks:
    - name: prefill_server
      operator: server
      script:
        - set -x
        - export TLLM_LOG_LEVEL=INFO
        - >
          trtllm-llmapi-launch python3 -m dynamo.trtllm
          --model-path ${{ variables.MODEL_PATH }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --disaggregation-mode prefill
          --extra-engine-args ${{ artifacts.PREFILL_CONFIG.path }}
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          # Two probes -- the worker is READY only when BOTH fire. The frontend
          # endpoint answers as soon as ANY worker registers, so on its own it is
          # unreliable for disagg; the per-worker log line is the authoritative
          # "this worker is serving" signal, so the benchmark waits for prefill AND
          # decode to each log it.
          - http_post:
              url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
              headers:
                Content-Type: "application/json"
              body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
            timeout: 1200
            each_check_timeout: 20
            interval: 20
          - log_watch:
              match_pattern: "re:Registering model with endpoint types|Model registration succeeded"
              match_count: 1
            timeout: 1200
            interval: 10
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30

    - name: decode_server
      operator: server
      script:
        - set -x
        - export TLLM_LOG_LEVEL=INFO
        - >
          trtllm-llmapi-launch python3 -m dynamo.trtllm
          --model-path ${{ variables.MODEL_PATH }}
          --served-model-name ${{ variables.SERVED_MODEL_NAME }}
          --disaggregation-mode decode
          --extra-engine-args ${{ artifacts.DECODE_CONFIG.path }}
      resources:
        gpus:
          count: ${{ variables.SERVER_GPUS }}
      depends_on:
        - frontend_server
      required_by:
        - benchmark
      probes:
        readiness:
          - http_post:
              url: "http://${{ backends.cluster.nodes[0].ip_address }}:8000/v1/chat/completions"
              headers:
                Content-Type: "application/json"
              body: '{"model": "${{ variables.SERVED_MODEL_NAME }}", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 1}'
            timeout: 1200
            each_check_timeout: 20
            interval: 20
          - log_watch:
              match_pattern: "re:Registering model with endpoint types|Model registration succeeded"
              match_count: 1
            timeout: 1200
            interval: 10
        failure:
          log_watch:
            match_pattern: "Traceback (most recent call last)"
            match_count: 5
          interval: 30
